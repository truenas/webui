<form [formGroup]="form">
  <div class="columns">
    <div class="column">
      <tn-form-field
        [label]="'Name' | translate"
        [tooltip]="tooltips.name | translate"
        [required]="true"
      >
        <tn-input formControlName="name"></tn-input>
      </tn-form-field>
    </div>
    <div class="column">
      <tn-form-field
        [label]="'Phone' | translate"
        [tooltip]="tooltips.phone | translate"
        [required]="true"
      >
        <tn-input formControlName="phone"></tn-input>
      </tn-form-field>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      <tn-form-field
        [label]="'Email' | translate"
        [tooltip]="tooltips.email | translate"
        [required]="true"
      >
        <tn-input formControlName="email"></tn-input>
      </tn-form-field>
    </div>

    <div class="column">
      <tn-form-field
        [label]="'CC' | translate"
        [tooltip]="tooltips.cc | translate"
      >
        <tn-chip-input
          formControlName="cc"
          [ariaLabel]="'CC' | translate"
        ></tn-chip-input>
      </tn-form-field>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      <tn-form-field
        [label]="'Type' | translate"
        [tooltip]="tooltips.category | translate"
        [required]="true"
      >
        <tn-select formControlName="category" [options]="categoryOptions"></tn-select>
      </tn-form-field>
    </div>
    <div class="column"></div>
  </div>

  <div class="columns">
    <div class="column">
      <tn-form-field [label]="'Environment' | translate" [required]="true">
        <tn-select formControlName="environment" [options]="environmentOptions"></tn-select>
      </tn-form-field>
    </div>

    <div class="column">
      <tn-form-field [label]="'Criticality' | translate" [required]="true">
        <tn-select formControlName="criticality" [options]="criticalityOptions"></tn-select>
      </tn-form-field>
    </div>
  </div>

  <tn-form-field [label]="'Subject' | translate" [required]="true">
    <tn-input
      formControlName="title"
      [placeholder]="tooltips.title | translate"
    ></tn-input>
  </tn-form-field>

  <tn-form-field [label]="'Message' | translate" [required]="true">
    <tn-input
      formControlName="message"
      [multiline]="true"
      [rows]="8"
      [placeholder]="messagePlaceholder | translate"
    ></tn-input>
  </tn-form-field>

  <tn-form-field
    [tooltip]="tooltips.attach_debug | translate"
    [hint]="'Debugs may contain log files with personal information such as usernames or other identifying information about your system.' | translate"
  >
    <tn-checkbox
      formControlName="attach_debug"
      [label]="'Attach debug' | translate"
    ></tn-checkbox>
  </tn-form-field>

  <tn-form-field [tooltip]="'Capture and attach screenshot to the review' | translate">
    <tn-checkbox
      formControlName="take_screenshot"
      [label]="'Take screenshot of the current page' | translate"
    ></tn-checkbox>
  </tn-form-field>

  <tn-form-field>
    <tn-checkbox
      formControlName="attach_images"
      [label]="'Attach additional images' | translate"
    ></tn-checkbox>
  </tn-form-field>

  @if (form.controls.attach_images.value) {
    <!--
      `tn-file-input` composes its own id under a `file-input-*` prefix and has no control-name
      fallback, so the legacy `input-images` is pinned on the host instead — see the tn-button
      anchor precedent in the migration playbook.
    -->
    <tn-form-field
      class="attach-images"
      [label]="'Attach images (optional)' | translate"
      [tooltip]="'Select images you want attach to review' | translate"
    >
      <tn-file-input
        tnTestIdType="input"
        formControlName="images"
        [tnTestId]="'images'"
        [multiple]="true"
        [accept]="acceptedFiles"
        [ariaLabel]="'Attach images (optional)' | translate"
        [buttonLabel]="'Choose File' | translate"
        [noFileText]="'No file chosen' | translate"
      ></tn-file-input>
    </tn-form-field>
  }
</form>

<ng-template #dialogActions>
  <tn-button
    testId="user-guide"
    [label]="'User Guide' | translate"
    (onClick)="onUserGuidePressed()"
  ></tn-button>

  <tn-button
    testId="eula"
    [label]="'EULA' | translate"
    (onClick)="onEulaPressed()"
  ></tn-button>

  <tn-button
    color="primary"
    testId="submit"
    [label]="'Submit' | translate"
    [disabled]="form.invalid || isLoading()"
    (onClick)="onSubmit()"
  ></tn-button>
</ng-template>
