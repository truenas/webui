<canvas
  baseChart
  [datasets]="chartData()"
  [options]="chartOptions"
></canvas>
<div class="label-container">
  <div class="label" tnTestIdType="text" [tnTestId]="labelTestId()">{{ label() }}</div>
  @if (sublabel()) {
    <div class="sublabel" tnTestIdType="text" [tnTestId]="sublabelTestId()">{{ sublabel() }}</div>
  }
</div>
