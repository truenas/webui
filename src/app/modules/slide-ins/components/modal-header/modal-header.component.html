<header class="ix-slidein-title-bar">
  @if (isStacked() && !disableClose()) {
    <tn-icon-button
      id="ix-close-icon"
      name="chevron-left"
      library="mdi"
      size="sm"
      tooltipPosition="left"
      [testId]="['close-slide-in']"
      [tooltip]="'Go back to the previous form' | translate"
      [ariaLabel]="'Close {formType} Form' | translate: { formType: title() }"
      (onClick)="close()"
    ></tn-icon-button>
  }

  <h2 class="ix-form-title">{{ title() ? (title() | translate) : '' }}</h2>

  @if (showReadOnlyBadge()) {
    <ix-readonly-badge></ix-readonly-badge>
  }

  @if (!isStacked() && !disableClose()) {
    <tn-icon-button
      id="ix-close-icon"
      name="close"
      library="mdi"
      size="sm"
      tooltipPosition="left"
      [testId]="['close-slide-in']"
      [tooltip]="'Close the form' | translate"
      [ariaLabel]="'Close {formType} Form' | translate: { formType: title() }"
      (onClick)="close()"
    ></tn-icon-button>
  }
</header>

@if (loading()) {
  <tn-progress-bar
    class="progress-bar"
    mode="indeterminate"
    [ariaLabel]="'Loading' | translate"
  ></tn-progress-bar>
}
