<div
  class="sticky top-0 z-20 bg-background bg-opacity-100 flex justify-center items-center h-20 pt-4 relative"
  [class.has-many-components]="(componentsSize$ | async) > 1"
>
  @if ((componentsSize$ | async) > 1 && !disableClose()) {
    <tn-icon-button
      name="chevron-left"
      library="mdi"
      class="absolute left-4"
      id="ix-close-icon"
      tnTooltipPosition="left"
      [ixTest]="['close-slide-in']"
      [tnTooltip]="tooltip()"
      [attr.aria-label]="'Close {formType} Form' | translate: { formType: title() }"
      (click)="close()"
    ></tn-icon-button>
  }
  <h3 class="ix-form-title">
    {{ title() ? (title() | translate) : '' }}
    @if (requiredRoles().length && !(hasRequiredRoles | async)) {
      <ix-readonly-badge></ix-readonly-badge>
    }
  </h3>
  @if ((componentsSize$ | async) <= 1 && !disableClose()) {
    <tn-icon-button
      name="close"
      library="mdi"
      class="absolute right-4"
      id="ix-close-icon"
      tnTooltipPosition="left"
      [ixTest]="['close-slide-in']"
      [tnTooltip]="tooltip()"
      [attr.aria-label]="'Close {formType} Form' | translate: { formType: title() }"
      (click)="close()"
      (keydown.enter)="close()"
    ></tn-icon-button>
  }
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" class="progress-bar"></mat-progress-bar>
}
