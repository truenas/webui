<!-- Deliberately a `div`, not a `header`: a `header` outside article/aside/main/nav/section maps to
     role="banner", and this renders inside the container's role="dialog" — which does not scope it
     out. It would become the page's only banner landmark whenever a slide-in is open. -->
<div class="ix-slidein-title-bar">
  @if (isStacked() && !disableClose()) {
    <tn-icon-button
      id="ix-close-icon"
      name="chevron-left"
      library="mdi"
      size="sm"
      tooltipPosition="left"
      [testId]="['close-slide-in']"
      [tooltip]="'Go back to the previous form' | translate"
      [ariaLabel]="'Close {formType} Form' | translate: { formType: title() }"
      (onClick)="close()"
    ></tn-icon-button>
  }

  <!-- The title truncates to protect the height the container reserves for this bar, so the full
       text is offered on hover/focus. Screen readers read the heading in full either way. -->
  <h2
    class="ix-form-title"
    tnTooltipPosition="below"
    [tnTooltip]="title() ? (title() | translate) : ''"
  >{{ title() ? (title() | translate) : '' }}</h2>

  @if (showReadOnlyBadge()) {
    <ix-readonly-badge></ix-readonly-badge>
  }

  @if (!isStacked() && !disableClose()) {
    <tn-icon-button
      id="ix-close-icon"
      name="close"
      library="mdi"
      size="sm"
      tooltipPosition="left"
      [testId]="['close-slide-in']"
      [tooltip]="'Close the form' | translate"
      [ariaLabel]="'Close {formType} Form' | translate: { formType: title() }"
      (onClick)="close()"
    ></tn-icon-button>
  }
</div>

@if (loading()) {
  <tn-progress-bar
    class="progress-bar"
    mode="indeterminate"
    [ariaLabel]="'Loading' | translate"
  ></tn-progress-bar>
}
