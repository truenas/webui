<!-- <ix-breadcrumb class="breadcrumbs"></ix-breadcrumb> -->
<div
  class="flex justify-between rounded-tl-4xl items-center pt-3 pb-5 px-5 bg-[#fcfaff] border-b border-border text-foreground sticky z-10"
  [ngClass]="'top-0'">
  <div>
    @let title = pageTitle();
    <h1>
      {{ title ? (title | translate) : (currentTitle$ | async | translate) }}
    </h1>

    @if (tooltip()) {
    <ix-tooltip class="tooltip" [message]="tooltip() | translate"></ix-tooltip>
    }

    @if ((hasNewIndicator$ | async) || customBadgeTitle()) {
    <ix-header-badge [customBadgeTitle]="customBadgeTitle()"></ix-header-badge>
    }
  </div>

  <div class="flex items-center gap-5">
    <ng-content></ng-content>
    @if (!isSub()) {
    <div class="border-r h-[42px]"></div>
    <div class="flex items-center gap-5">
      <button mat-button class="cursor-pointer border w-[46px] h-[42px] rounded-full flex items-center justify-center"
        (click)="minimize()">
        <ix-icon name="mdi-minus"></ix-icon>
      </button>

      <!-- <a matIconButton class="cursor-pointer">
          <ix-icon name="mdi-fullscreen"></ix-icon>
        </a> -->

      <button class="cursor-pointer border w-[46px] h-[42px] rounded-full flex items-center justify-center"
        (click)="close()">
        <ix-icon name="mdi-close"></ix-icon>
      </button>
    </div>
    }
  </div>
</div>
@if (loading()) {
<ix-fake-progress-bar [loading]="true"></ix-fake-progress-bar>
}
