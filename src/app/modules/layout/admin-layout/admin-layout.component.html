<!-- 'background-image': `url('assets/images/backgrounds/white-bg.jpg')`, -->
<mat-sidenav-container
  class="app-side-nav-container flex flex-col h-full overflow-hidden"
  [style]="{
    background: '#e4d3fd',
  }"
>
  <ix-app-bar></ix-app-bar>
  <ix-topbar></ix-topbar>

  <main
    mat-sidenav-content
    class="h-full pt-[104px] pb-[30px] pr-[30px] pl-[110px]"
    [ngClass]=""
  >
    <div
      class="relative h-full rounded-xl overflow-hidden"
      [ngClass]="router.url.startsWith('/desktop') ? '' : 'bg-background'"
    >
      <div class="overflow-auto h-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>

  <!-- Alert bar -->
  @if (isInit) {
    <mat-sidenav
      class="alert-sidenav"
      position="end"
      [opened]="isAlertPanelOpen$ | async"
      (closed)="onAlertsPanelClosed()"
    >
      <ix-alerts-panel></ix-alerts-panel>
    </mat-sidenav>
  }
</mat-sidenav-container>
