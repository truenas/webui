@if ((loggedInUser$ | async); as user) {
  <div class="user-menu-wrapper gap-2 mx-2">
    @if (user.pw_name) {
      <div
        class="bg-background! h-[50px]! w-[200px]! rounded-full! px-4 flex items-center justify-center !text-foreground"
      >
        {{ user.pw_name }}
      </div>
    }
    <button
      name="Settings"
      mat-icon-button
      class="bg-background! h-[50px]! w-[50px]! rounded-full! flex items-center justify-center"
      ixTest="user-menu"
      [matTooltip]="tooltips.settings | translate"
      [ixUiSearch]="searchableElements.elements.userMenu"
      [matMenuTriggerFor]="userMenu"
    >
      <tn-icon size="lg" name="app-account_circle" library="custom" class="!text-foreground"></tn-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      @if (user.account_attributes?.includes(AccountAttribute.Local)) {
        <button
          name="settings-change-password"
          mat-menu-item
          ixTest="change-password"
          [ixUiSearch]="searchableElements.elements.changePassword"
          (click)="openChangePasswordDialog()"
        >
          <tn-icon size="md" name="app-dialpad" library="custom"></tn-icon>
          {{ 'Change Password' | translate }}
        </button>
      }

      @if (isTwoFactorEnabledGlobally$ | async) {
        <button
          name="settings-2fa"
          mat-menu-item
          ixTest="2fa"
          (click)="onTwoFactorAuth()"
        >
          <tn-icon size="md" name="tn-two-factor-auth"></tn-icon>
          {{ 'Two-Factor Authentication' | translate }}
        </button>
      }

      <!-- <button
        name="settings-preferences"
        mat-menu-item
        ixTest="preferences"
        [ixUiSearch]="searchableElements.elements.preferences"
        (click)="openPreferencesForm()"
      >
        <tn-icon size="lg" name="cog" library="mdi"></tn-icon>
        {{ 'Preferences' | translate }}
      </button> -->

      <a
        name="settings-api"
        ixTest="api-keys"
        mat-menu-item
        [routerLink]="['/credentials/users/api-keys']"
        [queryParams]="{ userName: user.pw_name }"
        [ixUiSearch]="searchableElements.elements.myApiKeys"
      >
        <tn-icon size="md" name="app-laptop" library="custom"></tn-icon>
        {{ 'My API Keys' | translate }}
      </a>

      <a
        name="settings-guide"
        mat-menu-item
        href="https://harboros.ai/docs"
        target="_blank"
        ixTest="guide"
        [ixUiSearch]="searchableElements.elements.guide"
      >
        <tn-icon size="md" name="app-book-multiple" library="custom"></tn-icon>
        {{ 'Guide' | translate }}
      </a>

      <!-- Inline styles because mat-menu contents are rendered outside of the component -->
      <mat-divider style="margin: 5px 0;"></mat-divider>

      <button
        name="power-log-out"
        mat-menu-item
        ixTest="log-out"
        [ixUiSearch]="searchableElements.elements.logOut"
        (click)="onSignOut()"
      >
        <tn-icon size="md" name="app-logout" library="custom"></tn-icon>
        {{ 'Log Out' | translate }}
      </button>
    </mat-menu>
  </div>
}
