<button
  name="Power"
  mat-icon-button
  class="topbar-button-right size-[50px]! bg-background!"
  ixTest="power-menu"
  [matTooltip]="tooltips.power | translate"
  [matMenuTriggerFor]="powerMenu"
  [ixUiSearch]="searchableElements.elements.powerMenu"
>
  <ix-icon class="!text-foreground" name="ix-power_settings_new"></ix-icon>
</button>
<mat-menu #powerMenu="matMenu">
  <button
    *ixRequiresRoles="requiredRoles"
    name="power-restart"
    mat-menu-item
    ixTest="restart"
    [ixUiSearch]="searchableElements.elements.restart"
    (click)="onReboot()"
  >
    <tn-icon size="lg" name="refresh" library="mdi"></tn-icon>
    {{ 'Restart' | translate }}
  </button>

  <button
    *ixRequiresRoles="requiredRoles"
    name="power-shut-down"
    mat-menu-item
    ixTest="shut-down"
    [ixUiSearch]="searchableElements.elements.shutDown"
    (click)="onShutdown()"
  >
    <ix-icon name="power_settings_new"></ix-icon>
    {{ 'Shut Down' | translate }}
  </button>
</mat-menu>
