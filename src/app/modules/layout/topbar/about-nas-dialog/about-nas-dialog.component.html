<div class="text-center">
  <h1 matDialogTitle>{{ "About HarborOS" | translate }}</h1>

  <mat-dialog-content>
    <div class="flex gap-4">
      <div class="!text-card-foreground w-1/4 text-right font-medium">
        {{ "CPU Model" | translate }}
      </div>
      <div *ixWithLoadingState="cpuModel$ as cpuModel">{{ cpuModel }}</div>
    </div>

    <div class="flex gap-4">
      <div class="!text-card-foreground w-1/4 text-right font-medium">
        {{ "Memory" | translate }}
      </div>
      <div>
        {{ systemInfo.memory }}
      </div>
    </div>

    <div class="flex gap-4">
      <div class="!text-card-foreground w-1/4 text-right font-medium">
        {{ "Version" | translate }}
      </div>
      <div>{{ systemInfo.version }}</div>
    </div>

    <div class="mt-4">
      <p>
        HarborOS® © 2025 Harborinno Ltd.
        <br />
        dba
        <a target="_blank" href="https://github.com/HarborNAS">HarborOS</a>
      </p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-dialog-close mat-button (click)="close()">
      {{ "OK" | translate }}
    </button>
  </mat-dialog-actions>
</div>
