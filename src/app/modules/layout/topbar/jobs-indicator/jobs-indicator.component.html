@let jobBadgeCount = jobBadgeCount$ | async;
<button
  matBadgeSize="small"
  matBadgeColor="warn"
  mat-icon-button
  id="task-manager"
  class="topbar-button-right bg-background! size-[50px]! rounded-full!"
  ixTest="jobs-manager"
  [matBadge]="jobBadgeCount"
  [matBadgeHidden]="jobBadgeCount === 0"
  [matTooltip]="tooltips.taskManager | translate"
  [ixUiSearch]="searchableElements.elements.jobs"
  (click)="onIndicatorPressed()"
>
  <tn-icon class="!text-foreground" size="lg" name="app-assignment" library="custom"></tn-icon>
</button>
