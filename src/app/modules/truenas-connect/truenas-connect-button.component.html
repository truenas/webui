<button
  ixTest="tnc-show-status"
  mat-icon-button
  [matTooltip]="tooltip()"
  (click)="showStatus()"
>
  <span class="icon-wrapper">
    <img width="24" height="24" src="assets/icons/custom/harbor-logo-mark.svg" alt="Harbor Logo" class="system-logo">
    @if (showBadge()) {
      <span [class]="'tier-badge ' + tierCssClass()">{{ tierLabel() }}</span>
    }
  </span>
</button>
