@if (hiddenColumns().length) {
  <dl class="table-hidden-columns">
    @for (column of hiddenColumns(); track column) {
      <div>
        <b>{{ column.title ? (column.title | translate) : '' }}:</b>
        <span
          tnTestIdType="text"
          [tnTestId]="[column.title, uniqueRowTag(), column.testIdSuffix ?? 'row-text']"
        >{{ value(column) }}</span>
      </div>
    }
    <tn-divider></tn-divider>
  </dl>
}

<ng-content></ng-content>
