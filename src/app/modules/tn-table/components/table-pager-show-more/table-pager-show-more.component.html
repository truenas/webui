@if (collapsible() && !expanded()) {
  <tn-button
    variant="outline"
    [label]="'View All' | translate"
    [testId]="showMoreTestId()"
    (onClick)="showMore()"
  ></tn-button>
}
@if (collapsible() && expanded()) {
  <tn-button
    variant="outline"
    [label]="'Collapse' | translate"
    [testId]="showLessTestId()"
    (onClick)="showLess()"
  ></tn-button>
}
