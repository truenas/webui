@if (label() || tooltip()) {
  <ix-label
    [label]="label()"
    [tooltip]="tooltip()"
    [required]="required()"
  ></ix-label>
}

<div
  class="container-items"
  cdkDropList
  [style.minHeight]="minHeight()"
  [style.maxHeight]="maxHeight()"
  (cdkDropListDropped)="drop($event)"
  >
  <tn-list [attr.aria-label]="label()">
    @for (item of items; track item) {
      <tn-list-item cdkDrag>
        <!--
          TEMP: the drag handle sits in tn-list-item's default slot rather than its
          [tnListIcon] slot, which never renders. Same library bug as in
          dual-listbox.component.html, tracked under NAS-141021.
        -->
        <div class="toggle-row">
          <tn-icon class="drag-handle" name="drag-vertical" library="mdi"></tn-icon>

          <tn-slide-toggle
            class="toggle"
            color="primary"
            labelPosition="before"
            [label]="item.label | translate"
            [checked]="isChecked(item.value)"
            [disabled]="isDisabled"
            [testId]="item.testId"
            (change)="onCheckboxChanged(item.value)"
            (focusout)="onTouch()"
          ></tn-slide-toggle>
        </div>
      </tn-list-item>
    }
  </tn-list>
</div>

<ix-errors [control]="controlDirective.control" [label]="label()"></ix-errors>
