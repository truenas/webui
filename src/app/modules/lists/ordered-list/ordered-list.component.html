@if (label() || tooltip()) {
  <ix-label
    [label]="label()"
    [tooltip]="tooltip()"
    [required]="required()"
  ></ix-label>
}

<div
  class="container-items"
  cdkDropList
  [style.minHeight]="minHeight()"
  [style.maxHeight]="maxHeight()"
  (cdkDropListDropped)="drop($event)"
  >
  <tn-list [attr.aria-label]="label()">
    @for (item of items; track item.value) {
      <tn-list-item cdkDrag>
        <tn-icon
          tnListIcon
          name="drag-vertical"
          library="mdi"
          aria-hidden="true"
        ></tn-icon>

        <tn-slide-toggle
          color="primary"
          labelPosition="before"
          [fullWidth]="true"
          [label]="item.label | translate"
          [checked]="isChecked(item.value)"
          [disabled]="isDisabled"
          [testId]="item.testId"
          (change)="onCheckboxChanged(item.value)"
          (focusout)="onTouch()"
        ></tn-slide-toggle>
      </tn-list-item>
    }
  </tn-list>
</div>

<ix-errors [control]="controlDirective.control" [label]="label()"></ix-errors>
