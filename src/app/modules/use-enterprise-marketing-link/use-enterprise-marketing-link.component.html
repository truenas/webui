@let message = currentMessage();
@let href = currentMessageHref();

@if (href) {
  <a
    tnTestId="use-enterprise-marketing-link"
    tnTestIdType="link"
    target="_blank"
    rel="noopener noreferrer"
    [href]="href"
  >
    <span class="text-above">
      {{ message.text | translate }}
    </span>

    <span>
      {{ message.cta | translate }}
    </span>
  </a>
} @else {
  <div class="no-link" tnTestId="use-enterprise-marketing-link" tnTestIdType="text">
    <span class="text-above">
      {{ message.text | translate }}
    </span>

    @if (message.cta) {
      <span>
        {{ message.cta | translate }}
      </span>
    }
  </div>
}
