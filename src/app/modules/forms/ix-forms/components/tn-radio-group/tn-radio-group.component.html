<div role="radiogroup" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <tn-radio
      [formControl]="innerControl"
      [name]="name()"
      [value]="option.value"
      [label]="option.label"
      [testId]="optionTestId(option)"
    ></tn-radio>
  }
</div>
