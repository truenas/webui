<div role="radiogroup" [attr.aria-label]="resolvedAriaLabel()">
  @for (item of renderItems(); track item.trackBy) {
    <tn-radio
      [formControl]="innerControl"
      [name]="name()"
      [value]="item.option.value"
      [label]="item.option.label"
      [testId]="item.testId"
    ></tn-radio>
  }
</div>
