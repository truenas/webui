<!--
  TODO: NAS-141021 — still mat-button. This is a text button blended into the explorer panel
  (`background: inherit`) and tn-button ships no text variant (0.3.26: `filled` | `outline`), so
  converting it needs the library to grow one. Left to the ix-explorer child ticket, which owns
  this whole modules/forms surface.
-->
<button
  *ixRequiresRoles="requiredRoles"
  mat-button
  type="button"
  class="create-btn"
  ixTest="create-zvol"
  [disabled]="isButtonDisabled()"
  (click)="onCreateZvol()"
>
  <tn-icon name="database" library="mdi"></tn-icon>
  {{ 'Create Zvol' | translate }}
</button>
