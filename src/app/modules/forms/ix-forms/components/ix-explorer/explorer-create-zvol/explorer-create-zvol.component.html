<!-- type="button" is stated explicitly, as on every other in-form tn-button: this is projected into
     <ix-explorer>, which callers render inside a <form> it must never submit. -->
<tn-button
  *ixRequiresRoles="requiredRoles"
  type="button"
  variant="outline"
  class="create-btn"
  testId="create-zvol"
  icon="mdi-database"
  [label]="'Create Zvol' | translate"
  [disabled]="isButtonDisabled()"
  (onClick)="onCreateZvol()"
></tn-button>
