<div class="input-container" [class.disabled]="isDisabled">
  <input
    #addressInput
    type="text"
    tnTestIdType="input"
    [required]="required()"
    [tnTestId]="controlDirective.name"
    [disabled]="isDisabled"
    [value]="address"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="fieldAria.labelledby()"
    [attr.aria-describedby]="fieldAria.describedby()"
    [attr.aria-invalid]="fieldAria.invalid()"
    (input)="onAddressInput(addressInput)"
    (blur)="onTouched()"
  />
  <div class="slash">/</div>
  <tn-select
    class="select"
    testId="netmasks"
    [disabled]="isDisabled"
    [options]="netmaskOptions"
    [ngModel]="netmask"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onNetmaskChange($event)"
  ></tn-select>
</div>
