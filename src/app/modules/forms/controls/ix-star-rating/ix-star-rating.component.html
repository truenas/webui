<!-- `focusout` bubbles where `blur` does not, so one handler marks the whole group touched. -->
<div class="star-rating" (focusout)="onTouch()">
  @for (rating of ratings(); track index; let index = $index) {
    <tn-icon-button
      library="mdi"
      size="lg"
      [name]="value >= index + 1 ? 'star' : 'star-outline'"
      [disabled]="isDisabled"
      [testId]="[controlDirective.name, index + 1]"
      [ariaLabel]="'Click to give {index} star rating.' | translate: { index: index + 1 }"
      (onClick)="onValueChanged(index + 1)"
    ></tn-icon-button>
  }
</div>
