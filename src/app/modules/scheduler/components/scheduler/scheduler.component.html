<tn-form-field
  [label]="label() || ''"
  [tooltip]="tooltip() || ''"
  [required]="required()"
>
  <tn-select
    [formControl]="selectControl"
    [options]="options()"
    [optionTestIdKey]="optionTestIdByLabel"
    [testId]="[controlDirective.name, 'presets']"
    [ariaLabel]="label() || ''"
  ></tn-select>
</tn-form-field>
