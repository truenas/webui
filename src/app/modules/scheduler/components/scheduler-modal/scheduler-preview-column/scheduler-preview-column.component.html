<section class="preview-header">
  <h4 class="crontab-header">
    {{ 'Schedule Preview' | translate }}
    <div class="close-wrapper">
      <tn-icon-button
        class="close-btn"
        name="close"
        library="mdi"
        testId="close-scheduler"
        [ariaLabel]="'Close scheduler' | translate"
        (onClick)="closeRequested.emit()"
      ></tn-icon-button>
    </div>
  </h4>
  <div class="crontab">{{ crontab() }}</div>
  <div class="crontab-explanation">{{ crontab() | crontabExplanation }}</div>
</section>

<div class="calendar">
  <tn-calendar
    [markedDates]="markedDates()"
    (activeDateChange)="activeDate.set($event)"
  ></tn-calendar>
</div>

<div class="schedule-list">
  <div class="timezone-message">
    <strong>{{ 'System Time Zone:' | translate }}</strong> {{ timezone() }}
  </div>

  <!-- cronPreview is null for a past month, so it doubles as the "nothing to preview" guard. -->
  @if (cronPreview(); as preview) {
    <ix-scheduler-date-examples
      class="schedule-example-section"
      [cronPreview]="preview"
      [startDate]="startDate()"
    ></ix-scheduler-date-examples>
  }
</div>
