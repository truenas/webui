<h1 mat-dialog-title>{{ options.title | translate }}</h1>
<div mat-dialog-content id="confirm-msg">
  <div class="message-content">
    <span [innerHTML]="options.message | translate"></span>

    @let preferencesHint = changeTimeoutHint | translate | splitLink;
    <p>
      {{ preferencesHint.before }}<button
        class="preferences-link"
        (click)="openPreferences()"
      >{{ preferencesHint.link }}</button>{{ preferencesHint.after }}
    </p>
  </div>
</div>

<div mat-dialog-actions>
  <button
    mat-button
    color="primary"
    name="ok_button"
    class="submit-button"
    ixTest="session-expiring-extend-confirm"
    (click)="extendSession()"
  >
    {{ options.buttonText | translate }}
  </button>
</div>
