<table tnTestId="summary-table" tnTestIdType="table">
  @for (section of sections(); track section) {
    @for (row of section; track row.item; let i = $index) {
      <tr
        class="summary-line"
        tnTestIdType="row"
        [tnTestId]="row.testId"
        [class.section-start]="i === 0"
      >
        <td class="summary-line-label">{{ row.item.label | translate }}:</td>
        <td class="summary-line-value">{{ row.item.value | translate }}</td>
      </tr>
    }
  }
</table>
