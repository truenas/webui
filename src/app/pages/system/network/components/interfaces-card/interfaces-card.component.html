<tn-card padding="small">
  <h3 tnCardHeader class="tn-card__title">{{ 'Interfaces' | translate }}</h3>

  <ng-template tnCardFooterActions>
    <tn-button
      *ixRequiresRoles="requiredRoles"
      color="primary"
      variant="filled"
      [label]="'Add' | translate"
      [testId]="['add', 'interface']"
      [disabled]="isHaEnabled()"
      [tnTooltip]="'Editing interfaces is not allowed while HA is enabled' | translate"
      [tnTooltipDisabled]="!isHaEnabled()"
      [ixUiSearch]="searchableElements.addInterface"
      (onClick)="onAddNew()"
    ></tn-button>
  </ng-template>

  <tn-table
    class="interfaces-table"
    [ixUiSearch]="searchableElements.interfaces"
    [rowTestId]="uniqueRowTag"
    [dataSource]="rows()"
    [displayedColumns]="displayedColumns"
    [loading]="isLoading()"
    (sortChange)="onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'state'" [width]="'40px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <ix-interface-status-icon
          tnTestIdType="text"
          [update]="inOutUpdates()[row.name]"
          [tnTestId]="['state', uniqueRowTag(row), 'row-state']"
        ></ix-interface-status-icon>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'name'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Name' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="nameWithDescription(row)"
          [title]="'Name' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'ip_addresses'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'IP Addresses' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-ip-addresses-cell
          tnTestIdType="text"
          [row]="row"
          [tnTestId]="[('IP Addresses' | translate), uniqueRowTag(row), 'row-text']"
        ></ix-ip-addresses-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'mac'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'MAC Address' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.state.permanent_link_address"
          [title]="'MAC Address' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-actions-cell
          [actions]="actions"
          [row]="row"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
        ></ix-table-actions-cell>
      </ng-template>
    </ng-container>
  </tn-table>
</tn-card>
