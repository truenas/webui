<ix-page-header>
  <ix-basic-search [query]="searchQuery()" (queryChange)="onListFiltered($event)"></ix-basic-search>
  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="primary"
    [testId]="'add-jbof'"
    [label]="'Add' | translate"
    [disabled]="!canAddJbof()"
    [tnTooltip]="'No available licensed Expansion Shelves ' | translate"
    [tnTooltipDisabled]="canAddJbof()"
    (onClick)="openForm()"
  ></tn-button>
</ix-page-header>

<div class="table-container" [ixUiSearch]="searchableElements.elements.jbof">
  @let emptyConf = emptyService.defaultEmptyConfig(dataProvider.emptyType$ | async);
  <tn-table
    [dataSource]="(dataProvider.currentPage$ | async) ?? []"
    [displayedColumns]="displayedColumns"
    [trackBy]="trackByJbofId"
    [loading]="!!(dataProvider.isLoading$ | async)"
    [emptyMessage]="emptyConf?.title ? (emptyConf.title | translate) : ''"
    [emptyIcon]="emptyConf?.icon ?? ''"
    (sortChange)="onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'description'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Description' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('Description' | translate), uniqueRowTag(row), 'row-text']"
        >{{ row.description }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'ips'">
      <ng-template tnHeaderCellDef>{{ 'IPs' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('IPs' | translate), uniqueRowTag(row), 'row-text']"
        >{{ formatIps(row) }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'mgmt_username'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Username' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('Username' | translate), uniqueRowTag(row), 'row-text']"
        >{{ row.mgmt_username }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-actions-cell
          mode="inline"
          [actions]="actions"
          [row]="row"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
        ></ix-table-actions-cell>
      </ng-template>
    </ng-container>
  </tn-table>
  <tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
</div>
