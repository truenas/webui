<ix-page-header>
  <ix-basic-search [query]="searchQuery()" (queryChange)="onListFiltered($event)"></ix-basic-search>
  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="primary"
    [testId]="'add-jbof'"
    [label]="'Add' | translate"
    [disabled]="!canAddJbof()"
    [tnTooltip]="'No available licensed Expansion Shelves ' | translate"
    [tnTooltipDisabled]="canAddJbof()"
    (onClick)="openForm()"
  ></tn-button>
</ix-page-header>

<div class="table-container" [ixUiSearch]="searchableElements.elements.jbof">
  <ix-table
    [ix-table-empty]="!(dataProvider.currentPageCount$ | async)"
    [emptyConfig]="emptyConfigService.defaultEmptyConfig(dataProvider.emptyType$ | async)"
  >
    <thead
      ix-table-head
      [columns]="columns"
      [dataProvider]="dataProvider"
    ></thead>
    <tbody
      ix-table-body
      [columns]="columns"
      [dataProvider]="dataProvider"
      [isLoading]="!!(dataProvider.isLoading$ | async)"
    >
    </tbody>
  </ix-table>
  <tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
</div>
