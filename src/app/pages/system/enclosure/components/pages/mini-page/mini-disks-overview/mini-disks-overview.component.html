<h3>{{ 'Disks Overview' | translate }}</h3>

<ul class="overview">
  <li class="item">
    <div class="label">{{ 'Pools:' | translate }}</div>
    <div class="value" tnTestId="total-pools" tnTestIdType="text">{{ totalPools() }}</div>
  </li>

  <li class="item">
    <div class="label">{{ 'Total Disks:' | translate }}</div>
    <div class="value" tnTestId="total-disks" tnTestIdType="text">{{ totalDisks() }}</div>
  </li>

  <li class="item">
    <div class="label">{{ 'Failed Disks:' | translate }}</div>
    <div class="value" tnTestId="failed-disks" tnTestIdType="text">{{ failedDisks() }}</div>
  </li>
</ul>
