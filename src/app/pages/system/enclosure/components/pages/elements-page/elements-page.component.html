<tn-card>
  <ix-enclosure-header tnCardHeader [title]="title()"></ix-enclosure-header>

  @if (!viewElements()) {
    <ix-empty [conf]="noView"></ix-empty>
  } @else {
    <ix-table>
      <thead
        ix-table-head
        [columns]="columns"
        [dataProvider]="dataProvider()"
      ></thead>
      <tbody
        ix-table-body
        [columns]="columns"
        [dataProvider]="dataProvider()"
      ></tbody>
    </ix-table>
  }
</tn-card>
