<tn-card>
  <ix-enclosure-header tnCardHeader [title]="title()"></ix-enclosure-header>

  @if (!viewElements()) {
    <tn-empty
      icon="alert-octagon"
      iconLibrary="mdi"
      iconSize="90px"
      [title]="'N/A' | translate"
      [description]="'This view is not available for this enclosure.' | translate"
    ></tn-empty>
  } @else {
    <tn-table
      [testId]="'table-table'"
      [dataSource]="list.rows()"
      [displayedColumns]="list.displayedColumns()"
      [emptyMessage]="list.empty.message()"
      [emptyDescription]="list.empty.description()"
      [emptyIcon]="list.empty.icon()"
      (sortChange)="list.onSortChange($event)"
    >
      <ng-container [tnColumnDef]="'descriptor'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Descriptor' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.descriptor"
            [title]="'Descriptor' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'status'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Status' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.status"
            [title]="'Status' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'value'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Value' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.value"
            [title]="'Value' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  }
</tn-card>
