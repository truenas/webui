<mat-card-header>
  <ix-enclosure-header [title]="title()"></ix-enclosure-header>
</mat-card-header>
<mat-card-content>
  @if (!viewElements()) {
    <ix-empty [conf]="noView"></ix-empty>
  } @else {
    <tn-table
      [dataSource]="(dataProvider().currentPage$ | async) ?? []"
      [displayedColumns]="displayedColumns"
      [trackBy]="trackByDescriptor"
      (sortChange)="onSortChange($event)"
    >
      <ng-container [tnColumnDef]="'descriptor'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Descriptor' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.descriptor"
            [title]="'Descriptor' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [tooltip]="row.descriptor || ''"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'status'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Status' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.status"
            [title]="'Status' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [tooltip]="row.status || ''"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'value'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Value' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.value"
            [title]="'Value' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [tooltip]="row.value || ''"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  }
</mat-card-content>
