<tn-card padding="small" [title]="'NTP Servers' | translate" [ixUiSearch]="searchableElements.elements.ntp">
  @if (!(dataProvider.currentPageCount$ | async) && !(dataProvider.isLoading$ | async)) {
    <tn-empty [title]="emptyService.titleForType(dataProvider.emptyType$ | async)"></tn-empty>
  } @else {
    <tn-table
      class="table"
      [rowTestId]="uniqueRowTag"
      [dataSource]="(dataProvider.currentPage$ | async) ?? []"
      [displayedColumns]="displayedColumns"
      [trackBy]="trackByNtpId"
      [loading]="!!(dataProvider.isLoading$ | async)"
    >
      <ng-container [tnColumnDef]="'address'">
        <ng-template tnHeaderCellDef>{{ 'Address' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.address"
            [title]="'Address' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'burst'">
        <ng-template tnHeaderCellDef>{{ 'Burst' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.burst | yesNo | translate"
            [title]="'Burst' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [testIdSuffix]="'row-yesno'"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'iburst'">
        <ng-template tnHeaderCellDef>{{ 'IBurst' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.iburst | yesNo | translate"
            [title]="'IBurst' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [testIdSuffix]="'row-yesno'"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'prefer'">
        <ng-template tnHeaderCellDef>{{ 'Prefer' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.prefer | yesNo | translate"
            [title]="'Prefer' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [testIdSuffix]="'row-yesno'"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'minpoll'">
        <ng-template tnHeaderCellDef>{{ 'Min Poll' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.minpoll"
            [title]="'Min Poll' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'maxpoll'">
        <ng-template tnHeaderCellDef>{{ 'Max Poll' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.maxpoll"
            [title]="'Max Poll' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
        <ng-template tnHeaderCellDef></ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-actions-cell
            [actions]="actions"
            [row]="row"
            [uniqueRowTag]="uniqueRowTag(row)"
            [ariaLabel]="ariaLabel(row)"
          ></ix-table-actions-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  }

  <ng-template tnCardFooterActions>
    <tn-button
      *ixRequiresRoles="requiredRoles"
      color="primary"
      [testId]="'add-ntp'"
      [ixUiSearch]="searchableElements.elements.addNtpServer"
      [label]="'Add' | translate"
      (onClick)="doAdd()"
    ></tn-button>
  </ng-template>
</tn-card>
