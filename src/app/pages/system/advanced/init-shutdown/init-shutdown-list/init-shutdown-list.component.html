<ix-page-header>
  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="primary"
    [testId]="'add-init-shutdown-script'"
    [label]="'Add' | translate"
    (onClick)="addScript()"
  ></tn-button>
</ix-page-header>

<div class="table-container" [ixUiSearch]="searchableElements.elements.initShutDown">
  @if (!(dataProvider.currentPageCount$ | async) && !(dataProvider.isLoading$ | async)) {
    <tn-empty
      [title]="emptyService.titleForType(dataProvider.emptyType$ | async)"
    ></tn-empty>
  } @else {
    <tn-table
      class="table"
      [rowTestId]="uniqueRowTag"
      [dataSource]="(dataProvider.currentPage$ | async) ?? []"
      [displayedColumns]="displayedColumns"
      [trackBy]="trackByScriptId"
      [loading]="!!(dataProvider.isLoading$ | async)"
      (sortChange)="onSortChange($event)"
    >
      <ng-container [tnColumnDef]="'type'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Type' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="getTypeLabel(row)"
            [title]="'Type' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'comment'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Description' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.comment"
            [title]="'Description' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'when'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'When' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="getWhenLabel(row)"
            [title]="'When' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'script'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Command/Script' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="getScriptValue(row)"
            [title]="'Command/Script' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'enabled'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Enabled' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="!!row.enabled | yesNo | translate"
            [title]="'Enabled' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [testIdSuffix]="'row-yesno'"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
        <ng-template tnHeaderCellDef></ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-actions-cell
            [actions]="actions"
            [row]="row"
            [uniqueRowTag]="uniqueRowTag(row)"
            [ariaLabel]="ariaLabel(row)"
          ></ix-table-actions-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  }
  <tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
</div>
