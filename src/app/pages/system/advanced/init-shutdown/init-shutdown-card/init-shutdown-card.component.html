<tn-card
  padding="small"
  [title]="'Init/Shutdown Scripts' | translate"
  [titleRouterLink]="['/system', 'initshutdown']"
>

  @if (!(dataProvider.currentPageCount$ | async) && !(dataProvider.isLoading$ | async)) {
    <tn-empty [title]="emptyService.titleForType(dataProvider.emptyType$ | async)"></tn-empty>
  } @else {
    <tn-table
      class="table"
      [rowTestId]="uniqueRowTag"
      [dataSource]="(dataProvider.currentPage$ | async) ?? []"
      [displayedColumns]="displayedColumns"
      [trackBy]="trackBy"
      [loading]="!!(dataProvider.isLoading$ | async)"
    >
      <ng-container [tnColumnDef]="'command'">
        <ng-template tnHeaderCellDef>{{ 'Command / Script' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.script || row.command"
            [title]="'Command / Script' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'comment'">
        <ng-template tnHeaderCellDef>{{ 'Description' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.comment"
            [title]="'Description' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'when'">
        <ng-template tnHeaderCellDef>{{ 'When' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.when"
            [title]="'When' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'enabled'">
        <ng-template tnHeaderCellDef>{{ 'Enabled' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.enabled | yesNo | translate"
            [title]="'Enabled' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
            [testIdSuffix]="'row-yesno'"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'timeout'">
        <ng-template tnHeaderCellDef>{{ 'Timeout' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.timeout"
            [title]="'Timeout' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
        <ng-template tnHeaderCellDef></ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-actions-cell
            [actions]="actions"
            [row]="row"
            [uniqueRowTag]="uniqueRowTag(row)"
            [ariaLabel]="ariaLabel(row)"
          ></ix-table-actions-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  }

  <ng-template tnCardFooterActions>
    <tn-button
      *ixRequiresRoles="requiredRoles"
      color="primary"
      [testId]="['init-shutdown', 'add']"
      [ixUiSearch]="searchableElements.elements.addInitShutdownScript"
      [label]="'Add' | translate"
      (onClick)="onAdd()"
    ></tn-button>
  </ng-template>
</tn-card>
