<ix-page-header>
  <ix-basic-search [query]="searchQuery()" (queryChange)="onListFiltered($event)"></ix-basic-search>

  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="primary"
    [testId]="'add-tunable'"
    [label]="'Add' | translate"
    (onClick)="doAdd()"
  ></tn-button>
</ix-page-header>

@if (!(dataProvider.currentPageCount$ | async) && !(dataProvider.isLoading$ | async)) {
  <tn-empty
    [ixUiSearch]="searchableElements.elements.tunables"
    [title]="emptyService.titleForType(dataProvider.emptyType$ | async)"
  ></tn-empty>
} @else {
  <tn-table
    class="table"
    [ixUiSearch]="searchableElements.elements.tunables"
    [rowTestId]="uniqueRowTag"
    [dataSource]="(dataProvider.currentPage$ | async) ?? []"
    [displayedColumns]="displayedColumns"
    [trackBy]="trackByTunableId"
    [loading]="!!(dataProvider.isLoading$ | async)"
    (sortChange)="onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'var'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Variable' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.var"
          [title]="'Variable' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'value'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Value' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.value"
          [title]="'Value' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'type'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Type' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.type"
          [title]="'Type' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'comment'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Description' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.comment"
          [title]="'Description' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'enabled'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Enabled' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.enabled | yesNo | translate"
          [title]="'Enabled' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
          [testIdSuffix]="'row-yesno'"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-actions-cell
          [actions]="actions"
          [row]="row"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
        ></ix-table-actions-cell>
      </ng-template>
    </ng-container>
  </tn-table>
}
<tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
