<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="'Access Settings' | translate"
  [loading]="isLoading()"
></ix-modal-header>
<mat-card>
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        @if (hasDirectoryServices()) {
          <ix-checkbox
            formControlName="ds_auth"
            [label]="'Allow Directory Service users UI / API access' | translate"
            [tooltip]="'When enabled, users provided by the configured directory service can sign in to the web interface and authenticate against the API, including with API keys. Access is still granted through the privileges assigned to their directory service groups.' | translate"
          ></ix-checkbox>
        }
        <ix-textarea
          formControlName="login_banner"
          [label]="'Login Banner' | translate"
          [tooltip]="'When set, the following text will be shown prior to showing login page to the user' | translate"
        ></ix-textarea>
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
