<tn-dialog-shell testId="upload-config" [title]="'Upload Config' | translate">
<form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
  <div [innerHtml]="helptext.uploadConfigForm.message | translate"></div>

  <tn-form-field
    [label]="'Select Configuration File' | translate"
    [required]="true"
  >
    <!-- Test-id pinned on the host so the legacy `input-config` survives: `tn-file-input` would
         otherwise compose `file-input-config` on its own container, and with no `testId` input
         that container emits none. -->
    <tn-file-input
      tnTestIdType="input"
      formControlName="config"
      [tnTestId]="'config'"
      [buttonLabel]="'Choose File' | translate"
      [noFileText]="'No file chosen' | translate"
      [ariaLabel]="'Select Configuration File' | translate"
    ></tn-file-input>
  </tn-form-field>

  </form>
<ix-form-actions tnDialogAction>
  <tn-button
    variant="outline"
    testId="cancel"
    [label]="'Cancel' | translate"
    (onClick)="dialogRef.close(false)"
  ></tn-button>
  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="warn"
    testId="upload"
    [label]="'Upload' | translate"
    [disabled]="form.invalid"
    (onClick)="onSubmit()"
  ></tn-button>
</ix-form-actions>
</tn-dialog-shell>
