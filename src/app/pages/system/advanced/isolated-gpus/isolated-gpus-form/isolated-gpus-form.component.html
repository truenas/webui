<ix-form
  [formGroup]="form"
  [isEditMode]="true"
  [requiredRoles]="requiredRoles"
  [submitHandler]="handleSubmit"
  (closed)="closed.emit($event)"
>
  <tn-form-section>
    <tn-form-field [label]="'GPUs' | translate">
      <tn-select
        formControlName="isolated_gpu_pci_ids"
        [multiple]="true"
        [options]="(options$ | async) ?? []"
      ></tn-select>
    </tn-form-field>
  </tn-form-section>
</ix-form>
