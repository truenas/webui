<div class="quick-look-container" (click)="close()">
  <div class="quick-look-header">
    <span class="file-name">{{ data.fileItem.name }}</span>
    <button mat-icon-button class="close-button" (click)="close()">
      <tn-icon name="close" library="mdi"></tn-icon>
    </button>
  </div>

  <div class="quick-look-content" (click)="$event.stopPropagation()">
    @if (isLoading()) {
      <div class="loading-container">
        <mat-spinner diameter="48"></mat-spinner>
        <span class="loading-text">{{ 'Loading...' | translate }}</span>
      </div>
    } @else if (error()) {
      <div class="error-container">
        <tn-icon name="alert-circle" library="mdi" class="error-icon"></tn-icon>
        <span class="error-text">{{ error() }}</span>
      </div>
    } @else if (isVideo()) {
      <video
        [src]="mediaUrl()"
        class="preview-video"
        controls
        autoplay
      ></video>
    } @else {
      <img
        [src]="mediaUrl()"
        [alt]="data.fileItem.name"
        class="preview-image"
      />
    }
  </div>
</div>
