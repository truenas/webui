<mat-card class="card">
  <mat-card-header>
    <h3 mat-card-title>
      {{ 'Event Data' | translate }}
    </h3>

    <ix-copy-button [text]="yamlContent()" [jsonText]="eventData()"></ix-copy-button>
  </mat-card-header>
  <mat-card-content>
    <div class="log-scroll" tabindex="0">
      <pre>{{ yamlContent() }}</pre>
    </div>
  </mat-card-content>
</mat-card>
