<tn-dialog-shell testId="export-disk" [title]="'Export Disk to Image' | translate">
  <ix-form
    [formGroup]="form"
    [submitHandler]="handleSubmit"
    (closed)="dialogRef.close($event)"
  >
    <tn-banner
      type="info"
      [message]="'This operation will export the VM disk contents to a portable image file. The exported image can be imported into other TrueNAS systems or virtualization platforms like VMware, VirtualBox, or QEMU/KVM. Export time varies based on disk size and storage pool performance.' | translate"
    ></tn-banner>

    <div class="source-info">
      <p>{{ 'Source Disk' | translate }}: <strong>{{ sourcePath }}</strong></p>
    </div>

    <tn-form-section>
      <ix-explorer
        formControlName="destinationDir"
        [label]="'Destination Directory' | translate"
        [required]="true"
        [nodeProvider]="treeNodeProvider"
        [tooltip]="'Select the directory where the disk image will be exported' | translate"
      ></ix-explorer>

      <tn-form-field
        [label]="'Image Name' | translate"
        [required]="true"
        [tooltip]="'Enter the name for the exported image file. The appropriate extension will be added automatically based on the selected format.' | translate"
      >
        <tn-input
          testId="image-name"
          formControlName="imageName"
        ></tn-input>
      </tn-form-field>

      <tn-form-field
        [label]="'Image Format' | translate"
        [tooltip]="'Select the format for the exported disk image' | translate"
        [required]="true"
      >
        <tn-select
          testId="format"
          formControlName="format"
          [options]="(formatOptions$ | async) ?? []"
        ></tn-select>
      </tn-form-field>
    </tn-form-section>
  </ix-form>

  <ix-form-actions tnDialogAction>
    <tn-button
      variant="outline"
      testId="cancel"
      [label]="'Cancel' | translate"
      (onClick)="dialogRef.close(false)"
    ></tn-button>
    <tn-button
      testId="export"
      color="primary"
      [label]="'Export' | translate"
      [disabled]="!canSubmit()"
      [ariaLabel]="'Export disk image' | translate"
      (onClick)="submit()"
    ></tn-button>
  </ix-form-actions>
</tn-dialog-shell>
