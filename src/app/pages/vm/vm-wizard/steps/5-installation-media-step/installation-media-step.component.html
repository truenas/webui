<form [formGroup]="form">
  <tn-form-section>
    <tn-form-field
      [label]="'Optional: Choose installation media image' | translate"
      [tooltip]="helptext.iso_path_tooltip | translate"
    >
      <tn-file-picker
        formControlName="iso_path"
        [source]="fileNodeProvider | filePickerSource"
        [openOnClick]="true"
        [allowFreeText]="true"
      ></tn-file-picker>
    </tn-form-field>

    <div class="upload-button">
      <tn-button
        *ixRequiresRoles="requiredRoles"
        [testId]="'upload-image-file'"
        [label]="'Upload New Image File' | translate"
        (onClick)="onUploadIsoClicked()"
      ></tn-button>
    </div>
  </tn-form-section>

  <ix-form-actions>
    <tn-button
      tnStepperPrevious
      [testId]="'back'"
      [label]="'Back' | translate"
    ></tn-button>
    <tn-button
      tnStepperNext
      color="primary"
      [testId]="'next'"
      [label]="'Next' | translate"
      [disabled]="form.invalid"
    ></tn-button>
  </ix-form-actions>
</form>
