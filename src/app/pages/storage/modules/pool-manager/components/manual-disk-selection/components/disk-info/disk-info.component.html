<div
  class="container"
  [class.no-slot]="!disk().enclosure?.drive_bay_number"
>
  @if (disk().enclosure) {
    <div class="item">
      <div class="label">{{ 'Slot' | translate }}:</div>
      <div class="value" tnTestIdType="text" [tnTestId]="['disk-info', disk().name, 'slot']">{{ disk().enclosure.drive_bay_number }}</div>
    </div>
  }
  <div class="item model">
    <div class="label">{{ 'Model' | translate }}:</div>
    <div class="value" tnTestIdType="text" [tnTestId]="['disk-info', disk().name, 'model']">{{ disk().model }}</div>
  </div>
  <div class="item">
    <div class="label">{{ 'Type' | translate }}:</div>
    <div class="value" tnTestIdType="text" [tnTestId]="['disk-info', disk().name, 'type']">{{ disk().type }}</div>
  </div>
  <div class="item">
    <div class="label">{{ 'Serial' | translate }}:</div>
    <div class="value" tnTestIdType="text" [tnTestId]="['disk-info', disk().name, 'serial']">{{ disk().serial }}</div>
  </div>
</div>
