<div class="root-container">
  <div class="main-container">
    <ix-pool-manager-wizard
      (stepChanged)="onStepChanged($event)"
    ></ix-pool-manager-wizard>
  </div>
  <div class="sidebar">
    <div class="details-container">
      @let pool = existingPool();
      @if (hasConfigurationPreview && pool) {
        <ix-existing-configuration-preview
          [name]="pool.name"
          [topology]="pool.topology"
          [disks]="poolDisks()"
          [size]="pool.size"
        ></ix-existing-configuration-preview>
      }

      @if (hasConfigurationPreview) {
        <ix-new-devices-preview
        ></ix-new-devices-preview>
      }

      <ix-inventory></ix-inventory>
    </div>
  </div>
</div>
