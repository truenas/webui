<ng-container [formGroup]="form">
  <tn-form-field>
    <!-- This group has no visible label, so the accessible name is supplied explicitly. -->
    <!--
      Options are projected rather than passed via `[options]` so each one can carry the
      legacy `radio-button-*` test id; see "Radio groups" in the tn-migration playbook.
    -->
    <tn-radio-group
      formControlName="dispersalStrategy"
      [ariaLabel]="'Enclosure dispersal strategy' | translate"
    >
      @for (option of dispersalOptions(); track option.value) {
        <tn-radio
          [label]="option.label"
          [value]="option.value"
          [testId]="['radio-button', 'dispersal-strategy', option.label]"
        ></tn-radio>
      }
    </tn-radio-group>
  </tn-form-field>

  @if (isLimitingToSingle) {
    <div class="limiting">
      <tn-form-field [label]="'Enclosure' | translate" [required]="true">
        <tn-select
          formControlName="limitToEnclosure"
          [options]="(enclosureOptions$ | async) ?? []"
          [optionTestIdKey]="enclosureOptionTestIdKey"
        ></tn-select>
      </tn-form-field>

      <div class="description">
        {{ helptext.enclosureOptionsDescription | translate }}
      </div>
    </div>
  }
</ng-container>

@if (stepWarning()) {
  <p class="error-warning">
    {{ stepWarning() }}
  </p>
}

<ix-form-actions>
  <tn-button
    tnStepperPrevious
    color="secondary"
    [testId]="'back-enclosure'"
    [label]="'Back' | translate"
    [disabled]="form.invalid"
  ></tn-button>
  <div class="step-buttons">
    <tn-button
      tnStepperNext
      color="primary"
      [testId]="'next-enclosure'"
      [label]="'Next' | translate"
      [disabled]="form.invalid"
    ></tn-button>
  </div>
</ix-form-actions>
