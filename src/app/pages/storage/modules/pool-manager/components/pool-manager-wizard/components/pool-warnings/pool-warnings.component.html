<ng-container [formGroup]="form">
  @if (nonUniqueSerialDisks.length) {
    <div class="spacer-top">
      <ix-warning [message]="nonUniqueSerialDisksTooltip"></ix-warning>
      <tn-form-field
        [label]="'Allow non-unique serialed disks (not recommended)' | translate"
        [tooltip]="nonUniqueSerialDisksTooltip | translate"
        [required]="true"
      >
        <ix-tn-radio-group
          name="allowNonUniqueSerialDisks"
          formControlName="allowNonUniqueSerialDisks"
          [options]="allowNonUniqueSerialDisksOptions()"
          [inline]="true"
          [testId]="['radio-button', 'allow-non-unique-serial-disks']"
        ></ix-tn-radio-group>
      </tn-form-field>
    </div>
  }

  @if (disksWithExportedPools.length) {
    <div class="spacer-bottom">
      <ix-warning [message]="exportedPoolsWarning | translate"></ix-warning>
      <ix-label [label]="'Select disks you want to use' | translate"></ix-label>
      @for (item of poolAndDisks | keyvalue; track item.key) {
        <!--
          `label` is what tn-checkbox emits as the input's `aria-label`, which overrides the
          projected content as the accessible name — without it every row in this loop would be
          announced as the default "Checkbox", with no way to tell the pools apart.
        -->
        <tn-checkbox
          [testId]="[item.key, 'exported_pool']"
          [label]="item.key + ': ' + item.value.join(', ')"
          (change)="checkboxChanged(item.key, $event)"
        >
          <div tnCheckboxLabel class="label">
            <strong class="pool-name">{{ item.key }}</strong>
            <small class="disk-name">{{ item.value.join(', ') }}</small>
          </div>
        </tn-checkbox>
      }
    </div>
  }
</ng-container>
