@if (sedDisk(); as disk) {
  <div class="sed-disk-password" [formGroup]="form">
    <tn-banner
      type="info"
      [message]="(disk.status === SedStatus.Locked
        ? helptext.lockedMessage
        : helptext.uninitializedMessage
      ) | translate: { disk: disk.name }"
    ></tn-banner>

    <tn-form-field [label]="'SED Password' | translate">
      <tn-radio-group
        formControlName="source"
        [options]="sourceOptions()"
      ></tn-radio-group>
    </tn-form-field>

    @if (isIndividual()) {
      <tn-form-field
        [label]="'Password' | translate"
        [required]="true"
        [tooltip]="helptext.individualTooltip | translate"
      >
        <tn-input
          formControlName="password"
          [inputType]="InputType.Password"
        ></tn-input>
      </tn-form-field>

      @if (disk.status === SedStatus.Uninitialized) {
        <tn-form-field [label]="'Confirm Password' | translate" [required]="true">
          <tn-input
            formControlName="passwordConfirm"
            [inputType]="InputType.Password"
          ></tn-input>
        </tn-form-field>
      }
    }
  </div>
}
