@if (sedDisk(); as disk) {
  <div class="sed-disk-password" [formGroup]="form">
    <p class="message">
      {{
        (disk.status === SedStatus.Locked
          ? helptext.lockedMessage
          : helptext.uninitializedMessage
        ) | translate: { disk: disk.name }
      }}
    </p>

    <ix-radio-group
      formControlName="source"
      [label]="'SED Password' | translate"
      [options]="sourceOptions$"
    ></ix-radio-group>

    @if (isIndividual()) {
      <ix-input
        formControlName="password"
        type="password"
        [label]="'Password' | translate"
        [required]="true"
        [tooltip]="helptext.individualTooltip | translate"
      ></ix-input>

      @if (disk.status === SedStatus.Uninitialized) {
        <ix-input
          formControlName="passwordConfirm"
          type="password"
          [label]="'Confirm Password' | translate"
          [required]="true"
        ></ix-input>
      }
    }
  </div>
}
