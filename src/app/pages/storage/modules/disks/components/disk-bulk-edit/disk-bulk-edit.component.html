@if (slideInRef) {
  <ix-modal-header
    [requiredRoles]="requiredRoles"
    [title]="'Bulk Edit Disks' | translate"
    [loading]="isLoading()"
  ></ix-modal-header>
}

<form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
  <tn-form-section [heading]="helptextBulkEdit.title | translate">
    <label class="disk-list-label">
      {{ "Disks to be edited:" | translate }}
      <tn-icon
        class="tooltip-icon"
        name="information-outline"
        library="mdi"
        size="sm"
        [tooltip]="disksTooltip"
      ></tn-icon>
    </label>
    <div
      class="disk-list"
      role="list"
      [attr.aria-label]="'Disks to be edited' | translate"
    >
      @for (diskName of form.controls.disknames.value; track diskName) {
        <div class="disk-item" role="listitem">
          <tn-icon
            name="hdd"
            library="custom"
            class="disk-icon"
            size="md"
            [attr.aria-hidden]="true"
          ></tn-icon>
          <span class="disk-name">{{ diskName }}</span>
        </div>
      }
    </div>
  </tn-form-section>

  <tn-form-section [heading]="helptextBulkEdit.label | translate">
    <tn-form-field
      [label]="'HDD Standby' | translate"
      [tooltip]="helptext.standbyTooltip | translate"
      [required]="true"
    >
      <tn-select formControlName="hddstandby" [options]="hddstandbyOptions"></tn-select>
    </tn-form-field>

    <tn-form-field
      [label]="'Advanced Power Management' | translate"
      [required]="true"
    >
      <tn-select formControlName="advpowermgmt" [options]="advpowermgmtOptions"></tn-select>
    </tn-form-field>
  </tn-form-section>

  @if (slideInRef) {
    <ix-form-actions>
      <tn-button
        *ixRequiresRoles="requiredRoles"
        type="submit"
        color="primary"
        [testId]="'save'"
        [label]="'Save' | translate"
        [disabled]="isLoading()"
      ></tn-button>
    </ix-form-actions>
  }
</form>
