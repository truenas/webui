<ix-form
  [formGroup]="form"
  [isEditMode]="true"
  [requiredRoles]="requiredRoles"
  [submitHandler]="handleSubmit"
  [suppressSuccessSnackbar]="true"
  (closed)="closed.emit($event)"
>
  <tn-form-section [heading]="helptextBulkEdit.title | translate">
    <div>
      <!--
        A <div>, not a <label>: there is no form control to label here — the list below is a
        read-only readout, and it carries its own accessible name via role="list" + aria-label.
      -->
      <div class="disk-list-label">
        {{ "Disks to be edited:" | translate }}
        <tn-icon
          class="tooltip-icon"
          name="information-outline"
          library="mdi"
          [tooltip]="disksTooltip"
        ></tn-icon>
      </div>
      <!--
        `tabindex="0"`: the list scrolls once a bulk edit covers more disks than fit, and a
        scrollable region that can't be focused can't be scrolled from the keyboard at all
        (WCAG 2.1.1). Focusable, it takes arrow keys like any other scroll container.
      -->
      <div
        class="disk-list"
        role="list"
        tabindex="0"
        [attr.aria-label]="'Disks to be edited' | translate"
      >
        @for (diskName of form.controls.disknames.value; track diskName) {
          <div class="disk-item" role="listitem">
            <tn-icon
              name="hdd"
              library="custom"
              class="disk-icon"
              [attr.aria-hidden]="true"
            ></tn-icon>
            <span class="disk-name">{{ diskName }}</span>
          </div>
        }
      </div>
    </div>
  </tn-form-section>

  <tn-form-section [heading]="helptextBulkEdit.label | translate">
    <!--
      Neither select is required here: an empty value is meaningful in a bulk edit — it is how
      the form reports that the selected disks disagree, and how the user leaves a setting
      unchanged (blank values are stripped from the update payload).
    -->
    <tn-form-field
      [label]="'HDD Standby' | translate"
      [tooltip]="helptext.standbyTooltip | translate"
    >
      <tn-select
        formControlName="hddstandby"
        [options]="hddstandbyOptions"
        [optionTestIdKey]="optionTestIdByLabel"
      ></tn-select>
    </tn-form-field>

    <tn-form-field [label]="'Advanced Power Management' | translate">
      <tn-select
        formControlName="advpowermgmt"
        [options]="advpowermgmtOptions"
        [optionTestIdKey]="optionTestIdByLabel"
      ></tn-select>
    </tn-form-field>
  </tn-form-section>
</ix-form>
