<ix-page-header [loading]="!!(dataProvider.isLoading$ | async)">
  <ix-basic-search
    [query]="searchQuery()"
    (queryChange)="onListFiltered($event)"
  ></ix-basic-search>

  <ix-table-columns-selector
    [columnPreferencesKey]="'diskList'"
    [columns]="columns"
    (columnsChange)="columnsChange($event)"
  ></ix-table-columns-selector>
</ix-page-header>

@if (selectedDisks.length) {
  <div
    class="batch-actions-toolbar"
    [ixUiSearch]="searchableElements.elements.disks"
  >
    <div class="title">
      <strong>{{ 'Batch Operations' | translate }}</strong>
    </div>
    <div class="actions">
      <tn-button
        variant="outline"
        [testId]="'edit-selected'"
        [icon]="editIcon"
        [label]="editSelectedLabel"
        (onClick)="edit(selectedDisks)"
      ></tn-button>
    </div>
  </div>
}

<ix-table
  class="table"
  [ix-table-empty]="!(dataProvider.currentPageCount$ | async)"
  [emptyConfig]="emptyConfig"
>
  <thead
    ix-table-head
    [columns]="columns"
    [dataProvider]="dataProvider"
  ></thead>
  <tbody
    ix-table-body
    detailsRowIdentifier="identifier"
    [columns]="columns"
    [dataProvider]="dataProvider"
    [isLoading]="!!(dataProvider.isLoading$ | async)"
  >
    <ng-template let-disk ix-table-details-row [dataProvider]="dataProvider">
      <ix-table-details-row [hiddenColumns]="hiddenColumns" [row]="disk">
        <div class="table-details-row-actions">
          <tn-button
            variant="outline"
            [testId]="[disk.name, 'edit']"
            [icon]="editIcon"
            [label]="'Edit' | translate"
            (onClick)="edit([disk])"
          ></tn-button>

          @if (isUnusedDisk(disk)) {
            <tn-button
              *ixRequiresRoles="requiredRoles"
              variant="outline"
              [testId]="[disk.name, 'wipe']"
              [icon]="wipeIcon"
              [label]="'Wipe' | translate"
              (onClick)="wipe(disk)"
            ></tn-button>
          }

          @if (isSedLocked(disk)) {
            <tn-button
              *ixRequiresRoles="requiredRoles"
              variant="outline"
              [testId]="[disk.name, 'unlock']"
              [icon]="unlockIcon"
              [label]="'Unlock' | translate"
              (onClick)="unlock(disk)"
            ></tn-button>

            <tn-button
              *ixRequiresRoles="requiredRoles"
              variant="outline"
              [testId]="[disk.name, 'reset-sed']"
              [icon]="resetSedIcon"
              [label]="'SED Reset' | translate"
              (onClick)="resetSed(disk)"
            ></tn-button>
          }
        </div>
      </ix-table-details-row>

    </ng-template>
  </tbody>
</ix-table>
<tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
