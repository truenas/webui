@if (slideInRef) {
  <ix-modal-header
    [requiredRoles]="requiredRoles"
    [title]="'Edit Disk' | translate"
    [loading]="isLoading()"
  ></ix-modal-header>
}

<form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
  <tn-form-section [heading]="helptext.generalTitle | translate">
    <tn-form-field [label]="'Name' | translate">
      <tn-input formControlName="name" [readonly]="true"></tn-input>
    </tn-form-field>

    <tn-form-field [label]="'Serial' | translate">
      <tn-input formControlName="serial" [readonly]="true"></tn-input>
    </tn-form-field>

    <tn-form-field [label]="'Description' | translate">
      <tn-input formControlName="description"></tn-input>
    </tn-form-field>
  </tn-form-section>

  <tn-form-section [heading]="helptext.powerManagementTitle | translate">
    <tn-form-field
      [label]="'HDD Standby' | translate"
      [tooltip]="helptext.standbyTooltip | translate"
      [required]="true"
    >
      <tn-select formControlName="hddstandby" [options]="hddstandbyOptions"></tn-select>
    </tn-form-field>

    <tn-form-field
      [label]="'Advanced Power Management' | translate"
      [required]="true"
    >
      <tn-select formControlName="advpowermgmt" [options]="advpowermgmtOptions"></tn-select>
    </tn-form-field>
  </tn-form-section>

  @if (showSedSection()) {
    <tn-form-section [heading]="helptext.sedTitle | translate">
      <tn-form-field
        [label]="'SED Password' | translate"
        [tooltip]="helptext.passwordTooltip | translate"
      >
        <tn-input formControlName="passwd" [inputType]="InputType.Password"></tn-input>
      </tn-form-field>

      <tn-form-field>
        <tn-checkbox
          formControlName="clear_pw"
          [label]="'Clear SED Password' | translate"
        ></tn-checkbox>
      </tn-form-field>
    </tn-form-section>
  }

  @if (slideInRef) {
    <ix-form-actions>
      <tn-button
        *ixRequiresRoles="requiredRoles"
        type="submit"
        color="primary"
        [testId]="'save'"
        [label]="'Save' | translate"
        [disabled]="form.invalid || isLoading()"
      ></tn-button>
    </ix-form-actions>
  }
</form>
