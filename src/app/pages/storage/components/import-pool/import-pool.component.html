@switch (currentStep()) {
  @case (ImportStep.Loading) {
    <!--
      The step the panel opens on: `disk.details` + `system.advanced.sed_global_password`, then the
      `pool.import_find` job — several seconds of work. Without this case the `@switch` matched
      nothing and the panel body rendered empty for the whole round trip.
    -->
    <div class="loading-step" role="status">
      <tn-spinner mode="indeterminate" [diameter]="40"></tn-spinner>
      <p class="loading-message">{{ 'Searching for pools available for import...' | translate }}</p>
    </div>
  }
  @case (ImportStep.LockedSed) {
    <ix-locked-sed-disks
      [lockedDisks]="lockedSedDisks()"
      (skip)="onLockedSedSkip()"
      (unlock)="onLockedSedUnlock()"
    ></ix-locked-sed-disks>
  }
  @case (ImportStep.UnlockSed) {
    <ix-unlock-sed-disks
      [lockedDisks]="lockedSedDisks()"
      [globalSedPassword]="globalSedPassword()"
      (skip)="onUnlockSkip()"
      (unlocked)="onUnlockSuccess()"
    ></ix-unlock-sed-disks>
  }
  @case (ImportStep.Import) {
    <!-- `PoolsDashboardComponent` opens this panel footerless (the multi-step flow has steps with
         no submit at all), so the Import button below is the form's own submit trigger. -->
    <ix-form
      [formGroup]="form"
      [requiredRoles]="requiredRoles"
      [submitHandler]="handleSubmit"
      (closed)="closed.emit($event)"
    >
      <tn-form-section [heading]="helptext.selectPool | translate">
        <tn-form-field
          [label]="poolLabel | translate"
          [required]="true"
        >
          <tn-select
            formControlName="guid"
            [options]="poolOptions()"
            [optionTestIdKey]="poolOptionTestIdKey"
          ></tn-select>
        </tn-form-field>
      </tn-form-section>

      <ix-form-actions>
        <tn-button
          *ixRequiresRoles="requiredRoles"
          type="submit"
          color="primary"
          [testId]="'import'"
          [disabled]="!canSubmit()"
          [label]="'Import' | translate"
        ></tn-button>
      </ix-form-actions>
    </ix-form>
  }
}
