@if (slideInRef) {
  <ix-modal-header
    [requiredRoles]="requiredRoles"
    [title]="helptext.title | translate"
    [loading]="isLoading()"
  ></ix-modal-header>
}

@switch (currentStep()) {
  @case ('locked-sed') {
    <ix-locked-sed-disks
      [lockedDisks]="lockedSedDisks()"
      (skip)="onLockedSedSkip()"
      (unlock)="onLockedSedUnlock()"
    ></ix-locked-sed-disks>
  }
  @case ('unlock-sed') {
    <ix-unlock-sed-disks
      [lockedDisks]="lockedSedDisks()"
      [globalSedPassword]="globalSedPassword()"
      (skip)="onUnlockSkip()"
      (unlocked)="onUnlockSuccess()"
    ></ix-unlock-sed-disks>
  }
  @case ('import') {
    <form
      class="ix-form-container"
      [formGroup]="form"
      (submit)="onSubmit()"
    >
      <tn-form-section [heading]="helptext.selectPool | translate">
        <tn-form-field
          [label]="pool.label | translate"
          [required]="true"
        >
          <tn-select
            formControlName="guid"
            [options]="(pool.options | async) ?? []"
          ></tn-select>
        </tn-form-field>
      </tn-form-section>

      <ix-form-actions>
        <tn-button
          *ixRequiresRoles="requiredRoles"
          type="submit"
          color="primary"
          [testId]="'import'"
          [disabled]="form.invalid || isLoading()"
          [label]="'Import' | translate"
        ></tn-button>
      </ix-form-actions>
    </form>
  }
}
