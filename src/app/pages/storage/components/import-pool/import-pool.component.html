@switch (currentStep()) {
  @case ('loading') {
    <!--
      The step the panel opens on: `disk.details` + `system.advanced.sed_global_password`, then the
      `pool.import_find` job — several seconds of work. Without this case the `@switch` matched
      nothing and the panel body rendered empty for the whole round trip.
    -->
    <div class="loading-step" role="status">
      <tn-spinner mode="indeterminate" [diameter]="40"></tn-spinner>
      <p class="loading-message">{{ 'Searching for pools available for import...' | translate }}</p>
    </div>
  }
  @case ('locked-sed') {
    <ix-locked-sed-disks
      [lockedDisks]="lockedSedDisks()"
      (skip)="onLockedSedSkip()"
      (unlock)="onLockedSedUnlock()"
    ></ix-locked-sed-disks>
  }
  @case ('unlock-sed') {
    <ix-unlock-sed-disks
      [lockedDisks]="lockedSedDisks()"
      [globalSedPassword]="globalSedPassword()"
      (skip)="onUnlockSkip()"
      (unlocked)="onUnlockSuccess()"
    ></ix-unlock-sed-disks>
  }
  @case ('import') {
    <!-- Submission routes through the host-facing submit() — not onSubmit() — so the panel
         footer's Save would latch to "Saving…" if this form is ever opened with a footer. -->
    <form
      class="ix-form-container"
      [formGroup]="form"
      (submit)="submit()"
    >
      <tn-form-section [heading]="helptext.selectPool | translate">
        <tn-form-field
          [label]="poolLabel | translate"
          [required]="true"
        >
          <tn-select
            formControlName="guid"
            [options]="poolOptions()"
            [optionTestIdKey]="optionTestIdByLabel"
            [placeholder]="tnSelectLabels.placeholder | translate"
            [noOptionsLabel]="tnSelectLabels.noOptions | translate"
          ></tn-select>
        </tn-form-field>
      </tn-form-section>

      <ix-form-actions>
        <tn-button
          *ixRequiresRoles="requiredRoles"
          type="submit"
          color="primary"
          [testId]="'import'"
          [disabled]="form.invalid || isLoading()"
          [label]="'Import' | translate"
        ></tn-button>
      </ix-form-actions>
    </form>
  }
}
