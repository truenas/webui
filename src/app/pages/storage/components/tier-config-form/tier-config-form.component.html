<form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
  <tn-form-section [heading]="'Tiering Configuration' | translate">
    <tn-form-field>
      <tn-checkbox
        formControlName="enabled"
        [label]="'Enabled' | translate"
      ></tn-checkbox>
    </tn-form-field>

    @if (showEnabledWarning()) {
      <tn-banner
        type="warning"
        [heading]="enabledWarningHeading | translate"
        [message]="enabledWarningMessage | translate"
      ></tn-banner>
    }

    <tn-form-field
      [label]="'Max Concurrent Jobs' | translate"
      [hint]="helptext.maxConcurrentJobs | translate"
    >
      <tn-input
        formControlName="max_concurrent_jobs"
        [inputType]="InputType.Number"
      ></tn-input>
    </tn-form-field>

    <tn-form-field
      [label]="'Max Used Percentage' | translate"
      [hint]="helptext.maxUsedPercentage | translate"
    >
      <tn-input
        formControlName="max_used_percentage"
        [inputType]="InputType.Number"
      ></tn-input>
    </tn-form-field>
  </tn-form-section>
</form>
