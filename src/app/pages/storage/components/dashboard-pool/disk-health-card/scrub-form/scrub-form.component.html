<!-- Implicit (Enter-key) submission routes through the host-facing submit() — not onSubmit() —
     so the panel footer's Save still latches to "Saving…" if this form ever drops to one field. -->
<form class="ix-form-container" [formGroup]="form" (submit)="submit()">
  <tn-form-section>
    <tn-form-field>
      <tn-checkbox
        formControlName="enabled"
        [label]="'Enabled' | translate"
      ></tn-checkbox>
    </tn-form-field>

    <ix-scheduler
      formControlName="schedule"
      [label]="'Schedule' | translate"
      [required]="true"
    ></ix-scheduler>

    <tn-form-field
      [label]="'Threshold Days' | translate"
      [required]="true"
      [tooltip]="helptextScrubForm.thresholdTooltip | translate"
    >
      <tn-input
        formControlName="threshold"
        [inputType]="InputType.Number"
      ></tn-input>
    </tn-form-field>
  </tn-form-section>
</form>
