<tn-card class="card" [title]="title() | translate">
  <div class="card-body">
    <!-- A count, not a section heading: styled large by class so it doesn't outrank the
         card's own <h3> title in the document outline. -->
    <div class="value">{{ disks().length }}</div>
    <tn-button
      *ixRequiresRoles="requiredRoles"
      [testId]="'add-to-pool'"
      [disabled]="!disks().length"
      [label]="'Add To Pool' | translate"
      (onClick)="onAddToStorage()"
    ></tn-button>
  </div>
</tn-card>
