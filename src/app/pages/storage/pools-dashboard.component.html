<ix-page-header>
  <tn-button
    *ixRequiresRoles="requiredRoles"
    [testId]="'import-pool'"
    [ixUiSearch]="searchableElements.elements.importPool"
    [label]="'Import Pool' | translate"
    (onClick)="onImportPool()"
  ></tn-button>

  <!--
    Test id is pinned on the host with `tnTestIdType="link"` rather than passed through
    `[testId]`: this is a pure navigation, and `tn-button`'s anchor arm hard-codes
    `tnTestIdType="button"`, so `[testId]` would rename the legacy `link-disks` to
    `button-disks`. The rendered element is a real `<a routerLink>` either way.
  -->
  <tn-button
    tnTestIdType="link"
    [tnTestId]="'disks'"
    [routerLink]="['/storage', 'disks']"
    [label]="'Disks' | translate"
  ></tn-button>

  @if (isEnterprise()) {
    <tn-button
      *ixRequiresRoles="requiredRoles"
      [testId]="'tiering'"
      [ixUiSearch]="searchableElements.elements.tiering"
      [label]="'Tiering' | translate"
      (onClick)="onTiering()"
    ></tn-button>
  }

  @if (!hasNoPools() && !arePoolsLoading()) {
    <!-- Host-pinned `link-create-pool` — see the note on the Disks button above. -->
    <tn-button
      *ixRequiresRoles="requiredRoles"
      color="primary"
      tnTestIdType="link"
      [tnTestId]="'create-pool'"
      [ixUiSearch]="searchableElements.elements.createPool"
      [routerLink]="['/storage', 'create']"
      [label]="'Create Pool' | translate"
    ></tn-button>
  }
</ix-page-header>

<div [ixUiSearch]="searchableElements.elements.storageDashboard">
  @if (arePoolsLoading()) {
    <ix-dashboard-pool
      class="pool"
      [isLoading]="true"
    ></ix-dashboard-pool>

    <ix-dashboard-pool
      class="pool"
      [isLoading]="true"
    ></ix-dashboard-pool>
  }

  @if (hasNoPools() && !arePoolsLoading()) {
    <div class="entity-empty-wrapper">
      <tn-empty
        icon="dns"
        iconLibrary="material"
        iconSize="56px"
        [title]="emptyTitle | translate"
        [description]="emptyMessage | translate"
      ></tn-empty>

      <!--
        Rendered outside tn-empty rather than through its `actionText` input: the action button
        tn-empty renders internally carries no test id, and the input exposes no way to set one.
      -->
      <tn-button
        *ixRequiresRoles="requiredRoles"
        color="primary"
        variant="outline"
        [testId]="'create-pool'"
        [routerLink]="['/storage', 'create']"
        [label]="'Create Pool' | translate"
      ></tn-button>
    </div>
  }

  @if (!hasNoPools() && !arePoolsLoading()) {
    @if (!hasNoPools()) {
      <ix-unused-resources
        [pools]="pools()"
      ></ix-unused-resources>
    }

    @for (pool of pools(); track pool; let i = $index) {
      <ix-dashboard-pool
        class="pool"
        [pool]="pool"
        [disks]="getDisksByPool(pool)"
        [isLoading]="isLoadingPoolDetails()"
        [rootDataset]="rootDatasets[pool.name]"
      ></ix-dashboard-pool>
    }
  }
</div>
