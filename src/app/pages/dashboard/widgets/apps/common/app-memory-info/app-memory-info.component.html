<h3 *ixWithLoadingState="memory() as memory">
  <span tnTestIdType="text" [tnTestId]="[testId(), 'memory-usage']">{{ memory[0].toFixed(0) }}</span>
  <small tnTestIdType="text" [tnTestId]="[testId(), 'memory-usage-unit']">{{ memory[1] }}</small>
</h3>
<div>
  <strong>{{ 'Memory Usage' | translate }}</strong>
</div>
