<tn-card class="card" [padContent]="false">
  <div class="card-content">
    <div class="header">
      <h3 tnTestIdType="text" [tnTestId]="testIds().title">{{ label() | translate }}</h3>

      @let desc = description();
      @if (desc) {
        <div class="description" tnTestIdType="text" [tnTestId]="testIds().description">{{ desc }}</div>
      }
    </div>

    <div
      fittext
      [class]="['container', size()]"
      [modelToWatch]="text()"
      [activateOnResize]="true"
      [maxFontSize]="maxFontSize"
      [minFontSize]="12"
    >
      <div tnTestIdType="text" [tnTestId]="testIds().value">{{ text() | translate }}</div>

      @let sub = subText();
      @if (sub) {
        <div class="sub-text" tnTestIdType="text" [tnTestId]="testIds().subText">{{ sub | translate }}</div>
      }
    </div>
  </div>
</tn-card>
