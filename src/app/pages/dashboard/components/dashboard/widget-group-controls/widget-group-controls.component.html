<div class="mobile-reorder-buttons">
  <button
    mat-icon-button
    [attr.aria-label]="'Move widget up' | translate"
    [ixTest]="['move-up', 'widget' + index()]"
    [disabled]="!canMoveUp()"
    (click)="moveUp.emit()"
  >
    <ix-icon name="mdi-menu-up"></ix-icon>
  </button>
  <button
    mat-icon-button
    [attr.aria-label]="'Move widget down' | translate"
    [ixTest]="['move-down', 'widget' + index()]"
    [disabled]="!canMoveDown()"
    (click)="moveDown.emit()"
  >
    <ix-icon name="mdi-menu-down"></ix-icon>
  </button>
</div>

<div class="flex">
  <button
    mat-icon-button
    [attr.aria-label]="'Edit group' | translate"
    [ixTest]="['edit-group', 'widget' + index()]"
    (click)="edit.emit()"
  >
    <ix-icon class="size-5!" name="ix-dashboard-edit"></ix-icon>
  </button>
  <button
    mat-icon-button
    [attr.aria-label]="'Delete group' | translate"
    [ixTest]="['delete-group', 'widget' + index()]"
    (click)="delete.emit()"
  >
    <ix-icon class="size-5!" name="ix-dashboard-delete"></ix-icon>
  </button>
  <button mat-icon-button cdkDragHandle>
    <ix-icon class="size-5!" name="ix-dashboard-drag"></ix-icon>
  </button>
</div>
