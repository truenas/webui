<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="'WebShare' | translate"
  [loading]="isFormLoading()"
></ix-modal-header>

<mat-card class="card">
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        <ix-checkbox
          formControlName="search"
          [label]="'Enable TrueSearch' | translate"
          [tooltip]="helptext.search_enabled_tooltip | translate"
          [hint]="trueSearchHint() | translate"
        ></ix-checkbox>

        <ix-select
          formControlName="passkey"
          [label]="'Passkey' | translate"
          [tooltip]="helptext.passkey_tooltip | translate"
          [options]="passkeyOptions$"
          [required]="true"
        ></ix-select>
      </ix-fieldset>

      <ix-fieldset [title]="'AI Assistant (MCP)' | translate">
        <ix-checkbox
          formControlName="mcp_enabled"
          [label]="'Enable MCP' | translate"
          [tooltip]="helptext.mcp_enabled_tooltip | translate"
        ></ix-checkbox>

        @if (isMcpEnabled()) {
          @if (hasMcpGroupChoice()) {
            <ix-select
              formControlName="mcp_allowed_groups"
              [label]="'Allowed Groups' | translate"
              [tooltip]="helptext.mcp_allowed_groups_tooltip | translate"
              [options]="mcpGroupOptions$"
              [multiple]="true"
              [required]="true"
            ></ix-select>
          }

          <ix-checkbox
            formControlName="mcp_allow_write"
            [label]="'Allow Write' | translate"
            [tooltip]="helptext.mcp_allow_write_tooltip | translate"
          ></ix-checkbox>
        }
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isFormLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
