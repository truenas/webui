<tn-banner type="info">
  <div class="header">
    <div class="image">
      <img [src]="image()" [src-fallback]="imagePlaceholder">
    </div>
    <div class="name" tnTestId="provider-name" tnTestIdType="text">{{ name() }}</div>
  </div>
  <p class="body" [innerHTML]="description()"></p>
</tn-banner>
