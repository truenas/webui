<div class="item-search">
  <ix-basic-search
    [query]="searchQuery()"
    (queryChange)="onListFiltered($event)"
  ></ix-basic-search>
</div>

<!-- Gate on the empty TYPE, not the row count, so an errored query still reaches the table's own
     empty state below instead of being mistaken for "nothing configured yet". Matches the other
     migrated lists. -->
@if (list.empty.type() === EmptyType.NoPageData && !list.empty.count()) {
  <tn-empty
    [icon]="emptyIcon.name"
    [iconLibrary]="emptyIcon.library"
    [iconSize]="emptyIcon.size"
    [title]="emptyConfig.message | translate | flattenEmptyMessage"
  ></tn-empty>
} @else {
  <tn-table
    class="backups"
    [testId]="'table-table'"
    [ixUiSearch]="searchableElements.elements.tasks"
    [dataSource]="list.rows()"
    [displayedColumns]="list.displayedColumns()"
    [trackBy]="trackByBackupId"
    [loading]="list.isLoading()"
    [loadingMessage]="list.loadingMessage()"
    [clickable]="true"
    [activeRow]="activeRow()"
    [emptyMessage]="list.empty.message()"
    [emptyDescription]="list.empty.description()"
    [emptyIcon]="list.empty.icon()"
    (rowClick)="onRowClick($event)"
    (sortChange)="list.onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'description'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().name }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.description"
          [title]="titles().name"
          [uniqueRowTag]="uniqueRowTag(row)"
          [tooltip]="row.description || ''"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'enabled'" [sortable]="true" [width]="'70px'">
      <ng-template tnHeaderCellDef>{{ titles().enabled }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-toggle-cell
          #enabledToggle
          [title]="titles().enabled"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
          [checked]="!!row.enabled"
          [requiredRoles]="requiredRoles"
          (toggled)="onChangeEnabledState(row, enabledToggle)"
        ></ix-table-toggle-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'snapshot'" [sortable]="true" [width]="'90px'">
      <ng-template tnHeaderCellDef>{{ titles().snapshot }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          testIdSuffix="row-yesno"
          [value]="row.snapshot | yesNo | translate"
          [title]="titles().snapshot"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'state'" [sortable]="true" [width]="'120px'">
      <ng-template tnHeaderCellDef>{{ titles().state }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-task-state-cell
          [state]="row.job?.state"
          [job]="row.job"
          [testId]="[titles().state, uniqueRowTag(row), 'row-state']"
          [ariaLabel]="ariaLabel(row)"
        ></ix-task-state-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'last-run'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().lastRun }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-relative-date-cell
          [value]="row.job?.time_finished?.$date"
          [title]="titles().lastRun"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-relative-date-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
      <!-- The actions column has no visible heading, but it still needs an accessible one. -->
      <ng-template tnHeaderCellDef><span class="sr-only">{{ 'Actions' | translate }}</span></ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-actions-cell
          [actions]="actions"
          [row]="row"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
        ></ix-table-actions-cell>
      </ng-template>
    </ng-container>
  </tn-table>

  <tn-table-pager [dataProvider]="dataProvider()"></tn-table-pager>
}
