<div class="item-search">
  <ix-basic-search
    [query]="searchQuery()"
    (queryChange)="onListFiltered($event)"
  ></ix-basic-search>
</div>

@if (!empty.count() && !isLoading()) {
  @if (searchQuery()) {
    <tn-empty
      icon="magnify-scan"
      iconLibrary="mdi"
      iconSize="56px"
      [title]="'No Search Results.' | translate"
      [description]="'No matching results found' | translate"
    ></tn-empty>
  } @else {
    <tn-empty
      icon="true-cloud"
      iconLibrary="custom"
      iconSize="56px"
      [title]="'Back up to the decentralized network provided by Storj in partnership with TrueNAS.' | translate"
    ></tn-empty>
  }
} @else {
  <tn-table
    class="backups"
    [testId]="'table-table'"
    [ixUiSearch]="searchableElements.elements.tasks"
    [dataSource]="rows()"
    [displayedColumns]="displayedColumns"
    [trackBy]="trackByBackupId"
    [loading]="isLoading()"
    [clickable]="true"
    [activeRow]="activeRow()"
    [emptyMessage]="empty.message()"
    [emptyIcon]="empty.icon()"
    (rowClick)="onRowClick($event)"
  >
    <ng-container [tnColumnDef]="'description'">
      <ng-template tnHeaderCellDef>{{ 'Name' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('Name' | translate), uniqueRowTag(row), 'row-text']"
          [tnTooltip]="row.description || ''"
        >{{ row.description }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'enabled'" [width]="'70px'">
      <ng-template tnHeaderCellDef>{{ 'Enabled' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-toggle-cell
          #enabledToggle
          [title]="'Enabled' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
          [checked]="!!row.enabled"
          [requiredRoles]="requiredRoles"
          (toggled)="onChangeEnabledState(row, enabledToggle)"
        ></ix-table-toggle-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'snapshot'" [width]="'90px'">
      <ng-template tnHeaderCellDef>{{ 'Snapshot' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('Snapshot' | translate), uniqueRowTag(row), 'row-yesno']"
        >{{ row.snapshot | yesNo | translate }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'state'" [width]="'120px'">
      <ng-template tnHeaderCellDef>{{ 'State' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-task-state-cell
          [state]="row.job?.state"
          [job]="row.job"
          [testId]="[('State' | translate), uniqueRowTag(row), 'row-state']"
          [ariaLabel]="ariaLabel(row)"
        ></ix-task-state-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'last-run'">
      <ng-template tnHeaderCellDef>{{ 'Last Run' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-relative-date-cell
          [value]="row.job?.time_finished?.$date"
          [title]="'Last Run' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-relative-date-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-actions-cell
          [actions]="actions"
          [row]="row"
          [uniqueRowTag]="uniqueRowTag(row)"
          [ariaLabel]="ariaLabel(row)"
        ></ix-table-actions-cell>
      </ng-template>
    </ng-container>
  </tn-table>

  <tn-table-pager [dataProvider]="dataProvider()"></tn-table-pager>
}
