<tn-card class="card" [padContent]="false" [title]="'Snapshots' | translate">
  @if (!isLoading()) {
    <tn-table
      class="table"
      [testId]="'table-table'"
      [dataSource]="rows()"
      [displayedColumns]="displayedColumns"
      [trackBy]="trackBySnapshotId"
      [emptyMessage]="empty.message()"
      [emptyIcon]="empty.icon()"
      (sortChange)="onSortChange($event)"
    >
      <ng-container [tnColumnDef]="'time'">
        <ng-template tnHeaderCellDef>{{ 'Snapshot Time' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-relative-date-cell
            [value]="row.time.$date"
            [title]="'Snapshot Time' | translate"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-relative-date-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'hostname'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ 'Hostname' | translate }}</ng-template>
        <ng-template let-row tnCellDef>
          <span
            tnTestIdType="text"
            [tnTestId]="[('Hostname' | translate), uniqueRowTag(row), 'row-text']"
          >{{ row.hostname }}</span>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
        <ng-template tnHeaderCellDef></ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-actions-cell
            [actions]="actions"
            [row]="row"
            [uniqueRowTag]="uniqueRowTag(row)"
            [ariaLabel]="ariaLabel(row)"
          ></ix-table-actions-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  } @else {
    <div class="spinner-container">
      <tn-spinner mode="indeterminate" [diameter]="40"></tn-spinner>
    </div>
  }
  <tn-table-pager [dataProvider]="dataProvider()"></tn-table-pager>
</tn-card>
