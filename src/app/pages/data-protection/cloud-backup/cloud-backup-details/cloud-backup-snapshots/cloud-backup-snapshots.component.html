<tn-card class="card" [padContent]="false" [title]="'Snapshots' | translate">
  @if (!list.isLoading()) {
    <tn-table
    class="table"
      [testId]="'table-table'"
      [dataSource]="list.rows()"
      [displayedColumns]="list.displayedColumns()"
      [trackBy]="trackBySnapshotId"
      [emptyMessage]="list.empty.message()"
      [emptyDescription]="list.empty.description()"
      [emptyIcon]="list.empty.icon()"
      (sortChange)="list.onSortChange($event)"
    >
      <ng-container [tnColumnDef]="'time'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ titles().snapshotTime }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-relative-date-cell
            [value]="row.time.$date"
            [title]="titles().snapshotTime"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-relative-date-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'hostname'" [sortable]="true">
        <ng-template tnHeaderCellDef>{{ titles().hostname }}</ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-text-cell
            [value]="row.hostname"
            [title]="titles().hostname"
            [uniqueRowTag]="uniqueRowTag(row)"
          ></ix-table-text-cell>
        </ng-template>
      </ng-container>

      <ng-container [tnColumnDef]="'actions'" [width]="'80px'">
        <!-- The actions column has no visible heading, but it still needs an accessible one. -->
        <ng-template tnHeaderCellDef><span class="sr-only">{{ 'Actions' | translate }}</span></ng-template>
        <ng-template let-row tnCellDef>
          <ix-table-actions-cell
            [actions]="actions"
            [row]="row"
            [uniqueRowTag]="uniqueRowTag(row)"
            [ariaLabel]="ariaLabel(row)"
          ></ix-table-actions-cell>
        </ng-template>
      </ng-container>
    </tn-table>
  } @else {
    <div class="spinner-container">
      <tn-spinner mode="indeterminate" [diameter]="40"></tn-spinner>
    </div>
  }
  <tn-table-pager [dataProvider]="dataProvider()"></tn-table-pager>
</tn-card>
