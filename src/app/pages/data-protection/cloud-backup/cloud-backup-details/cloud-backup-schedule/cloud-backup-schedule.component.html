<tn-card class="card" [title]="'Schedule' | translate">
  <p>{{ 'Task Name' | translate }}: <span tnTestId="task-name" tnTestIdType="text">{{ backup().description || '-' }}</span></p>
  <p>{{ 'Frequency' | translate }}: <span tnTestId="frequency" tnTestIdType="text">{{ backup().schedule | scheduleDescription }}</span></p>
  <p>{{ 'Schedule' | translate }}: <span tnTestId="schedule" tnTestIdType="text">{{ schedule() || '-' }}</span></p>
</tn-card>
