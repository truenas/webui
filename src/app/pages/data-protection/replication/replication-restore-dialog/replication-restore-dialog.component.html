<tn-dialog-shell testId="replication-restore" [title]="'Restore Replication Task' | translate">
  <ix-form
    [formGroup]="form"
    [requiredRoles]="requiredRoles"
    [submitHandler]="handleSubmit"
    (closed)="dialogRef.close(true)"
  >
    <tn-form-field [label]="'Name' | translate" [tooltip]="helptext.nameTooltip | translate" [required]="true">
      <tn-input
        testId="name"
        formControlName="name"
        [required]="true"
      ></tn-input>
    </tn-form-field>

    <ix-explorer
      formControlName="target_dataset"
      [label]="'Destination' | translate"
      [required]="true"
      [tooltip]="helptext.targetDatasetTooltip | translate"
      [nodeProvider]="treeNodeProvider"
      [rootNodes]="rootNodes"
    ></ix-explorer>
  </ix-form>

  <ix-form-actions tnDialogAction>
    <tn-button
      variant="outline"
      testId="cancel"
      [label]="'Cancel' | translate"
      (onClick)="dialogRef.close()"
    ></tn-button>

    <tn-button
      *ixRequiresRoles="requiredRoles"
      color="primary"
      testId="restore"
      [label]="'Restore' | translate"
      [disabled]="!canSubmit()"
      (onClick)="submit()"
    ></tn-button>
  </ix-form-actions>
</tn-dialog-shell>
