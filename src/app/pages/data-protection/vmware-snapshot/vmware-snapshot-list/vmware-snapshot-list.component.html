<ix-page-header>
  <ix-basic-search [query]="searchQuery()" (queryChange)="onListFiltered($event)"></ix-basic-search>

  <tn-button
    *ixRequiresRoles="requiredRoles"
    color="primary"
    [testId]="'add-vmware-snapshot'"
    [label]="'Add' | translate"
    (onClick)="doAdd()"
  ></tn-button>
</ix-page-header>

<div class="table-container">
  <tn-table
    class="table"
    [wrapCells]="true"
    [expandOnRowClick]="true"
    [testId]="'table-table'"
    [ixUiSearch]="searchableElements.elements.vmwareSnapshots"
    [dataSource]="list.rows()"
    [displayedColumns]="list.displayedColumns()"
    [trackBy]="trackBySnapshotId"
    [loading]="list.isLoading()"
    [expandable]="true"
    [clickable]="true"
    [emptyMessage]="list.empty.message()"
    [emptyIcon]="list.empty.icon()"
    (sortChange)="list.onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'hostname'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().hostname }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.hostname"
          [title]="titles().hostname"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'username'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().username }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.username"
          [title]="titles().username"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'filesystem'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().filesystem }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.filesystem"
          [title]="titles().filesystem"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'datastore'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ titles().datastore }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.datastore"
          [title]="titles().datastore"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'state'" [sortable]="true" [width]="'140px'">
      <ng-template tnHeaderCellDef>{{ titles().state }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-vmware-status-cell [state]="row.state"></ix-vmware-status-cell>
      </ng-template>
    </ng-container>

    <ng-template let-snapshot tnDetailRowDef>
      <div class="table-details-row-actions">
        <tn-button
          [testId]="detailActionTestId(snapshot, 'edit')"
          [label]="'Edit' | translate"
          (onClick)="doEdit(snapshot)"
        ></tn-button>
        <tn-button
          *ixRequiresRoles="requiredRoles"
          [testId]="detailActionTestId(snapshot, 'delete')"
          [label]="'Delete' | translate"
          (onClick)="doDelete(snapshot)"
        ></tn-button>
      </div>
    </ng-template>
  </tn-table>

  <tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
</div>
