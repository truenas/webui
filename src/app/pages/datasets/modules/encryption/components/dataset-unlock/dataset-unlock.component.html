<tn-card class="card" [padContent]="false" [fillHeight]="false">
  <ix-form
    [formGroup]="form"
    [requiredRoles]="requiredRoles"
    [submitHandler]="handleSubmit"
    [suppressSuccessSnackbar]="true"
  >
    <div class="fields">
      @if (!hideFileInput) {
        <tn-form-field
          [label]="helptext.keyFileLabel | translate"
          [tooltip]="helptext.keyFileTooltip | translate"
        >
          <tn-radio-group
            formControlName="use_file"
            [options]="useFileOptions"
          ></tn-radio-group>
        </tn-form-field>
      }

      @if (useFile) {
        <tn-form-field [tooltip]="helptext.unlockChildrenTooltip | translate">
          <tn-checkbox
            formControlName="unlock_children"
            [label]="helptext.unlockChildrenLabel | translate"
          ></tn-checkbox>
        </tn-form-field>

        <!--
          `tn-file-input` composes its own id under a `file-input-*` prefix and has no
          control-name fallback, so the legacy `input-file` is pinned on the host instead.
        -->
        <tn-form-field
          [label]="helptext.uploadKeyFileLabel | translate"
          [tooltip]="helptext.uploadKeyFileTooltip | translate"
          [required]="true"
        >
          <tn-file-input
            tnTestIdType="input"
            formControlName="file"
            [tnTestId]="'file'"
            [ariaLabel]="helptext.uploadKeyFileLabel | translate"
            [buttonLabel]="'Choose File' | translate"
            [noFileText]="'No file chosen' | translate"
          ></tn-file-input>
        </tn-form-field>
      } @else {
        <ix-list
          formArrayName="datasets"
          [empty]="form.controls.datasets.controls.length === 0"
          [label]="'Datasets' | translate"
          [canAdd]="false"
          [formArray]="form.controls.datasets"
        >
          @for (dataset of form.controls.datasets.controls; track dataset; let i = $index) {
            <ix-list-item
              [formGroupName]="i"
              [canDelete]="false"
            >
              <div>
                <strong> {{'Dataset' | translate }}: </strong>
                {{ dataset.value.name }}
              </div>
              @if (dataset.value.is_passphrase) {
                <tn-form-field
                  [label]="helptext.datasetPassphraseLabel | translate"
                  [tooltip]="helptext.datasetPassphraseTooltip | translate"
                >
                  <tn-input
                    formControlName="passphrase"
                    [inputType]="InputType.Password"
                  ></tn-input>
                </tn-form-field>
              } @else {
                <tn-form-field
                  [label]="helptext.datasetKeyLabel | translate"
                  [tooltip]="helptext.datasetKeyLabel | translate"
                >
                  <tn-input
                    formControlName="key"
                    [multiline]="true"
                  ></tn-input>
                </tn-form-field>
                <tn-form-field>
                  <tn-file-input
                    tnTestIdType="input"
                    accept=".json"
                    formControlName="file"
                    [tnTestId]="'file'"
                    [ariaLabel]="helptext.datasetKeyLabel | translate"
                    [buttonLabel]="'Choose File' | translate"
                    [noFileText]="'No file chosen' | translate"
                  ></tn-file-input>
                </tn-form-field>
              }
            </ix-list-item>
          }
        </ix-list>
      }

      <tn-form-field [tooltip]="helptext.datasetForceTooltip | translate">
        <tn-checkbox
          formControlName="force"
          [label]="'Force' | translate"
        ></tn-checkbox>
      </tn-form-field>
    </div>

    <div class="form-actions">
      <tn-button
        *ixRequiresRoles="requiredRoles"
        type="submit"
        color="primary"
        [testId]="'unlock'"
        [label]="'Unlock' | translate"
        [disabled]="!canSubmit()"
      ></tn-button>
      <tn-button
        [testId]="'cancel'"
        [label]="'Cancel' | translate"
        (onClick)="goBack()"
      ></tn-button>
    </div>
  </ix-form>
</tn-card>
