<tn-dialog-shell testId="save-as-preset" [title]="'Save As Preset' | translate">
<form [formGroup]="form" (submit)="onSubmit()">
  <div>
    <p>{{ 'Save current ACL entries as a preset for future use.' | translate }}</p>

    <div class="exist-content">
      <h4 class="label">{{ 'Existing presets' | translate }}:</h4>
      <div class="presets">
        <!--
          Every custom preset's remove icon emits `button-remove-preset`. This id tells the rows apart
          without renaming it.
        -->
        @for (preset of presets; track preset.id) {
          <div
            class="preset"
            tnTestIdType="row"
            [ngClass]="{ 'preset-disabled': !isCurrentAclType(preset.acltype) }"
            [tnTestId]="['preset', preset.name]"
          >
            <div class="preset-name" tnTestIdType="text" [tnTestId]="['preset', preset.name, 'name']">{{ preset.name }}</div>
            <div class="preset-type" tnTestIdType="text" [tnTestId]="['preset', preset.name, 'type']">{{ preset.acltype }}</div>
            @if (!preset.builtin) {
              <tn-icon-button
                testId="remove-preset"
                class="preset-remove"
                name="close-circle"
                library="mdi"
                [ariaLabel]="'Remove preset' | translate"
                (onClick)="onRemovePreset(preset)"
              ></tn-icon-button>
            }
          </div>
        }
      </div>
    </div>

    <div class="save-content">
      <h4 class="label">{{ 'Save ACL as preset' | translate }}:</h4>
      <tn-form-field [label]="'Preset Name' | translate">
        <tn-input testId="preset-name" formControlName="presetName"></tn-input>
      </tn-form-field>
    </div>
  </div>
</form>

<!--
  The Cancel and Save below emit `button-cancel` and `button-save`, and the ACL editor still on the
  page behind this dialog has its own `button-cancel`. This id scopes them to the dialog without
  renaming any of them.
-->
<ix-form-actions tnDialogAction class="form-actions" tnTestIdType="actions" [tnTestId]="'save-as-preset'">
  <tn-button variant="outline" testId="cancel" [label]="'Cancel' | translate" (onClick)="dialogRef.close()"></tn-button>
  <tn-button color="primary" testId="save" [label]="'Save' | translate" [disabled]="form.invalid || isFormLoading()" (onClick)="onSubmit()"></tn-button>
</ix-form-actions>
</tn-dialog-shell>
