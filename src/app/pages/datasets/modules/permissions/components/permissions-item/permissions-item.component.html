<div class="icon">
  @switch (item().type) {
    @case (PermissionsItem.Group) {
      <tn-icon name="account-multiple" library="mdi"></tn-icon>
    }
    @case (PermissionsItem.Other) {
      <tn-icon name="account-group" library="mdi"></tn-icon>
    }
    @default {
      <tn-icon name="account" library="mdi"></tn-icon>
    }
  }
</div>
<div class="name" tnTestIdType="text" [tnTestId]="['permissions-item', item().name, 'name']">{{ item().name }}</div>
<div class="permissions" tnTestIdType="text" [tnTestId]="['permissions-item', item().name, 'permissions']">{{ item().description }}</div>
