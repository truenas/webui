<tn-card
  class="form-card"
  [primaryAction]="primaryAction()"
  [secondaryAction]="secondaryAction()"
>
  @if (isInitialLoading()) {
    <div class="loading-state">
      <tn-spinner
        mode="indeterminate"
        [diameter]="40"
      ></tn-spinner>
    </div>
  }

  @if (isLoading() && !isInitialLoading()) {
    <tn-progress-bar mode="indeterminate"></tn-progress-bar>
  }

  @if (group()?.group) {
    <h3 tnCardHeader class="tn-card__title members-card-title">
      {{ 'Manage members of {name} group' | translate: { name: group()?.group || '' } }}
      @if (requiredRoles.length && !hasAccountWrite()) {
        <ix-readonly-badge></ix-readonly-badge>
      }
    </h3>
  }

  @if (users().length) {
    @if (builtinUserCount()) {
      <div class="member-filters">
        <tn-checkbox
          testId="hide-builtin-users"
          [label]="'Hide built-in users ({count})' | translate: { count: builtinUserCount() }"
          [checked]="hideBuiltinUsers()"
          (change)="hideBuiltinUsers.set($event)"
        ></tn-checkbox>
      </div>
    }

    <ix-dual-listbox
      display="username"
      key="id"
      height="55vh"
      [sort]="true"
      [listItemIcon]="tnIconMarker('account', 'mdi')"
      [sourceName]="'All Users' | translate"
      [targetName]="'Group Members' | translate"
      [source]="availableUsers()"
      [(destination)]="selectedMembers"
    ></ix-dual-listbox>
  }
</tn-card>
