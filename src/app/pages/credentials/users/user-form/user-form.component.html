<ix-form
  [formGroup]="form"
  [isEditMode]="!isNewUser()"
  [requiredRoles]="requiredRoles"
  [submitHandler]="handleSubmit"
  (closed)="closed.emit($event)"
>
  <tn-form-section>
    <div>
      <tn-form-field [label]="'Username' | translate" [required]="true">
        <tn-input
          class="username"
          name="username"
          formControlName="username"
          [required]="true"
          [testId]="'username'"
        ></tn-input>
      </tn-form-field>
    </div>
  </tn-form-section>

  <ix-allowed-access-section
    [editingUser]="editingUser()"
    [password]="password()"
    [passwordDisabled]="passwordDisabled()"
    [preset]="preset()"
  ></ix-allowed-access-section>

  <ix-auth-section
    [editingUser]="editingUser()"
    [homeDirectory]="homeDirectory()"
    [shell]="shell()"
    [preset]="preset()"
  ></ix-auth-section>

  <ix-additional-details-section [editingUser]="editingUser()"></ix-additional-details-section>
</ix-form>
