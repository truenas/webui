@if (user()?.roles?.length) {
  <div class="user-roles">
    <tn-icon
      size="md"
      name="tn-truenas-logo-mark"
      tnTestIdType="icon"
      [tnTooltip]="'TrueNAS Access' | translate"
      [tnTestId]="[uniqueRowTag(), 'truenas-access']"
    ></tn-icon>
    <span>{{ roles() }}</span>
  </div>
}

@if (user().smb) {
  <tn-icon
    size="md"
    name="tn-smb-share"
    tnTestIdType="icon"
    [tnTooltip]="'Has SMB Access' | translate"
    [tnTestId]="[uniqueRowTag(), 'smb-access']"
  ></tn-icon>
}

@if (user().webshare) {
  <tn-icon
    size="md"
    name="share-variant"
    library="mdi"
    tnTestIdType="icon"
    [tnTooltip]="'Has WebShare Access' | translate"
    [tnTestId]="[uniqueRowTag(), 'webshare-access']"
  ></tn-icon>
}

@if (user().ssh_password_enabled || user().sshpubkey) {
  <tn-icon
    size="md"
    name="ssh"
    library="mdi"
    tnTestIdType="icon"
    [tnTooltip]="'Has SSH Access' | translate"
    [tnTestId]="[uniqueRowTag(), 'ssh-access']"
  ></tn-icon>
}

@if (user().api_keys?.length) {
  <tn-icon
    size="md"
    name="power-plug"
    library="mdi"
    tnTestIdType="icon"
    [tnTooltip]="'Has API Access' | translate"
    [tnTestId]="[uniqueRowTag(), 'api-access']"
  ></tn-icon>
}
