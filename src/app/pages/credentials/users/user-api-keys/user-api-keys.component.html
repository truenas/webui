<ix-page-header>
  <div class="search-container">
    <ix-search-input
      #searchInput
      class="search-input"
      [properties]="searchProperties"
      [query]="searchQuery"
      [advancedSearchPlaceholder]="advancedSearchPlaceholder"
      (runSearch)="onSearch(searchInput.query());"
    ></ix-search-input>
    <div class="search-button-wrapper">
      <tn-button
        testId="search"
        [label]="'Search' | translate"
        (onClick)="onSearch(searchInput.query())"
      ></tn-button>

      <tn-button
        href="/api/docs"
        target="_blank"
        rel="noopener"
        testId="api-docs"
        [label]="'API Docs' | translate"
      ></tn-button>

      <tn-button
        *ixRequiresRoles="requiredRoles"
        color="primary"
        testId="add-api-key"
        [ixUiSearch]="searchableElements.elements.add"
        [label]="'Add' | translate"
        (onClick)="openForm()"
      ></tn-button>
    </div>
  </div>
</ix-page-header>

<div class="table-container" [ixUiSearch]="searchableElements.elements.list">
  @let emptyType = dataProvider.emptyType$ | async;
  <tn-table
    [dataSource]="(dataProvider.currentPage$ | async) ?? []"
    [rowTestId]="uniqueRowTag"
    [displayedColumns]="displayedColumns"
    [trackBy]="trackById"
    [loading]="!!(dataProvider.isLoading$ | async)"
    [loadingMessage]="emptyService.loadingMessage()"
    [emptyMessage]="emptyService.titleForType(emptyType)"
    [emptyDescription]="emptyService.descriptionForType(emptyType)"
    [emptyIcon]="emptyService.iconForType(emptyType)"
    (sortChange)="onSortChange($event)"
  >
    <ng-container [tnColumnDef]="'name'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Name' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.name"
          [title]="'Name' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'username'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Username' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.username"
          [title]="'Username' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'local'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Local' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.local | yesNo | translate"
          [title]="'Local' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
          [testIdSuffix]="'row-yesno'"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'revoked'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Revoked' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-table-text-cell
          [value]="row.revoked | yesNo | translate"
          [title]="'Revoked' | translate"
          [uniqueRowTag]="uniqueRowTag(row)"
          [testIdSuffix]="'row-yesno'"
        ></ix-table-text-cell>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'created_at'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Created Date' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <ix-date
          tnTestIdType="date"
          [date]="row.created_at.$date"
          [tnTestId]="[('Created Date' | translate), uniqueRowTag(row), 'row-date']"
        ></ix-date>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'expires_at'" [sortable]="true">
      <ng-template tnHeaderCellDef>{{ 'Expires On' | translate }}</ng-template>
      <ng-template let-row tnCellDef>
        <span
          tnTestIdType="text"
          [tnTestId]="[('Expires On' | translate), uniqueRowTag(row), 'row-relative-date']"
        >{{ expiresLabel(row) }}</span>
      </ng-template>
    </ng-container>

    <ng-container [tnColumnDef]="'actions'" [width]="'120px'">
      <ng-template tnHeaderCellDef></ng-template>
      <ng-template let-row tnCellDef>
        <div class="actions-cell">
          @if (!row.revoked) {
            <tn-icon-button
              name="pencil"
              library="mdi"
              [tooltip]="'Edit' | translate"
              [ariaLabel]="'Edit' | translate"
              [disabled]="isActionDisabled(row)"
              [testId]="['edit', row.name]"
              (onClick)="openForm(row)"
            ></tn-icon-button>
          }
          <tn-icon-button
            name="delete"
            library="mdi"
            [tooltip]="'Delete' | translate"
            [ariaLabel]="'Delete' | translate"
            [disabled]="isActionDisabled(row)"
            [testId]="['delete', row.name]"
            (onClick)="doDelete(row)"
          ></tn-icon-button>
        </div>
      </ng-template>
    </ng-container>
  </tn-table>
  <tn-table-pager [dataProvider]="dataProvider"></tn-table-pager>
</div>
