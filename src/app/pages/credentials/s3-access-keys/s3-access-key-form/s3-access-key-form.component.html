<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="title"
  [loading]="isLoading()"
></ix-modal-header>

<mat-card>
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        <ix-input
          formControlName="name"
          [label]="'Name' | translate"
          [tooltip]="helptext.accessKeyNameTooltip | translate"
          [required]="true"
        ></ix-input>

        @if (isNew) {
          <ix-user-picker
            formControlName="username"
            [label]="'User' | translate"
            [tooltip]="helptext.accessKeyUsernameTooltip | translate"
            [required]="true"
            [provider]="userProvider"
          ></ix-user-picker>
        } @else {
          <ix-input
            formControlName="username"
            [label]="'User' | translate"
            [tooltip]="helptext.accessKeyUsernameTooltip | translate"
          ></ix-input>
        }

        <ix-checkbox
          formControlName="enabled"
          [label]="'Enabled' | translate"
          [tooltip]="helptext.accessKeyEnabledTooltip | translate"
        ></ix-checkbox>

        <ix-checkbox
          formControlName="nonExpiring"
          [label]="'Non-expiring' | translate"
        ></ix-checkbox>

        @if (!form.controls.nonExpiring.value) {
          <ix-datepicker
            formControlName="expires_at"
            [label]="'Expires On' | translate"
            [min]="minDateToday"
          ></ix-datepicker>
        }
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
