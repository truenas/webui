<form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
  <tn-form-section>
    <tn-form-field
      [label]="'Name' | translate"
      [tooltip]="helptext.accessKeyNameTooltip | translate"
      [required]="true"
    >
      <tn-input name="name" formControlName="name"></tn-input>
    </tn-form-field>

    @if (isNew()) {
      <ix-user-picker
        formControlName="username"
        [label]="'User' | translate"
        [tooltip]="helptext.accessKeyUsernameTooltip | translate"
        [required]="true"
        [provider]="userProvider"
      ></ix-user-picker>
    } @else {
      <tn-form-field
        [label]="'User' | translate"
        [tooltip]="helptext.accessKeyUsernameTooltip | translate"
      >
        <tn-input name="username" formControlName="username"></tn-input>
      </tn-form-field>
    }

    <tn-form-field [tooltip]="helptext.accessKeyEnabledTooltip | translate">
      <tn-checkbox formControlName="enabled" [label]="'Enabled' | translate"></tn-checkbox>
    </tn-form-field>

    <tn-form-field>
      <tn-checkbox formControlName="nonExpiring" [label]="'Non-expiring' | translate"></tn-checkbox>
    </tn-form-field>

    @if (!form.controls.nonExpiring.value) {
      <tn-form-field [label]="'Expires On' | translate" [required]="true">
        <tn-date-input
          formControlName="expires_at"
          [min]="minDateToday"
          [testId]="'expires-at'"
        ></tn-date-input>
      </tn-form-field>
    }
  </tn-form-section>
</form>
