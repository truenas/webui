<ng-container [formGroup]="form">
  <tn-form-section [heading]="'Authentication' | translate">
    <!-- TODO: Should have [required]="true", but because of required FormsModule directly, it creates issues on edit -->
    <tn-form-field
      [label]="'Service Account Key' | translate"
      [tooltip]="helptext.googleCloudStorage.uploadKey.tooltip | translate"
    >
      <!--
        The test id is pinned on the host: `tn-file-input` types its own container
        `file-input`, which would rename the legacy `input-upload-credentials`.
        With no `testId` input the container composes an empty id and writes none.
      -->
      <tn-file-input
        formControlName="upload_credentials"
        tnTestIdType="input"
        [tnTestId]="'upload-credentials'"
        [ariaLabel]="'Service Account Key' | translate"
        [buttonLabel]="'Choose File' | translate"
        [noFileText]="'No file chosen' | translate"
      ></tn-file-input>
    </tn-form-field>

    <tn-form-field
      [label]="'Preview JSON Service Account Key' | translate"
      [tooltip]="helptext.googleCloudStorage.previewKey.tooltip | translate"
    >
      <tn-input
        formControlName="service_account_credentials"
        testId="service-account-credentials"
        [multiline]="true"
        [rows]="4"
        [readonly]="true"
      ></tn-input>
    </tn-form-field>
  </tn-form-section>
</ng-container>
