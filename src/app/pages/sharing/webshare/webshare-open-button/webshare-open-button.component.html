@if (isIcon()) {
  @if (showsMenu()) {
    <tn-icon-button
      name="open-in-new"
      library="mdi"
      [testId]="testId()"
      [tooltip]="tooltip() || ''"
      [ariaLabel]="iconAriaLabel()"
      [tnMenuTriggerFor]="hostnameMenu"
    ></tn-icon-button>
  } @else {
    <tn-icon-button
      name="open-in-new"
      library="mdi"
      [testId]="testId()"
      [tooltip]="tooltip() || ''"
      [ariaLabel]="iconAriaLabel()"
      [disabled]="!!unavailableReason()"
      (onClick)="open()"
    ></tn-icon-button>
  }
} @else {
  @if (showsMenu()) {
    <tn-button
      variant="outline"
      color="default"
      [label]="'Open WebShare' | translate"
      [testId]="testId()"
      [tnTooltip]="tooltip() || ''"
      [tnMenuTriggerFor]="hostnameMenu"
    ></tn-button>
  } @else {
    <tn-button
      variant="outline"
      color="default"
      [label]="'Open WebShare' | translate"
      [testId]="testId()"
      [tnTooltip]="tooltip() || ''"
      [disabled]="!!unavailableReason()"
      (onClick)="open()"
    ></tn-button>
  }
}

<tn-menu #hostnameMenu>
  @for (choice of hostnameChoices(); track choice.ip) {
    <tn-menu-item
      [id]="choice.ip"
      [testId]="menuItemTestId(choice.ip)"
      [label]="choice.ip"
      (itemClick)="open(choice.hostname)"
    ></tn-menu-item>
  }
</tn-menu>
