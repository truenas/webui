<mat-card>
  <ix-fake-progress-bar [loading]="!!(dataProvider.isLoading$ | async)"></ix-fake-progress-bar>
  <mat-toolbar-row>
    <h3>{{ 'S3 Buckets' | translate }}</h3>
    <div class="actions action-icon">
      <ix-basic-search
        [query]="searchQuery()"
        (queryChange)="onListFiltered($event)"
      ></ix-basic-search>

      <a
        mat-button
        ixTest="s3-access-keys"
        routerLink="/credentials/s3-access-keys"
      >
        {{ 'Access Keys' | translate }}
      </a>

      <ix-table-columns-selector
        [columnPreferencesKey]="'s3BucketList'"
        [columns]="columns"
        (columnsChange)="columnsChange($event)"
      ></ix-table-columns-selector>

      <button
        *ixRequiresRoles="requiredRoles"
        mat-button
        color="primary"
        ixTest="add-s3-bucket"
        [ixUiSearch]="searchableElements.elements.createS3Bucket"
        (click)="doAdd()"
      >
        {{ 'Add' | translate }}
      </button>
    </div>
  </mat-toolbar-row>

  <mat-card-content [ixUiSearch]="searchableElements.elements.s3">
    @if ((dataProvider.emptyType$ | async) === EmptyType.NoPageData && !(dataProvider.currentPageCount$ | async)) {
      <ix-empty [conf]="emptyConfig"></ix-empty>
    } @else {
      <ix-table
        [ix-table-empty]="!(dataProvider.currentPageCount$ | async)"
        [emptyConfig]="emptyService.defaultEmptyConfig(dataProvider.emptyType$ | async)"
      >
        <thead
          ix-table-head
          [columns]="columns"
          [dataProvider]="dataProvider"
        ></thead>
        <tbody
          ix-table-body
          [columns]="columns"
          [dataProvider]="dataProvider"
          [isLoading]="!!(dataProvider.isLoading$ | async)"
        ></tbody>
      </ix-table>

      <ix-table-pager [dataProvider]="dataProvider"></ix-table-pager>
    }
  </mat-card-content>
</mat-card>
