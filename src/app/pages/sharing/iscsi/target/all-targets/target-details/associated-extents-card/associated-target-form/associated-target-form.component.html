<tn-dialog-shell testId="associated-target-form" [title]="('Associate' | translate) + ' ' + data.target.name">
  <!--
    Hosted in a dialog, so `SlideInRef` is absent: `<ix-form>` renders neither the modal header
    nor its own Save row, and hands the created record back through `closed` for the dialog to
    close with. The dialog's own action slot owns Cancel/Associate, driven by the form's public
    `canSubmit()`/`submit()`.
  -->
  <ix-form
    [formGroup]="form"
    [isEditMode]="false"
    [requiredRoles]="requiredRoles"
    [submitHandler]="handleSubmit"
    (closed)="dialogRef.close($event)"
  >
    <tn-form-section>
      <tn-form-field [label]="'LUN ID' | translate" [tooltip]="tooltips.lunid | translate">
        <tn-input
          testId="lunid"
          formControlName="lunid"
          [inputType]="InputType.Number"
        ></tn-input>
      </tn-form-field>

      <tn-form-field [label]="'Extent' | translate" [tooltip]="tooltips.extent | translate" [required]="true">
        <tn-select
          testId="extent"
          formControlName="extent"
          [options]="(extents$ | async) ?? []"
          [placeholder]="tnSelectLabels.placeholder | translate"
          [noOptionsLabel]="tnSelectLabels.noOptions | translate"
        ></tn-select>
      </tn-form-field>
    </tn-form-section>
  </ix-form>

  <ix-form-actions tnDialogAction class="form-actions">
    <tn-button
      variant="outline"
      testId="cancel-associate-target"
      [label]="'Cancel' | translate"
      (onClick)="dialogRef.close(false)"
    ></tn-button>

    @if (formRef(); as ixForm) {
      <!--
        `ix-form` renders its own "Saving…" indicator only in the SlideIn arm of its template,
        which this dialog host never reaches — so drive the in-flight feedback from the same
        public signal here, replacing the LoaderService overlay this form used before.
      -->
      <tn-button
        *ixRequiresRoles="requiredRoles"
        color="primary"
        testId="associate-target"
        aria-live="polite"
        [label]="ixForm.isSubmitting() ? ('Saving…' | translate) : ('Associate' | translate)"
        [disabled]="!ixForm.canSubmit()"
        [attr.aria-busy]="ixForm.isSubmitting() || null"
        (onClick)="ixForm.submit()"
      ></tn-button>
    }
  </ix-form-actions>
</tn-dialog-shell>
