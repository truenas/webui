<tn-card
  class="form-card"
  [ixUiSearch]="searchableElements.elements.addInitiator"
  [primaryAction]="primaryAction()"
  [secondaryAction]="secondaryAction()"
>
  @if (isFormLoading()) {
    <tn-progress-bar
      mode="indeterminate"
    ></tn-progress-bar>
  }
  <!--
    No `(submit)`: Save lives in the card footer, which is outside this form, so nothing here
    submits it deliberately. Keeping the handler would leave implicit submission (Enter in a
    text field) as a second, unguarded path into `onSubmit()` — one that ignores the role,
    loading and validity checks `primaryAction()` applies.
  -->
  <form class="ix-form-container" [formGroup]="form">
    <div class="card-content">
      <div class="header-container">
        <tn-form-field>
          <tn-checkbox
            formControlName="all"
            [label]="helptext.initiator.allowAllLabel | translate"
          ></tn-checkbox>
        </tn-form-field>
        @if (!isAllowAll) {
          <div class="add-container">
            <tn-form-field
              [label]="helptext.initiator.addIqnLabel | translate"
              [tooltip]="helptext.initiator.initiatorsTooltip | translate"
            >
              <tn-input
                formControlName="new_initiator"
                (keydown.enter)="$event.preventDefault(); onAddInitiator()"
              ></tn-input>
            </tn-form-field>
            <tn-icon-button
              name="plus"
              library="mdi"
              [testId]="'add-initiator'"
              [ariaLabel]="'Add Initiator' | translate"
              [disabled]="isFormLoading()"
              (onClick)="onAddInitiator()"
            ></tn-icon-button>
          </div>
        }
      </div>

      @if (!isAllowAll) {
        <ix-dual-listbox
          display="name"
          key="id"
          height="55vh"
          [sourceName]="'Connected Initiators' | translate"
          [targetName]="'Allowed Initiators' | translate"
          [source]="allInitiators()"
          [(destination)]="selectedInitiators"
        ></ix-dual-listbox>

        <tn-button
          type="button"
          variant="filled"
          color="default"
          class="refresh-button"
          icon="mdi-refresh"
          [testId]="'refresh'"
          [label]="'Refresh' | translate"
          [disabled]="isFormLoading()"
          (onClick)="getConnectedInitiators()"
        ></tn-button>
      }

      <tn-form-field [label]="helptext.initiator.descriptionLabel | translate">
        <tn-input
          formControlName="comment"
        ></tn-input>
      </tn-form-field>
    </div>
  </form>
</tn-card>
