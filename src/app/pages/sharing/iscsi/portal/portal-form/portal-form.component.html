<ix-form
  [formGroup]="form"
  [isEditMode]="!isNew"
  [requiredRoles]="requiredRoles"
  [submitHandler]="handleSubmit"
  (closed)="closed.emit($event)"
>
  <tn-form-section [heading]="'Basic Info' | translate">
    <tn-form-field [label]="labels.comment | translate">
      <tn-input formControlName="comment"></tn-input>
    </tn-form-field>
  </tn-form-section>

  <tn-form-section [heading]="'IP Address' | translate">
    <tn-form-list
      formArrayName="ip"
      [control]="form.get('ip')"
      [empty]="listen.length === 0"
      [label]="'Add listen' | translate"
      [required]="true"
      [addLabel]="'Add' | translate"
      [emptyMessage]="'No items have been added yet.' | translate"
      (add)="onAdd()"
    >
      @for (item of listen; track item; let i = $index) {
        <tn-form-list-item
          testId="remove-from-list"
          [label]="'IP Address' | translate"
          [removeAriaLabel]="'Remove {label} item' | translate: { label: 'IP Address' | translate }"
          (delete)="onDelete(i)"
        >
          <tn-form-field
            [label]="labels.ip | translate"
            [tooltip]="tooltips.ip | translate"
            [required]="true"
          >
            <tn-select
              [formControlName]="i"
              [options]="(listenOptions$ | async) ?? []"
            ></tn-select>
          </tn-form-field>
        </tn-form-list-item>
      }
    </tn-form-list>
  </tn-form-section>
</ix-form>
