<span tnTestId="details-for" tnTestIdType="text">
  {{ 'Details for {name}' | translate: { name: subsystem()?.name ?? '' } }}
</span>

<div class="detail-actions">
  <tn-button
    *ixRequiresRoles="requiredRoles"
    [testId]="'delete-subsys'"
    [label]="'Delete' | translate"
    (onClick)="deleteSubsystem()"
  ></tn-button>
</div>
