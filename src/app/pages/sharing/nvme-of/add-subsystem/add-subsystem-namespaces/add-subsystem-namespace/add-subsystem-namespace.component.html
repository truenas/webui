<!--
  No Save button here — the tn-side-panel host renders the footer and calls submit() itself.
  The <form> is what supplies the FormGroupDirective that ix-base-namespace-form resolves its
  group from. (ngSubmit) additionally gives Enter-to-save, but only where the browser allows
  implicit submission — i.e. the single-field Zvol / Existing File branches, not New File, which
  has three. The footer Save is the path that always works.
-->
<form class="ix-form-container" [formGroup]="form" (ngSubmit)="submit()">
  <ix-base-namespace-form></ix-base-namespace-form>
</form>
