<!--
  No `<form>` and no Save button here — the tn-side-panel host renders the footer and calls
  submit() itself, applying the role gate. A native form would add Enter-to-submit on a path that
  skips that gate, and the fields it would cover are ix-explorer inputs, whose autocomplete consumes
  Enter anyway.
-->
<ix-base-namespace-form [group]="form"></ix-base-namespace-form>
