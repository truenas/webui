<!--
  No Save button here — the tn-side-panel host renders the footer and calls submit() itself.
  ix-base-namespace-form takes the group as an input and binds it itself, so this <form> carries no
  [formGroup]: it exists only to give Enter-to-save through native implicit submission, and only
  where the browser allows it — i.e. the single-field Zvol / Existing File branches, not New File,
  which has three. The footer Save is the path that always works.
-->
<form class="ix-form-container" (submit)="$event.preventDefault(); submit()">
  <ix-base-namespace-form [group]="form"></ix-base-namespace-form>
</form>
