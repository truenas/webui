<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="'NVMe-oF Global Configuration' | translate"
  [loading]="isLoading()"
></ix-modal-header>

<mat-card>
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        <!-- The NQN outgrows the panel, and hosts need it verbatim, so the copy button works for read-only
             users too; with the field disabled the hover tooltip is the only way to read the whole value. -->
        <div class="base-nqn">
          <ix-input
            formControlName="basenqn"
            [label]="'Base NQN' | translate"
            [tooltip]="helptext.baseNqnTooltip | translate"
            [matTooltip]="form.controls.basenqn.disabled ? form.controls.basenqn.value : ''"
          ></ix-input>
          <ix-copy-button [text]="form.controls.basenqn.value"></ix-copy-button>
        </div>

        @if (hasSpdk()) {
          <div [matTooltip]="isKernelLocked() ? (helptext.implementationDisabledTooltip | translate) : ''">
            <ix-radio-group
              formControlName="kernel"
              [label]="'Implementation (Experimental)' | translate"
              [options]="implementationOptions$"
              [tooltip]="helptext.implementationTooltip | translate"
            ></ix-radio-group>
          </div>
        }

        <ix-licensed-feature
          [locked]="isAnaUnavailable()"
          [tooltip]="helptext.anaTooltip | translate"
          [lockedTooltip]="helptext.anaDisabledTooltip | translate"
        >
          <ix-checkbox
            formControlName="ana"
            [label]="'Enable Asymmetric Namespace Access (ANA)' | translate"
          ></ix-checkbox>
        </ix-licensed-feature>

        <!-- `rdma.capable_protocols` folds the Enterprise license into its answer, so the UI can't tell a
             missing license from missing hardware: the locked state shows the full requirement text. -->
        <ix-licensed-feature [locked]="isRdmaUnavailable()" [tooltip]="helptext.rdmaTooltip | translate">
          <ix-checkbox
            formControlName="rdma"
            [label]="'Enable Remote Direct Memory Access (RDMA)' | translate"
          ></ix-checkbox>
        </ix-licensed-feature>
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
