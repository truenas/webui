<ix-modal-header
  [requiredRoles]="requiredRoles"
  [title]="'NVMe-oF Global Configuration' | translate"
  [loading]="isLoading()"
></ix-modal-header>

<mat-card>
  <mat-card-content>
    <form class="ix-form-container" [formGroup]="form" (submit)="onSubmit()">
      <ix-fieldset>
        <ix-input
          formControlName="basenqn"
          [label]="'Base NQN' | translate"
          [tooltip]="helptext.baseNqnTooltip | translate"
        ></ix-input>

        @if (hasSpdk()) {
          <div [matTooltip]="form.controls.kernel.disabled ? (helptext.implementationDisabledTooltip | translate) : ''">
            <ix-radio-group
              formControlName="kernel"
              [label]="'Implementation (Experimental)' | translate"
              [options]="implementationOptions$"
              [tooltip]="helptext.implementationTooltip | translate"
            ></ix-radio-group>
          </div>
        }

        <ix-licensed-feature
          [locked]="form.controls.ana.disabled"
          [lockedTooltip]="helptext.anaDisabledTooltip | translate"
        >
          <ix-checkbox
            formControlName="ana"
            [label]="'Enable Asymmetric Namespace Access (ANA)' | translate"
          ></ix-checkbox>
        </ix-licensed-feature>

        <!-- `rdma.capable_protocols` folds the Enterprise license into its answer, so the UI can't tell a
             missing license from missing hardware: the locked state shows the full requirement text. -->
        <ix-licensed-feature [locked]="form.controls.rdma.disabled" [tooltip]="helptext.rdmaTooltip | translate">
          <ix-checkbox
            formControlName="rdma"
            [label]="'Enable Remote Direct Memory Access (RDMA)' | translate"
          ></ix-checkbox>
        </ix-licensed-feature>
      </ix-fieldset>

      <ix-form-actions>
        <button
          *ixRequiresRoles="requiredRoles"
          mat-button
          type="submit"
          color="primary"
          ixTest="save"
          [disabled]="form.invalid || isLoading()"
        >
          {{ 'Save' | translate }}
        </button>
      </ix-form-actions>
    </form>
  </mat-card-content>
</mat-card>
