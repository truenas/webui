<ix-form
  [formGroup]="form"
  [isEditMode]="true"
  [requiredRoles]="requiredRoles"
  [externalLoading]="isLoadingConfig()"
  [submitHandler]="handleSubmit"
  (closed)="closed.emit($event)"
>
  <tn-form-section>
    <tn-form-field
      [label]="'Base NQN' | translate"
      [tooltip]="helptext.baseNqnTooltip | translate"
    >
      <tn-input formControlName="basenqn"></tn-input>
    </tn-form-field>

    @if (hasSpdk()) {
      <tn-form-field
        [label]="'Implementation (Experimental)' | translate"
        [tooltip]="helptext.implementationTooltip | translate"
        [tnTooltip]="form.controls.kernel.disabled ? (helptext.implementationDisabledTooltip | translate) : ''"
      >
        <tn-radio-group formControlName="kernel">
          @for (option of implementationOptions; track option.value) {
            <!-- `radio-button` in the base is absorbed by composeTestId's idempotent guard, keeping the
                 legacy `radio-button-*` option ids that the legacy radio group produced. -->
            <tn-radio
              [value]="option.value"
              [label]="option.label"
              [testId]="['radio-button', 'kernel', option.label]"
            ></tn-radio>
          }
        </tn-radio-group>
      </tn-form-field>
    }

    <tn-form-field>
      <ix-licensed-feature
        [locked]="form.controls.ana.disabled"
        [lockedTooltip]="helptext.anaDisabledTooltip | translate"
      >
        <tn-checkbox
          formControlName="ana"
          [label]="'Enable Asymmetric Namespace Access (ANA)' | translate"
        ></tn-checkbox>
      </ix-licensed-feature>
    </tn-form-field>

    <!-- `rdma.capable_protocols` folds the Enterprise license into its answer, so the UI can't tell a
         missing license from missing hardware: the locked state shows the full requirement text. -->
    <tn-form-field>
      <ix-licensed-feature [locked]="form.controls.rdma.disabled" [tooltip]="helptext.rdmaTooltip | translate">
        <tn-checkbox
          formControlName="rdma"
          [label]="'Enable Remote Direct Memory Access (RDMA)' | translate"
        ></tn-checkbox>
      </ix-licensed-feature>
    </tn-form-field>
  </tn-form-section>
</ix-form>
