<div class="wrapper">
  <tn-card class="splash-card" elevation="low" padding="small">
    <div class="card-body">
      <!-- role="status" is on the heading only: it implies aria-atomic="true", so a wider
           region would have the logo and copyright line announced along with the message. -->
      <h1 class="message" role="status">
        {{ message() }}
      </h1>
      <tn-icon name="tn-truenas-logo" class="logo" [fullSize]="true"></tn-icon>
      <div class="copyright-txt">
        <ix-copyright-line></ix-copyright-line>
      </div>
    </div>
  </tn-card>
</div>
