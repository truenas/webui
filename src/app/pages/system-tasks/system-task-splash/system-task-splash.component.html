<div class="wrapper">
  <tn-card class="splash-card" elevation="low" padding="small">
    <div class="card-body">
      <!-- aria-live rather than role="status": an explicit role would override the implicit
           heading semantics and leave the page with no heading at all. It sits on the heading
           itself, not on a wrapper, so the logo and copyright line are not announced with it. -->
      <h1 class="message" aria-live="polite">
        {{ message() }}
      </h1>
      <tn-icon name="tn-truenas-logo" class="logo" [fullSize]="true"></tn-icon>
      <div class="copyright-txt">
        <ix-copyright-line></ix-copyright-line>
      </div>
    </div>
  </tn-card>
</div>
