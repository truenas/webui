@if (isLoading()) {
  <ngx-skeleton-loader class="loader"></ngx-skeleton-loader>
} @else if (hasDevicesToAdd()) {
  <span
    *ixRequiresRoles="requiredRoles"
    class="add-button-wrapper"
    [matTooltip]="isContainerActive() ? (helptext.deviceRequiresStoppedTooltip | translate) : ''"
    [matTooltipDisabled]="!isContainerActive()"
  >
    <button
      mat-button
      ixTest="add-device"
      [disabled]="isContainerActive()"
      [matMenuTriggerFor]="addDeviceMenu"
    >
      {{ 'Add' | translate }}
    </button>
  </span>

  <mat-menu #addDeviceMenu="matMenu">
    @if (availableGpuDevices().length) {
      <h4 class="menu-header">{{ 'GPU Devices' | translate }}</h4>
      @for (gpu of availableGpuDevices(); track gpu.pciAddress) {
        <button
          mat-menu-item
          [ixTest]="['add-gpu-device', gpu.description]"
          (click)="addGpu(gpu)"
        >
          {{ gpu.description }}
        </button>
      }
    }
  </mat-menu>
} @else {
  <span class="no-devices-available">{{ 'No GPU devices available' | translate }}</span>
}
