#
#    TrueNAS nginx configuration file
#
#    Not the config an appliance runs. The deb installs only `dist/` (see
#    debian/rules), so a real appliance serves the UI through middleware's own
#    nginx; this mirrors that routing for testing.
#
#    One consumer: the "Serve the UI" step in .github/workflows/e2e.yml, which
#    mounts this file into a stock nginx container to serve a production build.
#    That step fills %%HOSTNAME%% and %%VERTAG%%, points the log directives at
#    the container's stderr, and adds a TLS `listen` beside the plain-HTTP one
#    below, keeping both: the token login the suite depends on is ignored on a
#    cleartext origin, while one test asserts a warning that only a cleartext
#    origin can raise. It asserts both `listen` lines afterwards, so
#    restructuring the server block fails the E2E job rather than silently
#    serving the wrong thing.
#

user www-data www-data;
master_process off;
daemon off;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Types to enable gzip compression on
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    sendfile        on;
    #tcp_nopush     on;
    client_max_body_size 1000m;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    # Disable tokens for security (#23684)
    server_tokens off;

    gzip  on;
    #upload_store /var/tmp/firmware;
    client_body_temp_path /var/tmp/firmware;

    error_log syslog:server=unix:/var/run/log,nohostname;
    access_log syslog:server=unix:/var/run/log,nohostname;

    server {
        server_name  localhost;

        add_header Strict-Transport-Security max-age=0;

        listen       0.0.0.0:80;
        listen       [::]:80;

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1";

        location / {
            rewrite ^.* $scheme://$http_host/ui/ redirect;
        }

        location /api/docs {
            proxy_pass http://%%HOSTNAME%%/api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header X-Script-Name /api/docs;
        }

        location /api/docs/restful/static {
            alias /usr/local/share/swagger-ui-dist;
        }

        location /ui {
            if ( $request_method ~ ^POST$ ) {
                proxy_pass http://%%HOSTNAME%%;
            }
            try_files $uri $uri/ /index.html =404;
            alias /var/www/webui;
            add_header Cache-Control "must-revalidate";
            add_header Etag "%%VERTAG%%";
        }

        location /api/current {
            proxy_pass http://%%HOSTNAME%%/api/current;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # The versioned WebSocket the typed client opens, e.g. `/api/v27.0.0`.
        # `@truenas/api-client` derives this path from the version it is built
        # with, so it is not `/api/current` and does not match any prefix above
        # — without this it falls to `location /`, which answers the handshake
        # with a 302 to /ui/ and leaves the client retrying a socket that never
        # opens. A regex so a version bump does not need this file edited; the
        # three-part anchor keeps it clear of the REST `/api/v2.0` below.
        location ~ ^/api/v[0-9]+\.[0-9]+\.[0-9]+$ {
            proxy_pass http://%%HOSTNAME%%;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Version discovery. The UI names its version outright and so skips
        # this, but a client that does not ask here and gets the SPA back
        # silently pins itself to the v25.10.0 fallback.
        location /api/versions {
            proxy_pass http://%%HOSTNAME%%/api/versions;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /websocket/shell {
            proxy_pass http://%%HOSTNAME%%/websocket/shell;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location /api/v2.0 {
	    # do not add the path to proxy_pass because of automatic url decoding
	    # e.g. /api/v2.0/pool/dataset/id/tank%2Ffoo/ would become
	    #      /api/v2.0/pool/dataset/id/tank/foo/
            proxy_pass http://%%HOSTNAME%%;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /_download {
            proxy_pass http://%%HOSTNAME%%;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_read_timeout 10m;
        }

        location /_upload {
            # Allow uploads of any size. Its middlewared job to handle size.
            client_max_body_size 0;
            proxy_pass http://%%HOSTNAME%%;
            # make sure nginx does not buffer the upload and pass directly to middlewared
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
        }

        location /images {
            alias /var/db/system/webui/images;
        }

        location /_plugins {
            proxy_pass http://127.0.0.1/_plugins;
            proxy_http_version 1.1;
            proxy_set_header X-Real-Remote-Addr $remote_addr;
            proxy_set_header X-Real-Remote-Port $remote_port;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/local/www/nginx-dist;
        }
    }
}
