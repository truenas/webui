name: WebUI
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'src/assets/i18n/**'
      - 'tests/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'src/assets/i18n/**'
      - 'tests/**'

permissions:
  contents: read

# Superseded commits on an open PR were running the full suite to completion,
# including `yarn test:pr --maxWorkers=50` on the self-hosted runner.
#
# The group is a literal, NOT `${{ github.workflow }}`: validate-translations.yml
# is also named "WebUI", so keying on the workflow name would put both in one
# group and let a translation-only push cancel this pipeline, and vice versa.
#
# Cancelling is limited to pull_request. On a push to master the run is the only
# record of that commit — report-coverage uploads to Codecov from it — so a
# rapid second merge must not cancel the first one's coverage.
concurrency:
  group: webui-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Checkout and Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
        with:
          cache-jest: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    # Builds the Debian package the way scale-build builds the nightly, not the
    # way the other jobs are prepared: same Debian release, and the same
    # commands as the `truenas_webui` entry in scale-build's
    # conf/build.manifest followed by the `dpkg-buildpackage` scale-build runs
    # for every package. Node comes from debian/fetch_node.sh rather than
    # setup-node. So a Node version the Debian build cannot fetch or verify, or
    # a change that breaks debian/rules, fails here and not in the nightly.
    #
    # Two deliberate differences from scale-build:
    # - Build dependencies are installed by name below instead of with
    #   `mk-build-deps`, and `dpkg-buildpackage` gets `-d` to skip its own
    #   check. debian/control asks for a `yarn` package, which scale-build
    #   takes from the TrueNAS apt mirror and stock Debian does not have. The
    #   `yarn` the build really uses is the Corepack one either way.
    # - debian/changelog is not re-stamped with `dch`, so the package carries
    #   the placeholder version already in that file.
    container: debian:trixie
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # scale-build exports the release it is building; debian/rules writes it
      # into src/environments/release.ts.
      RELEASE_VERSION: CI
    steps:
      # git before checkout, so the checkout is a real clone; Yarn also needs
      # it for the one git dependency. debhelper brings dpkg-dev and make.
      - name: Install build prerequisites
        run: apt-get update && apt-get -y install --no-install-recommends ca-certificates debhelper git wget xz-utils
      - name: Checkout
        uses: actions/checkout@v4
      # The workspace belongs to the runner's user and the container runs as
      # root, so git refuses to read the repository ("dubious ownership").
      # Checkout only trusts it for its own step. Without this the build still
      # passes, but stamps the service worker version with `unknown` instead of
      # the commit hash.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Node the way scale-build does
        run: sh -ex debian/fetch_node.sh
      # The rest of scale-build's prebuildcmd. node_modules is handed to
      # debian/rules as a tarball because `dpkg-buildpackage` starts with
      # `debian/rules clean`, which deletes the directory.
      - name: Install packages
        run: |
          corepack enable
          yarn install --immutable --network-timeout 100000
          tar czf node_files.tgz node_modules/
          rm -rf node_modules
      - name: Build the Debian package
        run: dpkg-buildpackage -us -uc -b -d
      # dpkg-buildpackage writes the package next to the source directory.
      - name: Check the package contents
        run: |
          deb=$(ls ../truenas-webui_*_all.deb)
          dpkg-deb --info "$deb"
          for file in index.html sw.js assets/buildtime; do
            dpkg-deb --contents "$deb" | grep -q " ./usr/share/truenas/webui/$file\$" \
              || { echo "::error::$file is missing from $deb"; exit 1; }
          done

  # Build above runs on x64, so it only proves the linux-x64 checksum in
  # debian/fetch_node.sh. scale-build also builds on arm64; this runs just the
  # fetch there, so a stale or mistyped linux-arm64 checksum fails here too.
  fetch-node-arm64:
    name: Fetch Node (arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install prerequisites
        run: apt-get update && apt-get -y install --no-install-recommends ca-certificates wget xz-utils
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node the way scale-build does
        run: sh -ex debian/fetch_node.sh
      - name: Report Node version
        run: node --version

  lint:
    name: Validate code style
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
        with:
          cache-jest: 'true'
      - name: Generate default environment file
        run: yarn run check-env
      - name: Run linter
        run: yarn lint
      # Lives here rather than in Build: that job hands node_modules to the
      # Debian package build, which deletes it.
      - name: Check strict null checks
        run: yarn strict-null-checks
      # Migrations drop `data-test` attributes silently — six accepted tickets so far, each
      # found downstream rather than here. Checks that tn-table rows and clickable elements
      # stay addressable. See scripts/check-test-ids.ts.
      - name: Check test IDs
        run: yarn check-test-ids
      # The typed-API-client migration runs for months across hundreds of PRs. `yarn lint` pins the
      # areas that have finished (see migratedApiOverrides in eslint.config.mjs); this proves that
      # list still covers the repo, and prints what is left per area. See
      # scripts/check-api-migration.ts and docs/devs/typed-api-client.md.
      - name: Check API client migration
        run: yarn check-api-migration
      # `e2e/` is outside the root tsconfig's project — the Playwright runner is
      # Node-hosted and cannot share the Angular compiler options (see
      # e2e/tsconfig.json). Without this step nothing type-checks the suite.
      - name: Type-check the E2E suite
        run: yarn e2e:typecheck

  # Decides which runner the tests below go to. Shared with the Claude review
  # gate and with truenas-connect/ui, which needs the same answer for the same
  # reason. Reports as "check-ux-team / Check member access" — the job id stays
  # `check-ux-team` so the downstream `needs:` references are unchanged.
  check-ux-team:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iXsystems/ux-github-workflows/.github/workflows/check-member.yml@master

  test-ux-team:
    name: Run tests (UX Team - Self-hosted)
    needs: [install, check-ux-team]
    if: needs.check-ux-team.outputs.is_member == 'true'
    strategy:
      fail-fast: false
    # Named labels rather than a bare `self-hosted`, which matches whichever
    # registered runner happens to be free. More than one is registered, and
    # they are not interchangeable — this job wants the ARM builder.
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
        with:
          cache-jest: 'true'
      - name: Run tests
        run: yarn test:pr --maxWorkers=50
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
         name: coverage
         path: coverage/webui/coverage-final.json
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
         name: coverage-junit
         path: coverage/webui/junit.xml

  test:
    name: Run tests (Standard)
    needs: [install, check-ux-team]
    if: |
      always() &&
      needs.install.result == 'success' &&
      (github.event_name != 'pull_request' || needs.check-ux-team.outputs.is_member != 'true')
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
        with:
          cache-jest: 'true'
      - name: Run tests
        run: yarn test:pr --maxWorkers=2
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
         name: coverage
         path: coverage/webui/coverage-final.json
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
         name: coverage-junit
         path: coverage/webui/junit.xml

  report-coverage:
    name: Collect coverage
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.repository == 'truenas/webui' }}
    needs: [test, test-ux-team]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage and test data
        uses: actions/download-artifact@v4
        with:
          pattern: 'coverage*'
          path: coverage
          merge-multiple: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          name: webui
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: true
      - name: Upload extra test data to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/junit.xml
