name: WebUI
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'src/assets/i18n/**'
      - 'tests/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'src/assets/i18n/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  install:
    name: Checkout and Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Build
        run: yarn build:prod
      - name: Check strict null checks
        run: yarn run check-env && yarn run strict-null-checks

  lint:
    name: Validate changed code style
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        uses: ./.github/actions/prepare
      - name: Generate default environment file
        run: yarn run check-env
      - name: Run changed-file linters
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t eslint_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.ts' '*.js' '*.mjs' '*.html')
          mapfile -t stylelint_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.scss')
          if (( ${#eslint_files[@]} > 0 )); then
            node node_modules/eslint/bin/eslint.js "${eslint_files[@]}"
          fi
          if (( ${#stylelint_files[@]} > 0 )); then
            node node_modules/stylelint/bin/stylelint.mjs "${stylelint_files[@]}"
          fi

  baseline-lint:
    name: Baseline lint inventory (non-blocking)
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Generate default environment file
        run: yarn run check-env
      - name: Run baseline linter
        continue-on-error: true
        run: yarn lint

  harbor-assistant-gate:
    name: Harbor Assistant blocking tests
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Generate default environment file
        run: yarn run check-env
      - name: Run Harbor Assistant tests
        run: >-
          yarn test
          src/app/pages/harbor-assistant/camera/harbor-assistant-camera.component.spec.ts
          src/app/pages/harbor-assistant/camera/live-controls/harbor-assistant-live-controls.component.spec.ts
          src/app/pages/harbor-assistant/harbor-assistant.component.spec.ts
          src/app/pages/harbor-assistant/home-assistant/harbor-assistant-home-assistant.component.spec.ts
          src/app/pages/harbor-assistant/search/harbor-assistant-search.component.spec.ts
          src/app/pages/harbor-assistant/services/harbor-assistant-api.service.spec.ts
          src/app/pages/harbor-assistant/shared/harbor-assistant-content-api.service.spec.ts
          src/app/pages/harbor-assistant/shared/harbor-assistant-results.spec.ts
          src/app/pages/harbor-assistant/utils/harborgate-urls.spec.ts
          --runInBand
      - name: Check Harbor Assistant delivery contracts
        run: yarn check:harbor-assistant-i18n && yarn check:harbor-assistant-delivery

  harbornavi-package-contract:
    name: HarborNavi package contract
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Check package versions, dependencies, upgrade and rollback
        run: yarn check:harbornavi-k3-package

  check-ux-team:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/check-ux-team.yml

  test-ux-team:
    name: Run tests (UX Team - Self-hosted)
    needs: [install, check-ux-team]
    if: needs.check-ux-team.outputs.is_member == 'true' && github.repository == 'truenas/webui'
    strategy:
      fail-fast: false
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Run tests
        run: yarn test:pr --maxWorkers=50
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/webui/coverage-final.json
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-junit
          path: coverage/webui/junit.xml

  test:
    name: Baseline tests (non-blocking)
    needs: [install, check-ux-team]
    if: |
      always() &&
      needs.install.result == 'success' &&
      (github.repository != 'truenas/webui' ||
       github.event_name != 'pull_request' ||
       needs.check-ux-team.outputs.is_member != 'true')
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        uses: ./.github/actions/prepare
      - name: Run tests
        continue-on-error: true
        run: yarn test:pr --maxWorkers=2
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/webui/coverage-final.json
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-junit
          path: coverage/webui/junit.xml

  report-coverage:
    name: Collect coverage
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.repository == 'truenas/webui' }}
    needs: [test, test-ux-team]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage and test data
        uses: actions/download-artifact@v4
        with:
          pattern: 'coverage*'
          path: coverage
          merge-multiple: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          name: webui
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: true
      - name: Upload extra test data to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/junit.xml
