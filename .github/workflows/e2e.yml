# TrueNAS WebUI end-to-end suite.
#
# Each job runs on an ephemeral runner from a GARM pool on a TrueNAS box
# (iXsystems/github-truenas-runner). The pool attaches a copy-on-write clone
# of a prebuilt TrueNAS appliance image to the runner as a second disk, and
# the `truenas-appliance-runner` action in iXsystems/ux-github-workflows
# boots it under qemu, inside the runner: an appliance of the job's own,
# with its API on the runner's loopback. Picking the runner label is the
# claim; GARM deleting the runner when the job ends is the release, so
# there is nothing to release and nothing that can leak.
#
# So appliances are not shared: capacity is the pool's size, runs queue for
# a runner instead of for the lab, and sharding is a matrix, each shard a
# runner with its own appliance. The appliance is the newest nightly the
# box's image-sync has rolled out (truenas_appliance:nightly), not an ISO
# chosen here.
#
# ─── The `pull_request` trigger is same-repo only, and must stay that way ────
#
# `truenas/webui` is a PUBLIC repository and this job runs on a SELF-HOSTED
# runner that can reach the lab network. An unguarded `pull_request`
# trigger lets anyone on the internet open a fork PR and execute code on that
# machine — GitHub's own guidance is not to pair self-hosted runners with public
# repositories for this reason.
#
# The guard is the `if:` on the job below: the head repository must be this
# repository, so a fork PR queues nothing. Never use `pull_request_target` with
# a checkout of PR code, which would defeat it. The second line is the
# runner group: kept from public repositories, or approval required for
# every outside contributor (github-truenas-runner's docs/security.md).
# ─────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  # Nightly, against whatever master is that morning. This and the master
  # push below are the runs that test merged UI code; the suite drives the
  # UI built from the checkout, so a run on master is a run on master's code.
  schedule:
    - cron: '0 3 * * *'
  # Every merged change to the UI or the suite. Pull requests that change
  # the UI are the next step, once the pool's capacity is measured; until
  # then a PR that wants a run asks for one with `workflow_dispatch` on its
  # branch.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'package.json'
      - 'yarn.lock'
      # How the built UI is served here. A route missing from it is invisible
      # to every local profile — they serve the UI from the dev server or the
      # appliance — so this job is the only thing that can catch one.
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # Pull requests that change the suite or the pipeline itself.
  pull_request:
    paths:
      - 'e2e/**'
      # A documentation-only pull request should not take a runner.
      # Evaluated against every file the PR changes, not the latest push, so
      # this only helps PRs that touch nothing but docs.
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # The opt-in for any other branch: `gh workflow run e2e.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      grep:
        description: Optional Playwright --grep filter
        type: string
        default: ''
      ui:
        description: >-
          Which UI to test. `built` builds this checkout and serves it beside
          the appliance; `shipped` uses the UI baked into the appliance's ISO.
        type: choice
        default: built
        options: [built, shipped]
      shards:
        description: >-
          How many runners, each with its own appliance, to split the suite
          across (Playwright's --shard). One until sharding is measured.
        type: number
        default: 1

# Reads code, uploads artifacts, and reads the WebUI workflow's runs and
# artifacts for its build of the UI. No reason to write to the repository.
permissions:
  contents: read
  actions: read

# Runs share nothing, so a newer push to the same ref replaces an older run:
# cancelling one leaks nothing, its runner and appliance are deleted with it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Fork PRs stop here, and so everything after. See the header.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || 1 }}
        run: |
          echo "total=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    # A runner with a TrueNAS appliance disk attached: the GARM pool's extra
    # specs are {"disks": ["truenas_appliance:nightly"]}.
    runs-on: [self-hosted, truenas-appliance]
    # Bounded so that a hang gives the runner back in an hour and a half,
    # not GitHub's 360-minute default.
    timeout-minutes: 90
    env:
      # Serves the built UI. Debian-based on purpose: docker/nginx.conf runs
      # as `www-data`, which the alpine image does not have.
      NGINX_IMAGE: nginx:1.27

    steps:
      - uses: actions/checkout@v4

      # Same Node pin and install path as the test and lint jobs in main.yml, so
      # a failure here is the runner and not a difference in how the tree was
      # prepared. (The Build job there shares the pin but installs Node with
      # debian/fetch_node.sh.)
      - uses: ./.github/actions/prepare

      # The browser runs in Playwright's own image rather than on the runner:
      # it ships Chromium and every library it needs, and its tag must match
      # the installed @playwright/test exactly or Playwright refuses to launch,
      # so the tag is read from node_modules rather than written down twice.
      #
      # Checked before the appliance boots, so a runner without a usable
      # Docker fails here, early.
      - name: Resolve the Playwright image
        run: |
          set -euo pipefail
          # The runner user may or may not be allowed at the Docker socket
          # directly. `sudo -n` fails rather than prompting, because a prompt
          # here would hang the job for its full timeout with the lab held.
          if docker info > /dev/null 2>&1; then
            docker=docker
          elif sudo -n docker info > /dev/null 2>&1; then
            docker="sudo -n docker"
          else
            echo "::error::No usable Docker: neither 'docker' nor 'sudo -n docker' can reach the daemon"
            exit 1
          fi
          echo "DOCKER=$docker" >> "$GITHUB_ENV"
          version=$(node -p "require('@playwright/test/package.json').version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          $docker pull --quiet "$image"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"

      # The web server for the UI under test is a stock nginx image driven by
      # `docker/nginx.conf`, this repository's copy of the appliance's nginx
      # routing. A stand-in rather than the real thing: the deb ships only
      # `dist/`, so an appliance serves the UI through middleware's own
      # config, not this file. Pulled here for the same fail-early reason as
      # the Playwright image.
      - name: Pull nginx
        if: (inputs.ui || 'built') == 'built'
        run: $DOCKER pull --quiet "$NGINX_IMAGE"

      # Boots the appliance disk this runner's pool attached, under qemu,
      # inside the runner; gives the admin a password made for this job;
      # snapshots it as `fresh-install` (`truenas-appliance revert
      # fresh-install` gets back to it in seconds); and puts TN_PROFILE,
      # TN_HOST, TN_HOST_HTTP, TN_USERNAME, TN_PASSWORD, TN_DOMAIN and
      # TN_BASELINE in the job environment, as the lab's claim did. Its ports
      # are on the runner's loopback and Docker's bridge, nowhere else.
      - name: Boot the appliance
        uses: iXsystems/ux-github-workflows/.github/actions/truenas-appliance-runner@master
        with:
          baseline: fresh-install

      # A non-HA Enterprise license, so the journeys behind an entitlement
      # (ZFS tiering, S3 audit and versioning) run here rather than skip.
      # Fetched fresh every run from MES's renew endpoint, the way
      # api-ci-testbed's fetch_license.sh does: renewing re-signs the CI
      # license with a current `issued_at`, and middleware caps a test
      # license's life from that stamp, so a committed copy would go stale.
      #
      # Uploaded from here rather than from the suite so the PEM never
      # reaches a Playwright trace, which this public repository publishes.
      # It is never echoed either; `truenas-appliance call` sends its params
      # without logging them.
      #
      # The boot took the baseline before the license existed, so it is
      # taken again over the same name (savevm replaces a snapshot of that
      # name): a revert must not quietly drop the license.
      #
      # The endpoint is internal, and this repository is public, so its
      # address is the `E2E_LICENSE_URL` secret rather than written here:
      # Actions masks it in the log, curl's own errors included.
      - name: License the appliance
        env:
          LICENSE_URL: ${{ secrets.E2E_LICENSE_URL }}
        run: |
          set -euo pipefail
          [ -n "$LICENSE_URL" ] || { echo "::error::The E2E_LICENSE_URL secret is not set"; exit 1; }
          pem=$(curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 30 \
            -X POST "$LICENSE_URL" \
            -H 'Content-Type: application/json' -d '{"serial":"CI-SINGLE"}' \
            | jq -r '.license // empty')
          grep -q -- '-----BEGIN TRUENAS LICENSE-----' <<< "$pem" \
            || { echo "::error::MES did not return a license for CI-SINGLE"; exit 1; }
          truenas-appliance call truenas.license.upload "$(jq -Rs . <<< "$pem")" > /dev/null
          # The EULA dialog only shows on TrueNAS hardware, which this is
          # not, but the upload leaves it pending; accepting it costs nothing.
          truenas-appliance call truenas.accept_eula > /dev/null
          echo "Entitlements now granted:"
          truenas-appliance call truenas.entitlements.info \
            | jq -r '.features | to_entries[] | "  \(.key): \(.value.entitled)"'
          if [ "${TN_BASELINE:-none}" != none ]; then
            truenas-appliance snapshot "$TN_BASELINE"
          fi

      # The UI under test is this checkout's, not the one baked into the
      # appliance's ISO. main.yml's Build job already builds it, as the
      # Debian package that ships, and uploads it as `webui-dist`; this finds
      # that WebUI run by commit and waits for the upload. Looked for only
      # now, after the boot, so its build and this job's boot overlap.
      #
      # Only a run that built the tree this job checked out counts: for a
      # pull request, the WebUI run of the same head commit, which built
      # the same merge commit; otherwise the push run of this commit, so a
      # dispatch on master or the nightly finds master's. A dispatch on any
      # other branch has none and builds below. So does a WebUI run that
      # finished without the artifact, or one still going after ten minutes.
      # Each falls back to building rather than failing the job.
      #
      # The newest such run is taken. For a pull request that is the one that
      # built this checkout's merge commit, except in one rare case: a re-run
      # of an older attempt after master moved and a newer WebUI run of the
      # same head commit built a newer merge.
      - name: Find the WebUI build
        id: shipped-build
        if: (inputs.ui || 'built') == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The PR's branch, or the pushed one: a run of the same commit from
          # another PR (a fork's, or one to another base) built another tree.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          event=push
          [ "$GITHUB_EVENT_NAME" = pull_request ] && event=pull_request
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          get() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          deadline=$((SECONDS + 600))
          while :; do
            # A failed query (a 5xx, the token's rate limit) falls back to
            # building rather than failing the job.
            if ! runs=$(get "$api/workflows/main.yml/runs?head_sha=$SHA&event=$event&branch=$BRANCH&per_page=10"); then
              echo "::notice::Could not query the WebUI runs; building the UI here"
              exit 0
            fi
            run=$(jq -c --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] | select(.head_repository.full_name == $repo)][0] // empty' <<< "$runs")
            if [ -z "$run" ]; then
              echo "No WebUI $event run of $SHA; building the UI here"
              exit 0
            fi
            id=$(jq -r .id <<< "$run")
            # The list keeps an artifact past its retention, marked expired,
            # and download-artifact cannot fetch that one.
            if get "$api/runs/$id/artifacts?name=webui-dist" | jq -e '[.artifacts[] | select(.expired | not)] | length > 0' > /dev/null; then
              echo "run-id=$id" >> "$GITHUB_OUTPUT"
              echo "Using the UI WebUI run $id built, $(jq -r .html_url <<< "$run"), after waiting ${SECONDS}s"
              exit 0
            fi
            if [ "$(jq -r .status <<< "$run")" = completed ]; then
              echo "::notice::WebUI run $id finished with no webui-dist to download (failed, or expired); building the UI here"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::notice::WebUI run $id has not uploaded webui-dist after 10 minutes; building the UI here"
              exit 0
            fi
            # Two calls a round, on the token's 1,000 requests an hour that
            # every workflow in the repository shares.
            sleep 20
          done

      - name: Download the WebUI build
        if: steps.shipped-build.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: ${{ runner.temp }}/webui-dist
          run-id: ${{ steps.shipped-build.outputs.run-id }}
          github-token: ${{ github.token }}

      # Same production build as main.yml's Build job — `--base-href /ui/`,
      # so it is served where the appliance's nginx would serve it — for
      # when there is no WebUI build to reuse. After the boot, so its memory
      # and the 6GB guest's are in use at once; only on that fallback.
      - name: Build the UI
        if: (inputs.ui || 'built') == 'built'
        env:
          DOWNLOADED: ${{ steps.shipped-build.outputs.run-id != '' && format('{0}/webui-dist', runner.temp) || '' }}
        run: |
          set -euo pipefail
          if [ -n "$DOWNLOADED" ]; then
            dist="$DOWNLOADED"
          else
            yarn build:prod
            dist="$GITHUB_WORKSPACE/dist"
          fi
          [ -f "$dist/index.html" ] || { echo "::error::$dist has no index.html"; exit 1; }
          echo "UI_DIST=$dist" >> "$GITHUB_ENV"

      # nginx serves the build at /ui/ and proxies /api, /_upload, /_download
      # and the WebSocket to the appliance over plain HTTP, which is the
      # routing `docker/nginx.conf` describes. The sed fills its two
      # placeholders — `%%HOSTNAME%%` with the appliance's forwarded port,
      # `%%VERTAG%%` with a timestamp to bust the UI cache — and redirects the
      # syslog targets, which a container has no socket for. The
      # upstream is the appliance's forwarded port 80, reached from the
      # container's bridge network through Docker's host gateway, which the
      # appliance's forwards listen on as well as on loopback.
      #
      # Served over TLS with a throwaway self-signed certificate, and it has
      # to be: a production build ignores the login token on a plain-HTTP
      # origin (`AuthService.setQueryToken`), so over http the suite's setup
      # project would wait on a sign-in page that never moves. The suite then
      # runs as the `shipped` profile with `TN_UI_BASE_URL` overriding the
      # address, which is what makes it tolerate a self-signed certificate —
      # and is accurate: this is the production build at /ui/ over https,
      # served the way the appliance serves it, just from a different box.
      #
      # Published on an ephemeral loopback port so a leftover container from a
      # crashed run cannot hold the address, and named after the run so the
      # teardown step can find it without state.
      - name: Serve the UI
        if: env.UI_DIST != ''
        run: |
          set -euo pipefail
          name="e2e-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          conf="$RUNNER_TEMP/nginx.conf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/e2e-ui.key" -out "$RUNNER_TEMP/e2e-ui.crt" > /dev/null 2>&1
          sed \
            -e "s|%%HOSTNAME%%|host.docker.internal:${TN_HOST_HTTP#*:}|g" \
            -e "s|%%VERTAG%%|$(date +%s)|g" \
            -e "s|^\([[:space:]]*error_log\) .*|\1 /dev/stderr;|" \
            -e "s|^\([[:space:]]*access_log\) .*|\1 off;|" \
            -e "s|^\([[:space:]]*\)listen[[:space:]]*0\.0\.0\.0:80;|\1listen 0.0.0.0:80;\n\1listen 0.0.0.0:443 ssl; ssl_certificate /etc/nginx/e2e-ui.crt; ssl_certificate_key /etc/nginx/e2e-ui.key;|" \
            -e "/listen[[:space:]]*\[::\]:80;/d" \
            -e "/error_page[[:space:]]*500 502 503 504/d" \
            docker/nginx.conf > "$conf"
          grep -q "listen 0.0.0.0:443 ssl" "$conf" || { echo "::error::docker/nginx.conf no longer has the listen line this step rewrites"; exit 1; }
          # The cleartext listener is what lets the insecure-connection test run
          # here rather than skip: the warning is decided from the scheme the
          # page was loaded with, so it needs an origin that is really http.
          grep -q "listen 0.0.0.0:80;" "$conf" || { echo "::error::the cleartext listener was not kept alongside the TLS one"; exit 1; }
          $DOCKER run -d --rm --name "$name" \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1::443 \
            -p 127.0.0.1::80 \
            -v "$UI_DIST:/var/www/webui:ro" \
            -v "$conf:/etc/nginx/tn-nginx.conf:ro" \
            -v "$RUNNER_TEMP/e2e-ui.crt:/etc/nginx/e2e-ui.crt:ro" \
            -v "$RUNNER_TEMP/e2e-ui.key:/etc/nginx/e2e-ui.key:ro" \
            "$NGINX_IMAGE" nginx -c /etc/nginx/tn-nginx.conf > /dev/null
          port=$($DOCKER port "$name" 443/tcp | head -1 | sed 's/.*://')
          [ -n "$port" ] || { echo "::error::The UI container published no port"; exit 1; }
          url="https://localhost:${port}/ui/"
          httpPort=$($DOCKER port "$name" 80/tcp | head -1 | sed 's/.*://')
          [ -n "$httpPort" ] || { echo "::error::The UI container published no cleartext port"; exit 1; }
          httpUrl="http://localhost:${httpPort}/ui/"
          # Fail here, not four steps later inside a test, if the UI or its
          # proxy to the appliance is not answering. The proxy check asks for
          # the WebSocket endpoint over plain GET. A 5xx is nginx unable to
          # reach the appliance — the sed above removes the inherited
          # `error_page` handler, whose 50x page does not exist in this image
          # and would otherwise turn that 502 into a 404. A 404 is excluded
          # too, since nginx can produce one on its own; anything else in
          # 1xx–4xx had to come from the appliance.
          ready=
          for i in $(seq 1 30); do
            ui=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || true)
            proxy=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:${port}/api/current" || true)
            uiHttp=$(curl -s -o /dev/null -w '%{http_code}' "$httpUrl" || true)
            if [ "$ui" = 200 ] && [ "$uiHttp" = 200 ] && [[ "$proxy" =~ ^[1-4] ]] && [ "$proxy" != 404 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::UI container is not serving at ${url} (ui=${ui:-none}, uiHttp=${uiHttp:-none}, proxy=${proxy:-none})"
            $DOCKER logs "$name" || true
            exit 1
          fi
          echo "TN_UI_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "TN_UI_BASE_URL_HTTP=$httpUrl" >> "$GITHUB_ENV"
          echo "Serving the built UI at $url and $httpUrl (proxy check answered $proxy), proxying to the appliance at $TN_HOST_HTTP"

      - name: Run the suite
        id: suite
        env:
          CI: 'true'
          # Passed as an environment variable, never interpolated into the shell
          # line: `${{ inputs.grep }}` there would be executed as code, on a
          # runner with hypervisor access.
          TN_GREP: ${{ inputs.grep }}
        # Only the test run is containerised; the appliance stays on the
        # runner, under qemu.
        #
        # --network host: the container reaches the appliance exactly as the
        #   host does, no port mapping and no Docker DNS in the way.
        # --ipc host: what Playwright's own docs ask for with Chromium, which
        #   otherwise runs out of shared memory and crashes mid-test.
        # -u: run as the runner user so everything written under test-results
        #   is owned by it rather than by root. HOME is set because that uid has
        #   no home inside the image.
        # The host's node_modules is reused: it is pure JavaScript apart from
        # the browsers, and the image already has those at its default path.
        #
        # Variables go through --env-file, not `-e NAME=value`. $DOCKER may be
        # `sudo -n docker`: sudo scrubs the environment, so `-e NAME` pass-
        # through is empty, and a value on the command line lands in sudo's
        # own log line and in /proc/<pid>/cmdline for the life of the
        # container. The file is read by the docker client after sudo has
        # exec'd it, lives on the runner's own dataset, and is removed after.
        run: |
          set -euo pipefail
          # TN_GREP is the one value here that comes from outside the pipeline,
          # and the env file is parsed line by line: a newline in it would end
          # the filter early and let the rest set arbitrary variables in the
          # container. Refuse rather than truncate, so a bad dispatch is loud.
          case "${TN_GREP:-}" in
            *$'\n'*|*$'\r'*) echo "::error::The grep input must be a single line"; exit 1 ;;
          esac
          envFile="$RUNNER_TEMP/suite.env"
          trap 'rm -f "$envFile"' EXIT
          printf '%s\n' \
            "CI=$CI" \
            "TN_GREP=${TN_GREP:-}" \
            "TN_PROFILE=$TN_PROFILE" \
            "TN_UI_BASE_URL=${TN_UI_BASE_URL:-}" \
            "TN_UI_BASE_URL_HTTP=${TN_UI_BASE_URL_HTTP:-}" \
            "TN_HOST=$TN_HOST" \
            "TN_USERNAME=$TN_USERNAME" \
            "TN_PASSWORD=$TN_PASSWORD" \
            "TN_DOMAIN=$TN_DOMAIN" \
            "TN_BASELINE=$TN_BASELINE" \
            "TN_SHARD=${{ matrix.shard }}/${{ needs.plan.outputs.total }}" \
            > "$envFile"
          $DOCKER run --rm \
            --network host \
            --ipc host \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            --env-file "$envFile" \
            "$PLAYWRIGHT_IMAGE" \
            bash -c 'if [ -n "${TN_GREP:-}" ]; then ./node_modules/.bin/playwright test --shard "$TN_SHARD" --grep "$TN_GREP"; else ./node_modules/.bin/playwright test --shard "$TN_SHARD"; fi'

      # The appliance's serial console, when anything failed: boot messages,
      # middleware's crashes, panics. Middleware's own logs (R7.2) can come
      # over ssh next (`ssh: true` on the action), now the job owns qemu.
      - name: The appliance's console
        if: failure()
        run: truenas-appliance console 300 || true

      #
      # Runs whenever the suite ran, pass or fail, and then insists on the
      # file: JUnit is the run history R7.4 and R8.4 are built on, so a run
      # that produced none must not report green. The only honest no-file
      # case is the suite never starting, which is the `skipped` outcome.
      - name: Upload JUnit results
        if: always() && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-${{ matrix.shard }}
          path: test-results/junit.xml
          if-no-files-found: error
          retention-days: 14

      # Traces, screenshots and video for the tests that failed (R7.1). These
      # are what make a failure triageable without a local reproduction
      # (R6.2): the trace holds a DOM snapshot per step, the network, and the
      # console.
      #
      # Artifacts on a public repository are downloadable by anyone, and a
      # trace records action parameters verbatim — including the appliance
      # password `signIn` types and the login token in the setup project's
      # URL. Publishing them is safe because both are worthless by the time
      # anyone can download this: the password is generated per job, the
      # token expires, and the appliance they belonged to is deleted with its
      # runner when the job ends. Do not upload these from a pipeline that reuses an
      # appliance or a credential.
      #
      # Whenever the suite ran, not only when it failed. Playwright keeps a
      # trace on the first retry (playwright.config.ts), and a test that fails
      # once and passes on the retry — the flake R8.4's quarantine policy is
      # built on triaging — leaves the step green with exactly that trace on
      # disk. A clean run has nothing here, and `ignore` is the truthful
      # setting for that.
      - name: Upload failure traces
        if: always() && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-traces-${{ matrix.shard }}
          path: |
            test-results/**
            !test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      # A leftover UI container would go on proxying to a destroyed appliance
      # and sit on the daemon forever. `--rm` covers a clean exit; this covers
      # the rest, including a container that started but never passed the
      # readiness gate. Stateless on purpose: the name is derived, not read
      # from something the serve step may have died before writing.
      - name: Stop the UI
        if: always() && env.DOCKER != ''
        run: $DOCKER rm -f "e2e-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /dev/null 2>&1 || true

      # No release step: the appliance is deleted with the runner, on success,
      # failure and cancellation alike.
