# TrueNAS WebUI end-to-end suite.
#
# Each job runs on an ephemeral runner from a GARM pool on a TrueNAS box
# (iXsystems/github-truenas-runner). The pool attaches a copy-on-write clone
# of a prebuilt TrueNAS appliance image to the runner as a second disk, and
# the `truenas-appliance-runner` action in iXsystems/ux-github-workflows
# boots it under qemu, inside the runner: an appliance of the job's own,
# with its API on the runner's loopback. Picking the runner label is the
# claim; GARM deleting the runner when the job ends is the release, so
# there is nothing to release and nothing that can leak.
#
# So appliances are not shared: capacity is the pool's size, runs queue for
# a runner instead of for the lab, and sharding is a matrix, each shard a
# runner with its own appliance. The appliance is the newest nightly the
# box's image-sync has rolled out (truenas_appliance:nightly), not an ISO
# chosen here.
#
# ─── The `pull_request` trigger is same-repo only, and must stay that way ────
#
# `truenas/webui` is a PUBLIC repository and this job runs on a SELF-HOSTED
# runner that can reach the lab network. An unguarded `pull_request`
# trigger lets anyone on the internet open a fork PR and execute code on that
# machine — GitHub's own guidance is not to pair self-hosted runners with public
# repositories for this reason.
#
# The guard is the `if:` on the job below: the head repository must be this
# repository, so a fork PR queues nothing. Never use `pull_request_target` with
# a checkout of PR code, which would defeat it. The second line is the
# runner group: kept from public repositories, or approval required for
# every outside contributor (github-truenas-runner's docs/security.md).
# ─────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  # Nightly, against whatever master is that morning. This and the master
  # push below are the runs that test merged UI code; the suite drives the
  # UI built from the checkout, so a run on master is a run on master's code.
  schedule:
    - cron: '0 3 * * *'
  # Every merged change to the UI or the suite. Pull requests that change
  # the UI are the next step, once the pool's capacity is measured; until
  # then a PR that wants a run asks for one with `workflow_dispatch` on its
  # branch.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'package.json'
      - 'yarn.lock'
      # How the built UI is served here. A route missing from it is invisible
      # to every local profile — they serve the UI from the dev server or the
      # appliance — so this job is the only thing that can catch one.
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # Pull requests that change the suite or the pipeline itself.
  pull_request:
    paths:
      - 'e2e/**'
      # A documentation-only pull request should not take a runner.
      # Evaluated against every file the PR changes, not the latest push, so
      # this only helps PRs that touch nothing but docs.
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # The opt-in for any other branch: `gh workflow run e2e.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      grep:
        description: Optional Playwright --grep filter
        type: string
        default: ''
      ui:
        description: >-
          Which UI to test. `built` builds this checkout and serves it beside
          the appliance; `shipped` uses the UI baked into the appliance's ISO.
        type: choice
        default: built
        options: [built, shipped]
      shards:
        description: >-
          How many runners, each with its own appliance, to split the suite
          across (Playwright's --shard). One until sharding is measured.
        type: number
        default: 1

# Reads code, uploads artifacts, and reads the WebUI workflow's runs and
# artifacts for its build of the UI. No reason to write to the repository.
permissions:
  contents: read
  actions: read

# Runs share nothing, so a newer push to the same ref replaces an older run:
# cancelling one leaks nothing, its runner and appliance are deleted with it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Fork PRs stop here, and so everything after. See the header.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || 1 }}
        run: |
          echo "total=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    # A runner with a TrueNAS appliance disk attached: the GARM pool's extra
    # specs are {"disks": ["truenas_appliance:nightly"]}.
    runs-on: [self-hosted, truenas-appliance]
    # Bounded so that a hang gives the runner back in an hour and a half,
    # not GitHub's 360-minute default.
    timeout-minutes: 90

    # The steps e2e-ha.yml shares are the e2e-* and webui-dist actions under
    # .github/actions; what is here is what only this job does.
    steps:
      - uses: actions/checkout@v4

      # Same Node pin and install path as the test and lint jobs in main.yml, so
      # a failure here is the runner and not a difference in how the tree was
      # prepared. (The Build job there shares the pin but installs Node with
      # debian/fetch_node.sh.)
      - uses: ./.github/actions/prepare

      # Before the appliance boots, so a runner without a usable Docker fails
      # early. nginx only when this job serves the UI itself.
      - uses: ./.github/actions/e2e-browser
        with:
          nginx: ${{ (inputs.ui || 'built') == 'built' }}

      # Boots the appliance disk this runner's pool attached, under qemu,
      # inside the runner; gives the admin a password made for this job;
      # snapshots it as `fresh-install` (`truenas-appliance revert
      # fresh-install` gets back to it in seconds); and puts TN_PROFILE,
      # TN_HOST, TN_HOST_HTTP, TN_USERNAME, TN_PASSWORD, TN_DOMAIN and
      # TN_BASELINE in the job environment, as the lab's claim did. Its ports
      # are on the runner's loopback and Docker's bridge, nowhere else.
      - name: Boot the appliance
        uses: iXsystems/ux-github-workflows/.github/actions/truenas-appliance-runner@master
        with:
          baseline: fresh-install

      # A non-HA Enterprise license, so the journeys behind an entitlement
      # (ZFS tiering, S3 audit and versioning) run here rather than skip.
      # Fetched fresh every run from MES's renew endpoint, the way
      # api-ci-testbed's fetch_license.sh does: renewing re-signs the CI
      # license with a current `issued_at`, and middleware caps a test
      # license's life from that stamp, so a committed copy would go stale.
      #
      # Uploaded from here rather than from the suite so the PEM never
      # reaches a Playwright trace, which this public repository publishes.
      # It is never echoed either; `truenas-appliance call` sends its params
      # without logging them.
      #
      # The boot took the baseline before the license existed, so it is
      # taken again over the same name (savevm replaces a snapshot of that
      # name): a revert must not quietly drop the license.
      #
      # The endpoint is internal, and this repository is public, so its
      # address is the `E2E_LICENSE_URL` secret rather than written here:
      # Actions masks it in the log, curl's own errors included.
      - name: License the appliance
        env:
          LICENSE_URL: ${{ secrets.E2E_LICENSE_URL }}
        run: |
          set -euo pipefail
          [ -n "$LICENSE_URL" ] || { echo "::error::The E2E_LICENSE_URL secret is not set"; exit 1; }
          pem=$(curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 30 \
            -X POST "$LICENSE_URL" \
            -H 'Content-Type: application/json' -d '{"serial":"CI-SINGLE"}' \
            | jq -r '.license // empty')
          grep -q -- '-----BEGIN TRUENAS LICENSE-----' <<< "$pem" \
            || { echo "::error::MES did not return a license for CI-SINGLE"; exit 1; }
          truenas-appliance call truenas.license.upload "$(jq -Rs . <<< "$pem")" > /dev/null
          # The EULA dialog only shows on TrueNAS hardware, which this is
          # not, but the upload leaves it pending; accepting it costs nothing.
          truenas-appliance call truenas.accept_eula > /dev/null
          echo "Entitlements now granted:"
          truenas-appliance call truenas.entitlements.info \
            | jq -r '.features | to_entries[] | "  \(.key): \(.value.entitled)"'
          if [ "${TN_BASELINE:-none}" != none ]; then
            truenas-appliance snapshot "$TN_BASELINE"
          fi

      # After the boot, so main.yml's build and this job's boot overlap.
      - if: (inputs.ui || 'built') == 'built'
        uses: ./.github/actions/webui-dist

      # Proxying to the appliance's forwarded port 80 on loopback.
      - id: ui
        if: (inputs.ui || 'built') == 'built'
        uses: ./.github/actions/e2e-serve-ui
        with:
          upstream: ${{ env.TN_HOST_HTTP }}

      # As the `shipped` profile with TN_UI_BASE_URL pointing at the served
      # UI: it *is* the production build at /ui/ over https, just not from
      # the appliance, and that profile is the one that tolerates a
      # self-signed certificate. With `ui: shipped` there is no override,
      # and the suite derives the appliance's own /ui/ from TN_HOST.
      - name: Run the suite
        uses: ./.github/actions/e2e-run
        env:
          TN_UI_BASE_URL: ${{ steps.ui.outputs.url }}
          TN_UI_BASE_URL_HTTP: ${{ steps.ui.outputs.http-url }}
        with:
          shard: ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
          grep: ${{ inputs.grep }}
          artifact-suffix: -${{ matrix.shard }}

      # The appliance's serial console, when anything failed: boot messages,
      # middleware's crashes, panics. Middleware's own logs (R7.2) can come
      # over ssh next (`ssh: true` on the action), now the job owns qemu.
      - name: The appliance's console
        if: failure()
        run: truenas-appliance console 300 || true

      # A leftover UI container would go on proxying to a destroyed appliance
      # and sit on the daemon forever. `--rm` covers a clean exit; this covers
      # the rest, including a container that started but never passed the
      # readiness gate. Found by the name e2e-serve-ui gives it, not by state
      # a failed step may never have written.
      - name: Stop the UI
        if: always() && env.DOCKER != ''
        run: $DOCKER ps -aq --filter "name=e2e-ui-${GITHUB_RUN_ID}-" | xargs -r $DOCKER rm -f > /dev/null 2>&1 || true

      # No release step: the appliance is deleted with the runner, on success,
      # failure and cancellation alike.
