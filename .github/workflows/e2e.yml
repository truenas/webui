# TrueNAS WebUI end-to-end suite.
#
# Each job runs on an ephemeral runner from a GARM pool on a TrueNAS box
# (iXsystems/github-truenas-runner). The pool attaches a copy-on-write clone
# of a prebuilt TrueNAS appliance image to the runner as a second disk, and
# the `truenas-appliance-runner` action in iXsystems/ux-github-workflows
# boots it under qemu, inside the runner: an appliance of the job's own,
# with its API on the runner's loopback. Picking the runner label is the
# claim; GARM deleting the runner when the job ends is the release, so
# there is nothing to release and nothing that can leak.
#
# So appliances are not shared: capacity is the pool's size, runs queue for
# a runner instead of for the lab, and sharding is a matrix, each shard a
# runner with its own appliance. The appliance is the newest nightly the
# box's image-sync has rolled out (truenas_appliance:nightly), not an ISO
# chosen here.
#
# ─── The `pull_request` trigger is same-repo only, and must stay that way ────
#
# `truenas/webui` is a PUBLIC repository and this job runs on a SELF-HOSTED
# runner that can reach the lab network. An unguarded `pull_request`
# trigger lets anyone on the internet open a fork PR and execute code on that
# machine — GitHub's own guidance is not to pair self-hosted runners with public
# repositories for this reason.
#
# The guard is the `if:` on the job below: the head repository must be this
# repository, so a fork PR queues nothing. Never use `pull_request_target` with
# a checkout of PR code, which would defeat it. The second line is the
# runner group: kept from public repositories, or approval required for
# every outside contributor (github-truenas-runner's docs/security.md).
# ─────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  # Nightly, against whatever master is that morning. This and the master
  # push below are the runs that test merged UI code; the suite drives the
  # UI built from the checkout, so a run on master is a run on master's code.
  schedule:
    - cron: '0 3 * * *'
  # Every merged change to the UI or the suite. Pull requests that change
  # the UI are the next step, once the pool's capacity is measured; until
  # then a PR that wants a run asks for one with `workflow_dispatch` on its
  # branch.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'package.json'
      - 'yarn.lock'
      # How the built UI is served here. A route missing from it is invisible
      # to every local profile — they serve the UI from the dev server or the
      # appliance — so this job is the only thing that can catch one.
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # Pull requests that change the suite or the pipeline itself.
  pull_request:
    paths:
      - 'e2e/**'
      # A documentation-only pull request should not take a runner.
      # Evaluated against every file the PR changes, not the latest push, so
      # this only helps PRs that touch nothing but docs.
      - '!e2e/docs/**'
      - '!e2e/CLAUDE.md'
      - '!e2e/README.md'
      - 'playwright.config.ts'
      - 'docker/nginx.conf'
      - '.github/workflows/e2e.yml'
  # The opt-in for any other branch: `gh workflow run e2e.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      grep:
        description: Optional Playwright --grep filter
        type: string
        default: ''
      ui:
        description: >-
          Which UI to test. `built` builds this checkout and serves it beside
          the appliance; `shipped` uses the UI baked into the appliance's ISO.
        type: choice
        default: built
        options: [built, shipped]
      shards:
        description: >-
          How many runners, each with its own appliance, to split the suite
          across (Playwright's --shard). Two by default, on every run.
        type: number
        default: 2

# Reads code, uploads artifacts, and reads the WebUI workflow's runs and
# artifacts for its build of the UI. No reason to write to the repository.
permissions:
  contents: read
  actions: read

# Runs share nothing, so a newer push to the same ref replaces an older run:
# cancelling one leaks nothing, its runner and appliance are deleted with it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Fork PRs stop here, and so everything after. See the header.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || 2 }}
        run: |
          echo "total=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    # A runner with a TrueNAS appliance disk attached: the GARM pool's extra
    # specs are {"disks": ["truenas_appliance:nightly"]}.
    runs-on: [self-hosted, truenas-appliance]
    # Bounded so that a hang gives the runner back in two hours, not GitHub's
    # 360-minute default. It was 90 until the one-shard suite outgrew it: from
    # 2026-10-20 a master run took 91 minutes and was cancelled after its last
    # test, with no report. Two shards since; when a green shard nears this
    # again, add a shard rather than raise it.
    timeout-minutes: 120

    # The steps e2e-ha.yml shares are the e2e-* and webui-dist actions under
    # .github/actions; what is here is what only this job does.
    steps:
      - uses: actions/checkout@v4

      # Same Node pin and install path as the test and lint jobs in main.yml, so
      # a failure here is the runner and not a difference in how the tree was
      # prepared. (The Build job there shares the pin but installs Node with
      # debian/fetch_node.sh.)
      - uses: ./.github/actions/prepare

      # Before the appliance boots, so a runner without a usable Docker fails
      # early. nginx only when this job serves the UI itself. The pulls, and
      # finding and downloading the built UI, run in the background during
      # the boot: one after the other they added a minute and a half to
      # three minutes to every shard. Each is waited for where it is needed.
      - uses: ./.github/actions/e2e-browser
        with:
          nginx: ${{ (inputs.ui || 'built') == 'built' }}
          start: true
      - if: (inputs.ui || 'built') == 'built'
        uses: ./.github/actions/webui-dist
        with:
          start: true

      # Boots the appliance disk this runner's pool attached, under qemu,
      # inside the runner; gives the admin a password made for this job;
      # snapshots it as `fresh-install` (`truenas-appliance revert
      # fresh-install` gets back to it in seconds); and puts TN_PROFILE,
      # TN_HOST, TN_HOST_HTTP, TN_USERNAME, TN_PASSWORD, TN_DOMAIN and
      # TN_BASELINE in the job environment, as the lab's claim did. Its ports
      # are on the runner's loopback and Docker's bridge, nowhere else.
      #
      # 8GB rather than the action's 6GB default: choosing an Apps pool makes
      # middleware clone the whole apps catalog into the tmpfs at /run, which
      # is sized from RAM. At 6GB that fills /run, and dockerd then cannot
      # write its pid file (#14633). The HA nodes boot with the same 8GB.
      #
      # One 32GB disk beside the ten 10GB data disks, for boot-pool.e2e.ts to
      # mirror the boot pool onto: boot.attach needs a disk at least as large as
      # the boot disk, and the boot partition alone is about 15.5GB (#14710).
      # Sparse, and after the data disks, so the specs that take unused disks of
      # one size still get 10GB ones.
      #
      # One spare NIC, alone on a qemu hub with nothing on the other end, for
      # the specs that commit interface changes without touching the NIC the
      # suite reaches the appliance on (#14537). Its MAC is in TN_SPARE_NICS.
      - name: Boot the appliance
        uses: iXsystems/ux-github-workflows/.github/actions/truenas-appliance-runner@master
        with:
          baseline: fresh-install
          memory-mb: 8192
          extra-disk-gb: '32'
          spare-nics: 1

      # A non-HA Enterprise license, so the journeys behind an entitlement
      # (ZFS tiering, S3 audit and versioning) run here rather than skip.
      # Uploaded from here rather than from the suite so the PEM never
      # reaches a Playwright trace, which this public repository publishes.
      # It is never echoed either; `truenas-appliance call` sends its params
      # without logging them.
      #
      # The boot took the baseline before the license existed, so it is
      # taken again over the same name (savevm replaces a snapshot of that
      # name): a revert must not quietly drop the license.
      - id: license
        uses: ./.github/actions/fetch-license
        with:
          url: ${{ secrets.E2E_LICENSE_URL }}
          serial: CI-SINGLE
      - name: License the appliance
        env:
          LICENSE_FILE: ${{ steps.license.outputs.file }}
        run: |
          set -euo pipefail
          truenas-appliance call truenas.license.upload "$(jq -Rs . < "$LICENSE_FILE")" > /dev/null
          # The EULA dialog only shows on TrueNAS hardware, which this is
          # not, but the upload leaves it pending; accepting it costs nothing.
          truenas-appliance call truenas.accept_eula > /dev/null
          echo "Entitlements now granted:"
          truenas-appliance call truenas.entitlements.info \
            | jq -r '.features | to_entries[] | "  \(.key): \(.value.entitled)"'
          if [ "${TN_BASELINE:-none}" != none ]; then
            truenas-appliance snapshot "$TN_BASELINE"
          fi

      # Waits for the download started before the boot, and builds the UI
      # here only now, when it found none, so the build never runs while the
      # appliance boots.
      - if: (inputs.ui || 'built') == 'built'
        uses: ./.github/actions/webui-dist

      # The images, before e2e-serve-ui and the suite use them.
      - uses: ./.github/actions/e2e-browser

      # Proxying to the appliance's forwarded port 80 on loopback.
      - id: ui
        if: (inputs.ui || 'built') == 'built'
        uses: ./.github/actions/e2e-serve-ui
        with:
          upstream: ${{ env.TN_HOST_HTTP }}

      # Whether the runner reaches the Active Directory test domain's
      # controllers, for `directory-services-ad`. The appliance is behind
      # qemu's user-mode NAT, so it reaches what the runner reaches; a closed
      # port here is the reason a join fails, said before the suite rather
      # than as a timeout inside it. A warning, not a failure: only those
      # tests need the domain. Skipped when the secrets are not there.
      - name: Check the domain controllers are reachable
        env:
          TN_AD_DC1: ${{ secrets.E2EUI_AD_DC1 }}
          TN_AD_DC2: ${{ secrets.E2EUI_AD_DC2 }}
        run: |
          if [ -z "$TN_AD_DC1" ]; then
            echo "No E2EUI_AD_DC1 secret: the Active Directory tests will skip."
            exit 0
          fi
          # DNS, Kerberos, LDAP, SMB and kpasswd: what a join and a leave use.
          for dc in "$TN_AD_DC1" ${TN_AD_DC2:+"$TN_AD_DC2"}; do
            for port in 53 88 389 445 464; do
              if ! timeout 5 bash -c ">/dev/tcp/$dc/$port" 2> /dev/null; then
                echo "::warning::A domain controller does not answer on TCP $port; the Active Directory tests will fail"
              fi
            done
          done

      # As the `shipped` profile with TN_UI_BASE_URL pointing at the served
      # UI: it *is* the production build at /ui/ over https, just not from
      # the appliance, and that profile is the one that tolerates a
      # self-signed certificate. With `ui: shipped` there is no override,
      # and the suite derives the appliance's own /ui/ from TN_HOST.
      #
      # The TN_AD_* variables are the Active Directory test domain, from the
      # E2EUI_AD_* repository secrets; `directory-services-ad` skips without
      # TN_AD_DOMAIN. Unlike everything else the suite is given, they outlive
      # the job, which is why the specs that use them publish no trace (the
      # `unpublished` project in playwright.config.ts). Set on this step
      # only, not the job, so no other step or action sees them.
      - name: Run the suite
        uses: ./.github/actions/e2e-run
        env:
          TN_UI_BASE_URL: ${{ steps.ui.outputs.url }}
          TN_UI_BASE_URL_HTTP: ${{ steps.ui.outputs.http-url }}
          TN_AD_DOMAIN: ${{ secrets.E2EUI_AD_DOMAIN }}
          TN_AD_DC1: ${{ secrets.E2EUI_AD_DC1 }}
          TN_AD_DC2: ${{ secrets.E2EUI_AD_DC2 }}
          TN_AD_USERNAME: ${{ secrets.E2EUI_AD_USERNAME }}
          TN_AD_PASSWORD: ${{ secrets.E2EUI_AD_PASSWORD }}
          TN_AD_COMPUTER_OU: ${{ secrets.E2EUI_AD_COMPUTER_OU }}
        with:
          shard: ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
          grep: ${{ inputs.grep }}
          artifact-suffix: -${{ matrix.shard }}
          # The `report` job below reports over every shard at once.
          reports: 'false'
          env: |
            TN_AD_DOMAIN
            TN_AD_DC1
            TN_AD_DC2
            TN_AD_USERNAME
            TN_AD_PASSWORD
            TN_AD_COMPUTER_OU

      # What the appliance says, when anything failed or the job ran out of
      # time: its serial console, then from inside it Docker's and
      # middleware's own accounts, the apps datasets and the network. A job
      # cancelled at its ceiling is the one that needs these most, hence
      # cancelled(); every command is bounded and allowed to fail, so the step
      # ends inside the grace period a cancelled job gets. Into the job log
      # rather than an artifact, because the log is what can be read through
      # the API.
      #
      # This repository's logs are public: everything taken from middleware
      # or from inside the appliance goes through `grep -iv license`, as
      # e2e-ha.yml filters its middleware log, and the admin password is
      # masked by the boot step. And every line of the step goes through one
      # more filter, which drops any line naming a `TN_AD_*` value in any
      # case: the AD spec's refused join logs a traceback naming the domain in
      # capitals every run, which GitHub's masking, verbatim only, lets
      # through.
      #
      # appliance.sh has no `ssh` (ha.sh does). Its `boot-report` turns ssh
      # on for the admin, with a key and passwordless sudo, prints where the
      # boot's time went, and leaves that key at $APPLIANCE_DIR/report_key,
      # which is what the sections after it log in with.
      - name: The appliance's console, Docker, middleware and network
        if: failure() || cancelled()
        env:
          TN_AD_DOMAIN: ${{ secrets.E2EUI_AD_DOMAIN }}
          TN_AD_DC1: ${{ secrets.E2EUI_AD_DC1 }}
          TN_AD_DC2: ${{ secrets.E2EUI_AD_DC2 }}
          TN_AD_USERNAME: ${{ secrets.E2EUI_AD_USERNAME }}
          TN_AD_PASSWORD: ${{ secrets.E2EUI_AD_PASSWORD }}
          TN_AD_COMPUTER_OU: ${{ secrets.E2EUI_AD_COMPUTER_OU }}
        run: |
          # One fixed string per line, empties dropped: an empty pattern would
          # match, and so drop, every line. With no domain the file is empty
          # and nothing is dropped.
          ad_values="$RUNNER_TEMP/ad-values"
          printf '%s\n' "$TN_AD_DOMAIN" "$TN_AD_DC1" "$TN_AD_DC2" "$TN_AD_USERNAME" \
            "$TN_AD_PASSWORD" "$TN_AD_COMPUTER_OU" | sed '/^$/d' > "$ad_values"

          report() {
          echo "::group::The appliance's console"
          timeout 20 truenas-appliance console 300 || true
          echo "::endgroup::"

          echo "::group::Docker, as middleware reports it"
          timeout 20 truenas-appliance call docker.status 2>&1 | grep -iv license || true
          timeout 20 truenas-appliance call docker.config 2>&1 | grep -iv license || true
          echo "::endgroup::"

          echo "::group::The boot, from inside (and ssh for what follows)"
          timeout 90 truenas-appliance boot-report 2>&1 | grep -iv license || true
          echo "::endgroup::"

          key="$APPLIANCE_DIR/report_key"
          port="$(sed -n 's/^APPLIANCE_SSH_PORT=//p' "$APPLIANCE_DIR/state.env" 2>/dev/null || true)"
          on_appliance() {
            if [ ! -f "$key" ]; then
              echo "(no ssh into the appliance: the boot report did not set it up)"
              return
            fi
            timeout 40 ssh -i "$key" -p "${port:-2222}" -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
              "$TN_USERNAME@127.0.0.1" "$1" 2>&1 | grep -iv license || true
          }

          echo "::group::Docker"
          on_appliance 'sudo -n systemctl status docker --no-pager
            sudo -n journalctl -u docker --no-pager -n 300
            sudo -n journalctl -b --no-pager -p warning -n 200'
          echo "::endgroup::"

          echo "::group::Middleware's log, Docker and Apps"
          on_appliance 'sudo -n grep -ihE "docker|apps|ix-apps|catalog|traceback|error" /var/log/middlewared.log \
            | tail -n 300'
          echo "::endgroup::"

          echo "::group::The apps datasets, /run and the network"
          # shellcheck disable=SC2016 # expanded on the appliance, not here
          on_appliance 'for p in $(sudo -n zpool list -H -o name); do
              sudo -n zfs list -o name,mountpoint,mounted -r "$p/ix-apps"
            done
            df -h /run
            sudo -n du -xsh /run/* 2>/dev/null | sort -h | tail -n 5
            ip -br addr
            ip route
            sudo -n cat /etc/docker/daemon.json'
          echo "::endgroup::"
          }

          report 2>&1 | grep -ivF -f "$ad_values" || true

      # A leftover UI container would go on proxying to a destroyed appliance
      # and sit on the daemon forever. `--rm` covers a clean exit; this covers
      # the rest, including a container that started but never passed the
      # readiness gate. Found by the name e2e-serve-ui gives it, not by state
      # a failed step may never have written.
      - name: Stop the UI
        if: always() && env.DOCKER != ''
        run: $DOCKER ps -aq --filter "name=e2e-ui-${GITHUB_RUN_ID}-" | xargs -r $DOCKER rm -f > /dev/null 2>&1 || true

      # No release step: the appliance is deleted with the runner, on success,
      # failure and cancellation alike.

  # One coverage report and one timing report for the whole run. A shard's own
  # would count only the tests it ran, so the shards upload their records
  # (`e2e-coverage-<n>`, `e2e-timings-<n>`) and write no report, and this job
  # reports over all of them together.
  #
  # Coverage files are named by test id and attempt, so no shard's overwrite
  # another's; only `setup`, which every shard runs, keeps one copy of its
  # identical result. Timings stay a directory per shard, since a shard's
  # middleware calls are matched to its own tests by time. A shard that never
  # reached the suite uploads nothing, and each report says so rather than
  # passing off part of the run as all of it. Informational, as they were in
  # each shard: never fails the run.
  report:
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A shard's artifact per directory, so the reports can count them.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-coverage-*
          path: ${{ runner.temp }}/shards

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-timings-*
          path: ${{ runner.temp }}/shards

      # For the inventory side: the TypeScript compiler and tsx.
      - uses: ./.github/actions/prepare

      - name: Report coverage over every shard
        continue-on-error: true
        env:
          SHARDS: ${{ needs.plan.outputs.total }}
        run: |
          set -euo pipefail
          shards="$RUNNER_TEMP/shards"
          results="$RUNNER_TEMP/e2e-coverage"
          mkdir -p "$results"
          uploaded=0
          for dir in "$shards"/e2e-coverage-*/; do
            [ -d "$dir" ] || continue
            uploaded=$((uploaded + 1))
            find "$dir" -name '*.json' ! -name summary.json -exec cp {} "$results"/ \;
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "No shard uploaded coverage: none reached the suite."
            exit 0
          fi

          report="$RUNNER_TEMP/e2e-coverage.md"
          yarn e2e:coverage "$results" --out "$report"
          {
            if [ "$uploaded" -lt "$SHARDS" ]; then
              echo "> Only $uploaded of $SHARDS shards uploaded coverage, so this counts only the tests they ran."
              echo
            fi
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const { methods, routes } = require(process.argv[1]);
            const part = (name, { covered, total }) => `${name} ${covered}/${total} (${Math.round(covered / total * 100)}%)`;
            const partial = Number(process.argv[2]) < Number(process.argv[3]) ? ` (${process.argv[2]} of ${process.argv[3]} shards)` : "";
            console.log(`::notice title=E2E coverage${partial}::${part("methods", methods)}, ${part("routes", routes)}`);
          ' "$results/summary.json" "$uploaded" "$SHARDS"

      # The merged results and their summary.json, for `yarn e2e:coverage <dir>`
      # or a look at which tests covered what. Not `e2e-coverage-*`, which is
      # the shards' pattern above. Overwritten when the job is re-run.
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: ${{ runner.temp }}/e2e-coverage/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Report timings over every shard
        continue-on-error: true
        env:
          SHARDS: ${{ needs.plan.outputs.total }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/e2e-timings"
          mkdir -p "$results"
          uploaded=0
          # `tests.json` is written only when a shard's suite ends; one killed
          # partway uploads its middleware records alone, and counts as missing.
          for dir in "$RUNNER_TEMP"/shards/e2e-timings-*/; do
            [ -f "$dir/tests.json" ] || continue
            uploaded=$((uploaded + 1))
            cp -r "$dir" "$results/$(basename "$dir")"
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "No shard uploaded timings: none reached the suite."
            exit 0
          fi

          report="$results/report.md"
          yarn e2e:timings "$results" --out "$report" > /dev/null
          {
            if [ "$uploaded" -lt "$SHARDS" ]; then
              echo "> Only $uploaded of $SHARDS shards uploaded timings, so this covers only the tests they ran."
              echo
            fi
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every shard's records, the report and each test's breakdown
      # (`summary.json`), for `yarn e2e:timings <dir>` or a closer look.
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e-timings/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
