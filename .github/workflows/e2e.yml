# TrueNAS WebUI end-to-end suite.
#
# Deliberately smaller than the design in `e2e/docs/04-environment-architecture.md`.
# That design shards across appliances and reverts a VM snapshot between tests,
# and both need `ixnode` verbs that do not exist yet. This runs the shape that
# works with `ixnode` as it is today — claim one appliance, run the suite on it,
# release it — so the parts nobody has exercised get exercised: the runner
# reaching the appliance network, the claim/release contract, credentials
# arriving as environment variables, and teardown releasing after a failure.
#
# Sharding and snapshot restore are layered on once the verbs land, with a
# measured reason. See E1, E2 and E12 in the design.
#
# ─── The `pull_request` trigger is same-repo only, and must stay that way ────
#
# `truenas/webui` is a PUBLIC repository and this job runs on a SELF-HOSTED
# runner on the lab network with hypervisor access. An unguarded `pull_request`
# trigger lets anyone on the internet open a fork PR and execute code on that
# machine — GitHub's own guidance is not to pair self-hosted runners with public
# repositories for this reason.
#
# The guard is the `if:` on the job below: the head repository must be this
# repository, so a fork PR queues nothing. Never use `pull_request_target` with
# a checkout of PR code, which would defeat it. Configure the `e2e-lab`
# environment with required reviewers as a second line.
# ─────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  # Nightly, once this is trusted. Commented out while the pipeline is being
  # brought up, so the only runs are ones somebody asked for.
  # schedule:
  #   - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      grep:
        description: Optional Playwright --grep filter
        type: string
        default: ''

# Reads code, uploads artifacts. No reason to write to the repository.
permissions:
  contents: read

# The lab is one shared resource: two runs would destroy each other's pools.
# Queue rather than cancel — a cancelled run holds an appliance and leaks it.
concurrency:
  group: e2e-lab
  cancel-in-progress: false

jobs:
  e2e:
    # Fork PRs stop here. See the header.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, truenas-lab]
    # Gate for secrets, and the hook for required reviewers.
    environment: e2e-lab
    # Bounded because this holds the appliance, the runner and the concurrency
    # group at once. Without it the job inherits GitHub's 360-minute default and
    # a hang blocks the lab for six hours.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Claim an appliance
        run: |
          set -euo pipefail
          ./e2e/ci/appliance.sh claim fresh-install > "$RUNNER_TEMP/appliance.env"
          # The appliance password comes from ixnode, not from GitHub secrets, so
          # nothing masks it automatically. Register it before it can reach a log.
          echo "::add-mask::$(sed -n 's/^TN_PASSWORD=//p' "$RUNNER_TEMP/appliance.env")"
          cat "$RUNNER_TEMP/appliance.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/appliance.env"

      - name: Run the suite
        env:
          CI: 'true'
          # Passed as an environment variable, never interpolated into the shell
          # line: `${{ inputs.grep }}` there would be executed as code, on a
          # runner with hypervisor access.
          TN_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          if [ -n "${TN_GREP:-}" ]; then
            yarn playwright test --grep "$TN_GREP"
          else
            yarn playwright test
          fi

      # Must happen while the appliance still exists.
      - name: Collect middleware logs
        if: always()
        run: ./e2e/ci/appliance.sh collect-logs "${TN_HOST:-}" "test-results/appliance-logs"

      # Safe to publish: test names and failure messages, no attachments.
      #
      # Traces, videos and screenshots are NOT uploaded. Artifacts on a public
      # repository are downloadable by anyone, and a Playwright trace records
      # action parameters verbatim — including the appliance password `signIn`
      # types. The fix is a credential worthless once published: a unique
      # password per ixnode claim, and the appliance destroyed rather than
      # reused at release. Until that holds, diagnose from the job log.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      # Unconditional: an appliance left claimed is one the next run cannot use.
      # Reads the domain from the file `claim` wrote, so a failure between the
      # claim and `$GITHUB_ENV` being populated still releases.
      - name: Release the appliance
        if: always()
        run: ./e2e/ci/appliance.sh release "${TN_DOMAIN:-}"
