# A TrueNAS HA pair inside one truenas-lab-xlarge runner, its scale set
# attaching the appliance disk twice. The truenas-appliance-runner action
# boots the pair (ha: true) and hands it over unconfigured; ha_setup.py then
# makes it HA over the API and, unless told not to, fails over once.
#
# ha_setup.py stands in for the HA suite's first journeys, which will drive
# the same setup through the UI.
#
# Runs on every push to its branch while that is being built: a workflow
# that is not on the default branch cannot be dispatched.

name: E2E HA

on:
  push:
    branches: [ha-e2e]
  workflow_dispatch:
    inputs:
      failover:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha:
    runs-on: truenas-lab-xlarge
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Boot the HA pair
        uses: iXsystems/ux-github-workflows/.github/actions/truenas-appliance-runner@ha-mode
        with:
          ha: true
          memory-mb: 8192
          data-disk-count: 4

      - name: Make it HA
        env:
          LICENSE_URL: ${{ secrets.E2E_LICENSE_URL }}
          # Off only when a dispatch says so: a push has no inputs, and an
          # absent input compares equal to false.
          FAILOVER: ${{ github.event_name == 'workflow_dispatch' && !inputs.failover && 'false' || 'true' }}
        run: |
          set -euo pipefail
          pem="$RUNNER_TEMP/ha-license.txt"
          curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 30 \
            -X POST "$LICENSE_URL" -H 'Content-Type: application/json' -d '{"serial":"CI-HAA"}' \
            | jq -r '.license // empty' > "$pem"
          grep -q -- '-----BEGIN TRUENAS LICENSE-----' "$pem" \
            || { echo "::error::MES did not return a license for CI-HAA"; exit 1; }
          # tnctl, beside the script the action put on PATH.
          APPLIANCE_LIB="$(dirname "$(readlink -f "$(command -v truenas-appliance)")")"
          export APPLIANCE_LIB
          args=("$pem")
          [ "$FAILOVER" = true ] && args+=(--failover)
          python3 -u .github/e2e-ha/ha_setup.py "${args[@]}"

      - name: Consoles and shared storage
        if: always()
        run: |
          for n in a b; do
            echo "::group::node $n console"
            truenas-appliance console "$n" 300 || true
            echo "::endgroup::"
          done
          echo "::group::dnsmasq"
          cat "$APPLIANCE_DIR/dnsmasq.log" 2>/dev/null || true
          echo "::endgroup::"
          # What LIO holds for the shared LUNs: registrations and the
          # reservation, as the target sees them, and what the kernel said.
          echo "::group::LIO persistent reservations"
          for d in /sys/kernel/config/target/core/fileio_*/tnha*; do
            echo "== $d"
            for f in "$d"/pr/*; do
              printf '%s: ' "${f##*/}"; sudo -n cat "$f" 2>/dev/null | tr '\n' ' '; echo
            done
          done
          sudo -n dmesg | grep -iE 'target|reserv|aptpl' | tail -n 80 || true
          echo "::endgroup::"
