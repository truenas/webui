# A TrueNAS HA pair inside one truenas-lab-xlarge runner. Boots the two
# appliance disks its scale set attaches with .github/e2e-ha/ha.sh, then
# makes them HA over the API with ha_setup.py and, unless told not to,
# fails over once. The first step towards the HA suite: these pieces move
# into the truenas-appliance-runner action's HA mode once the pair works.
#
# Runs on every push to its branch while that is being built: a workflow
# that is not on the default branch cannot be dispatched.

name: E2E HA

on:
  push:
    branches: [ha-e2e]
  workflow_dispatch:
    inputs:
      failover:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha:
    runs-on: truenas-lab-xlarge
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the appliance scripts
        uses: actions/checkout@v4
        with:
          repository: iXsystems/ux-github-workflows
          path: ux-github-workflows

      - name: Boot the pair
        id: boot
        env:
          APPLIANCE_LIB: ${{ github.workspace }}/ux-github-workflows/.github/actions/truenas-appliance-runner
        run: |
          set -euo pipefail
          echo "APPLIANCE_LIB=$APPLIANCE_LIB" >> "$GITHUB_ENV"
          echo "HA_DIR=$RUNNER_TEMP/tn-ha" >> "$GITHUB_ENV"
          export HA_DIR="$RUNNER_TEMP/tn-ha"
          lsblk -p -o NAME,SIZE,SERIAL,FSTYPE,LABEL,MOUNTPOINT
          out="$(bash .github/e2e-ha/ha.sh start)"
          echo "$out"
          grep '^HA_' <<< "$out" >> "$GITHUB_ENV"

      - name: Make it HA
        env:
          LICENSE_URL: ${{ secrets.E2E_LICENSE_URL }}
          # Off only when a dispatch says so: a push has no inputs, and an
          # absent input compares equal to false.
          FAILOVER: ${{ github.event_name == 'workflow_dispatch' && !inputs.failover && 'false' || 'true' }}
        run: |
          set -euo pipefail
          pem="$RUNNER_TEMP/ha-license.txt"
          curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 30 \
            -X POST "$LICENSE_URL" -H 'Content-Type: application/json' -d '{"serial":"CI-HAA"}' \
            | jq -r '.license // empty' > "$pem"
          grep -q -- '-----BEGIN TRUENAS LICENSE-----' "$pem" \
            || { echo "::error::MES did not return a license for CI-HAA"; exit 1; }
          HA_PASSWORD="$(head -c 15 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::$HA_PASSWORD"
          export HA_PASSWORD
          args=("$pem")
          [ "$FAILOVER" = true ] && args+=(--failover)
          python3 -u .github/e2e-ha/ha_setup.py "${args[@]}"

      - name: Consoles and shared storage
        if: always()
        run: |
          for n in a b; do
            echo "::group::node $n console"
            bash .github/e2e-ha/ha.sh console "$n" 300 || true
            echo "::endgroup::"
          done
          echo "::group::dnsmasq"
          cat "$HA_DIR/dnsmasq.log" 2>/dev/null || true
          echo "::endgroup::"
          # What LIO holds for the shared LUNs: registrations and the
          # reservation, as the target sees them, and what the kernel said.
          echo "::group::LIO persistent reservations"
          for d in /sys/kernel/config/target/core/fileio_*/tnha*; do
            echo "== $d"
            for f in "$d"/pr/* "$d"/attrib/emulate_pr "$d"/attrib/pgr_support; do
              [ -r "$f" ] || sudo -n test -r "$f" || continue
              printf '%s: ' "${f##*/}"; sudo -n cat "$f" 2>/dev/null | tr '\n' ' '; echo
            done
          done
          sudo -n dmesg | grep -iE 'target|iscsi|reserv|pr ' | tail -n 80 || true
          echo "::endgroup::"
