name: 'E2E: Docker and the browser image'
description: 'Finds a usable Docker, pulls the Playwright image the suite runs in, and nginx when the UI is served.'

# The browser runs in Playwright's own image rather than on the runner: it
# ships Chromium and every library it needs, and its tag must match the
# installed @playwright/test exactly or Playwright refuses to launch, so the
# tag is read from node_modules rather than written down twice.
#
# Call it before the appliance boots, so a runner without a usable Docker
# fails early. The caller must have run ./.github/actions/prepare.
#
# With `start: true` the pulls run in the background, during the boot, and
# a second call without it, before the images are needed, waits for them.
#
# Sets DOCKER (the command: `docker`, or `sudo -n docker`), PLAYWRIGHT_IMAGE
# and NGINX_IMAGE in the job environment, for the other e2e-* actions.

inputs:
  nginx:
    description: "`true` pulls nginx too, for e2e-serve-ui."
    default: 'true'
  nginx-image:
    description: >-
      Serves the built UI. Debian-based on purpose: docker/nginx.conf runs as
      `www-data`, which the alpine image does not have.
    default: nginx:1.27
  start:
    description: "`true` pulls in the background; call the action again without it to wait for the pulls."
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NGINX: ${{ inputs.nginx }}
        NGINX_IMAGE: ${{ inputs.nginx-image }}
        START: ${{ inputs.start }}
      run: |
        set -euo pipefail
        if [ "$START" != true ] && [ -n "${E2E_BROWSER_PULL:-}" ]; then
          dir="$E2E_BROWSER_PULL"
          until [ -f "$dir.status" ] || [ "$SECONDS" -ge 900 ]; do sleep 2; done
          cat "$dir.log" 2>/dev/null || true
          echo "Waited ${SECONDS}s for the background pulls"
          status=$(cat "$dir.status" 2>/dev/null || echo unfinished)
          if [ "$status" != 0 ]; then
            echo "::error::Pulling $PLAYWRIGHT_IMAGE or $NGINX_IMAGE in the background did not succeed ($status)"
            exit 1
          fi
          exit 0
        fi
        # The runner user may or may not be allowed at the Docker socket
        # directly. `sudo -n` fails rather than prompting, because a prompt
        # here would hang the job for its full timeout.
        if docker info > /dev/null 2>&1; then
          docker=docker
        elif sudo -n docker info > /dev/null 2>&1; then
          docker="sudo -n docker"
        else
          echo "::error::No usable Docker: neither 'docker' nor 'sudo -n docker' can reach the daemon"
          exit 1
        fi
        version=$(node -p "require('@playwright/test/package.json').version")
        image="mcr.microsoft.com/playwright:v${version}-noble"
        # One list, not two statements: run behind `||` below, a function
        # ignores `set -e`, and a failed first pull would go unreported.
        pull() {
          $docker pull --quiet "$image" && { [ "$NGINX" != true ] || $docker pull --quiet "$NGINX_IMAGE"; }
        }
        if [ "$START" = true ]; then
          dir="$RUNNER_TEMP/e2e-browser-pull"
          # Detached from the step's output, or the step would wait for it.
          (
            status=0
            pull > "$dir.log" 2>&1 || status=$?
            echo "$status" > "$dir.status.partial" && mv "$dir.status.partial" "$dir.status"
          ) < /dev/null > /dev/null 2>&1 &
          echo "E2E_BROWSER_PULL=$dir" >> "$GITHUB_ENV"
          echo "Pulling $image in the background"
        else
          pull
        fi
        {
          echo "DOCKER=$docker"
          echo "PLAYWRIGHT_IMAGE=$image"
          echo "NGINX_IMAGE=$NGINX_IMAGE"
        } >> "$GITHUB_ENV"
