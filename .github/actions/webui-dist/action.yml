name: 'E2E: the UI under test'
description: "Finds the WebUI workflow's build of this commit (webui-dist) and downloads it, or builds the UI here when there is none. Sets UI_DIST."

# The UI under test is this checkout's, not the one baked into the
# appliance's ISO. main.yml's Build job already builds it, as the Debian
# package that ships, and uploads it as `webui-dist`; fetch.sh finds that
# WebUI run by commit and waits for the upload.
#
# Only a run that built the tree the job checked out counts: for a pull
# request, the WebUI run of the same head commit, which built the same merge
# commit; otherwise the push run of this commit, so a dispatch on master or
# the nightly finds master's. A dispatch on any other branch has none and
# builds here. So does a WebUI run that finished without the artifact, or
# one still going after twelve minutes. Each falls back to building rather
# than failing the job.
#
# The newest such run is taken. For a pull request that is the one that
# built this checkout's merge commit, except in one rare case: a re-run of an
# older attempt after master moved and a newer WebUI run of the same head
# commit built a newer merge.
#
# Call it once with `start: true` before the appliance boots, so the wait
# and the download run in the background during the boot, and again without
# it once the appliance is up, which waits for them and builds if they found
# nothing. Called only the second way, it does both in the foreground. Either
# way the build itself waits for the boot to be over: it runs while the
# appliance does, so their memory is in use at once, and only on that
# fallback.
#
# The calling job needs `actions: read`, for the runs and their artifacts.

inputs:
  start:
    description: "`true` only starts finding and downloading the build, in the background."
    default: 'false'

outputs:
  dist:
    description: The built UI's directory, also set as UI_DIST in the job environment.
    value: ${{ steps.build.outputs.dist }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        START: ${{ inputs.start }}
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The PR's branch, or the pushed one: a run of the same commit from
        # another PR (a fork's, or one to another base) built another tree.
        BRANCH: ${{ github.head_ref || github.ref_name }}
        FETCH: ${{ github.action_path }}/fetch.sh
      run: |
        set -euo pipefail
        if [ "$START" = true ]; then
          dir="$RUNNER_TEMP/webui-dist"
          # Detached from the step's output, or the step would wait for it.
          (
            status=0
            bash "$FETCH" "$dir" > "$dir.log" 2>&1 || status=$?
            echo "$status" > "$dir.status.partial" && mv "$dir.status.partial" "$dir.status"
          ) < /dev/null > /dev/null 2>&1 &
          echo "WEBUI_DIST_FETCH=$dir" >> "$GITHUB_ENV"
          echo "Finding and downloading webui-dist in the background"
        elif [ -n "${WEBUI_DIST_FETCH:-}" ]; then
          dir="$WEBUI_DIST_FETCH"
          # Past fetch.sh's own twelve-minute wait and its download.
          until [ -f "$dir.status" ] || [ "$SECONDS" -ge 900 ]; do sleep 2; done
          # Its notices become this step's annotations.
          cat "$dir.log" 2>/dev/null || true
          echo "Waited ${SECONDS}s for the background fetch"
          if [ ! -f "$dir.status" ]; then
            echo "::notice::The background fetch of webui-dist has not finished; building the UI here"
          elif [ "$(cat "$dir.status")" != 0 ]; then
            echo "::notice::The background fetch of webui-dist failed; building the UI here"
          fi
        else
          bash "$FETCH" "$RUNNER_TEMP/webui-dist"
        fi

    - id: build
      if: inputs.start != 'true'
      shell: bash
      env:
        DOWNLOADED: ${{ runner.temp }}/webui-dist/dist
      run: |
        set -euo pipefail
        # Same production build as main.yml's Build job, `--base-href /ui/`,
        # so it is served where the appliance's nginx would serve it.
        if [ -f "$DOWNLOADED/index.html" ]; then
          dist="$DOWNLOADED"
        else
          yarn build:prod
          dist="$GITHUB_WORKSPACE/dist"
        fi
        [ -f "$dist/index.html" ] || { echo "::error::$dist has no index.html"; exit 1; }
        echo "UI_DIST=$dist" >> "$GITHUB_ENV"
        echo "dist=$dist" >> "$GITHUB_OUTPUT"
